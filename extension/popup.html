<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=400">
<title>>_æ|</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 400px;
    min-height: 320px;
    background: #050505;
    color: #e2e8f0;
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }

  /* ── scanline overlay ── */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(212,160,23,0.015) 2px,
      rgba(212,160,23,0.015) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* ── vignette ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(5,5,5,0.75) 100%);
    pointer-events: none;
    z-index: 998;
  }

  /* ── header ── */
  .header {
    padding: 12px 16px 8px;
    border-bottom: 1px solid rgba(212,160,23,0.2);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header .glyph {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 18px;
    color: #d4a017;
    letter-spacing: -1px;
  }

  .header .cursor {
    width: 7px;
    height: 16px;
    background: #d4a017;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  /* ── input ── */
  .input-wrap {
    padding: 10px 16px;
    border-bottom: 1px solid rgba(212,160,23,0.1);
  }

  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .prompt-prefix {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: #d4a017;
    flex-shrink: 0;
  }

  #cmd {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #e2e8f0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    caret-color: #d4a017;
  }

  #cmd::placeholder {
    color: rgba(226,232,240,0.25);
  }

  /* ── results ── */
  .results {
    padding: 4px 0;
    max-height: 220px;
    overflow-y: auto;
  }

  .results::-webkit-scrollbar {
    width: 4px;
  }
  .results::-webkit-scrollbar-track {
    background: #050505;
  }
  .results::-webkit-scrollbar-thumb {
    background: rgba(212,160,23,0.3);
    border-radius: 2px;
  }

  .result-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    cursor: pointer;
    transition: background 0.1s;
  }

  .result-item:hover,
  .result-item.selected {
    background: rgba(212,160,23,0.08);
  }

  .result-item .icon {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: rgba(212,160,23,0.1);
    border: 1px solid rgba(212,160,23,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #d4a017;
    flex-shrink: 0;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
  }

  .result-item .text {
    flex: 1;
    min-width: 0;
  }

  .result-item .text .title {
    font-size: 12px;
    color: #e2e8f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-item .text .title .match {
    color: #d4a017;
    font-weight: 700;
  }

  .result-item .text .desc {
    font-size: 10px;
    color: rgba(226,232,240,0.45);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-item .shortcut {
    font-size: 9px;
    color: rgba(212,160,23,0.5);
    background: rgba(212,160,23,0.08);
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid rgba(212,160,23,0.15);
    flex-shrink: 0;
  }

  /* ── footer ── */
  .footer {
    padding: 8px 16px;
    border-top: 1px solid rgba(212,160,23,0.1);
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: rgba(226,232,240,0.3);
  }

  .footer kbd {
    background: rgba(212,160,23,0.08);
    border: 1px solid rgba(212,160,23,0.15);
    padding: 1px 4px;
    border-radius: 2px;
    color: rgba(212,160,23,0.5);
    font-family: inherit;
  }

  /* ── empty state ── */
  .empty {
    padding: 24px 16px;
    text-align: center;
    color: rgba(226,232,240,0.25);
    font-size: 11px;
  }

  .empty .big {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 900;
    color: rgba(212,160,23,0.2);
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<div class="header">
  <span class="glyph">>_æ|</span>
  <span class="cursor"></span>
</div>

<div class="input-wrap">
  <div class="input-row">
    <span class="prompt-prefix">æ</span>
    <input id="cmd" type="text" placeholder="#startabusiness  #sovaereign  $^æ  >_h  Cmd+K" autofocus spellcheck="false" autocomplete="off">
  </div>
</div>

<div class="results" id="results"></div>

<div class="footer">
  <span><kbd>↑↓</kbd> navigate  <kbd>↵</kbd> run  <kbd>esc</kbd> close</span>
  <span>æ.store · the namespace that connects all of it</span>
</div>

<script src="commands.js"></script>
<script src="popup.js"></script>
</body>
</html>
