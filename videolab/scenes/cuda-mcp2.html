<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px; overflow: hidden;
        background: #050505; color: #D4AF37;
        font-family: 'JetBrains Mono', 'Consolas', monospace;
      }
      #root {
        width: 100%; height: 100%; position: relative; overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 50%, rgba(212,175,55,0.08) 0%, transparent 60%),
          repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(212,175,55,0.03) 2px, rgba(212,175,55,0.03) 4px);
      }
      .scanlines {
        position: absolute; inset: 0; pointer-events: none; z-index: 100;
        background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.15) 3px, rgba(0,0,0,0.15) 4px);
      }
      .scene-content {
        display: flex; flex-direction: column; justify-content: center;
        width: 100%; height: 100%; padding: 80px 120px; gap: 40px;
      }
      .title {
        font-size: 96px; font-weight: 700; letter-spacing: -0.02em;
        color: #D4AF37; text-shadow: 0 0 40px rgba(212,175,55,0.4);
      }
      .subtitle {
        font-size: 36px; color: rgba(212,175,55,0.7); font-weight: 400;
        letter-spacing: 0.05em;
      }
      .metrics { display: flex; gap: 60px; margin-top: 20px; }
      .metric { display: flex; flex-direction: column; gap: 8px; }
      .metric-label {
        font-size: 18px; color: rgba(212,175,55,0.5); text-transform: uppercase;
        letter-spacing: 0.15em;
      }
      .metric-value {
        font-size: 48px; font-weight: 700; color: #D4AF37;
        text-shadow: 0 0 20px rgba(212,175,55,0.3);
      }
      .metric-unit { font-size: 24px; color: rgba(212,175,55,0.6); }
      .wireup { display: flex; align-items: center; gap: 40px; margin-top: 40px; }
      .node {
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        padding: 24px 32px; border: 1px solid rgba(212,175,55,0.3);
        border-radius: 8px; background: rgba(212,175,55,0.05);
      }
      .node-label { font-size: 20px; color: #D4AF37; font-weight: 600; }
      .node-sub { font-size: 14px; color: rgba(212,175,55,0.5); }
      .arrow { font-size: 32px; color: rgba(212,175,55,0.4); }
      .footer {
        position: absolute; bottom: 40px; left: 120px; right: 120px;
        display: flex; justify-content: space-between; align-items: center;
        font-size: 16px; color: rgba(212,175,55,0.4);
      }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-9hlr" id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1920" data-height="1080">
      <div data-hf-id="hf-8pzc" class="scanlines"></div>

        <div data-hf-id="hf-0lxk" id="metrics" class="metrics clip" data-start="1" data-duration="10" data-track-index="2">

        <div data-hf-id="hf-49f4" id="wireup" class="wireup clip" data-start="1.5" data-duration="9" data-track-index="3">

          <span data-hf-id="hf-v68i" class="arrow">→</span>
          <div data-hf-id="hf-7gt0" class="node">

          </div>
          <span data-hf-id="hf-f1jq" class="arrow">→</span>
          <div data-hf-id="hf-dywf" class="node pulse">
            <span data-hf-id="hf-0eyq" class="node-label">Victus</span>
            <span data-hf-id="hf-bf1n" class="node-sub">RTX 3050 6GB</span>
          </div>
        </div>
      </div>
      <div data-hf-id="hf-fu0t" id="footer" class="footer clip" data-start="0" data-duration="12" data-track-index="4">
        <span data-hf-id="hf-63ew">æ:// language is compute</span>
        <span data-hf-id="hf-r7kx">#hermiphicationisinevitable</span>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0);
      tl.fromTo("#subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.5);
      tl.fromTo("#metrics", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1);
      tl.fromTo("#wireup", { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 1.5);
      tl.fromTo(".footer", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
