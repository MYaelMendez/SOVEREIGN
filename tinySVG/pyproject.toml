[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinySVG"
version = "0.1.0"
description = "El instrumento soberano de las superficies vectoriales: mide el ancho de render, deriva la escala y se niega cuando la tipografia cae bajo el suelo de legibilidad."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Yæl Méndez", email = "yael@llm.store" }]
keywords = ["svg", "geometry", "legibility", "layout", "receipts", "opensourceware"]

[tool.setuptools]
py-modules = ["tinySVG"]
