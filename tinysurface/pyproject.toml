[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinySURFACE"
version = "0.1.0"
description = "El instrumento soberano de las superficies publicadas: audita badge y canonical, nombra las que faltan y las sella con tinyqr."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Yæl Méndez", email = "yael@llm.store" }]

[tool.setuptools]
py-modules = ["tinysurface"]
