<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080">
<title>internetofagents report 2026</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#050505;color:#D4AF37;font-family:'JetBrains Mono','Consolas',monospace}
  #root{position:relative;width:100%;height:100%}
  .scanlines{position:absolute;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.20) 3px,rgba(0,0,0,.20) 4px)}
  .header{position:absolute;top:0;left:0;right:0;height:70px;display:flex;align-items:center;padding:0 40px;border-bottom:1px solid rgba(212,175,55,.3);z-index:10}
  .header h1{font-size:28px;font-weight:700;letter-spacing:3px}
  .header .tag{position:absolute;right:40px;font-size:14px;opacity:.5}
  .panel{position:absolute;background:rgba(212,175,55,.04);border:1px solid rgba(212,175,55,.15);padding:20px}
  .panel h2{font-size:14px;font-weight:600;margin-bottom:12px;opacity:.7;letter-spacing:1px;border-bottom:1px solid rgba(212,175,55,.1);padding-bottom:6px}
  .bar{height:24px;background:rgba(212,175,55,.1);border-radius:2px;margin:4px 0;overflow:hidden;transition:width .8s ease}
  .bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#D4AF37,#00eaff);transition:width .8s cubic-bezier(.25,.4,.25,1)}
  .metric{text-align:center}
  .metric .num{font-size:28px;font-weight:700}
  .metric .lbl{font-size:10px;opacity:.5;text-transform:uppercase;letter-spacing:1px}
  .telemetry{position:absolute;bottom:0;left:0;right:0;height:40px;display:flex;align-items:center;padding:0 40px;border-top:1px solid rgba(212,175,55,.15);font-size:11px;opacity:.4;gap:30px}
  .telemetry .dot{width:6px;height:6px;border-radius:50%;background:#00eaa0;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .progress-bar{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,#D4AF37,#00eaff);z-index:20;transition:width .3s}
  .tag-badge{font-size:10px;padding:2px 8px;border-radius:3px}
  .tag-hot{background:rgba(255,80,80,.15);color:#ff5050;border:1px solid rgba(255,80,80,.3)}
  .tag-new{background:rgba(0,234,160,.15);color:#00eaa0;border:1px solid rgba(0,234,160,.3)}
  .tag-growth{background:rgba(212,175,55,.15);color:#D4AF37;border:1px solid rgba(212,175,55,.3)}
</style>
</head>
<body>
<div id="root">
  <div class="progress-bar" id="progress" style="width:0%"></div>
  <div class="header">
    <h1>#internetofagents report</h1>
    <span class="tag">creative intelligence 2026</span>
  </div>

  <div class="panel" style="top:80px;left:40px;width:880px;height:400px">
    <h2>AI ADOPTION BY DISCIPLINE</h2>
    <div id="discipline-bars"></div>
  </div>

  <div class="panel" style="top:80px;left:960px;width:920px;height:400px">
    <h2>MOST-USED TOOLS</h2>
    <div id="tools-bars"></div>
  </div>

  <div class="panel" style="top:520px;left:40px;width:880px;height:480px">
    <h2>FASTEST-GROWING (JOB SPEC MENTIONS H1 2026 vs H1 2025)</h2>
    <div id="growth-bars"></div>
  </div>

  <div class="panel" style="top:520px;left:960px;width:920px;height:480px">
    <h2>KEY METRICS</h2>
    <div id="metrics" style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-content:center;height:80%"></div>
  </div>

  <div class="telemetry">
    <span><span class="dot"></span>sovereign</span>
    <span id="count"></span>
    <span id="receipt"></span>
    <span style="margin-left:auto" id="clock"></span>
  </div>
  <div class="scanlines"></div>
</div>
<script>
(function(){
  var disciplines = [
    {name:"Web Development",val:76},
    {name:"Product Design",val:73},
    {name:"Web Design",val:72},
    {name:"Marketing",val:72},
    {name:"Video Editing",val:69},
    {name:"Graphic Design",val:66},
    {name:"Brand Design",val:66},
    {name:"Motion & Animation",val:66}
  ];
  var tools = [
    {name:"ChatGPT",val:25.8,tag:"hot"},
    {name:"Claude",val:18.7,tag:"growth"},
    {name:"Notion AI",val:14.8},
    {name:"Perplexity",val:5.6},
    {name:"Gamma",val:4.5},
    {name:"Figma Make",val:3.5}
  ];
  var growth = [
    {name:"Kling",val:25,tag:"growth"},
    {name:"Replit",val:14.6,tag:"growth"},
    {name:"Claude",val:11.6,tag:"growth"},
    {name:"Cursor",val:9.9,tag:"new"},
    {name:"Google Gemini",val:9.0},
    {name:"Runway",val:5.5},
    {name:"ElevenLabs",val:5.4},
    {name:"Lovable",val:5.0},
    {name:"ChatGPT",val:1.3}
  ];
  var metrics = [
    {num:"76%",lbl:"Top Adoption (Web Dev)"},
    {num:"25.8%",lbl:"ChatGPT Share"},
    {num:"25x",lbl:"Kling Growth"},
    {num:"66%",lbl:"Brand Design (Low)"}
  ];

  function bars(el, data, isGrowth){
    var max = Math.max.apply(null, data.map(function(d){return d.val}));
    el.innerHTML = data.map(function(d,i){
      var pct = (d.val/max)*100;
      var tag = d.tag ? ' <span class="tag-badge tag-'+d.tag+'">'+d.tag+'</span>' : '';
      var val = isGrowth ? 'x'+d.val : d.val+'%';
      var color = i===0 ? '#00eaff' : (d.tag==='new' ? '#00eaff' : 'linear-gradient(90deg,#D4AF37,#00eaff)');
      if(i>2 && !d.tag) color = 'rgba(212,175,55,.3)';
      return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px">'+d.name+tag+'</span><span style="font-size:12px;font-weight:700">'+val+'</span></div><div class="bar" style="width:'+pct+'%"><div class="bar-fill" style="width:100%;background:'+color+'"></div></div></div>';
    }).join('');
  }

  bars(document.getElementById('discipline-bars'), disciplines, false);
  bars(document.getElementById('tools-bars'), tools, false);
  bars(document.getElementById('growth-bars'), growth, true);

  document.getElementById('metrics').innerHTML = metrics.map(function(m){
    return '<div class="metric"><div class="num">'+m.num+'</div><div class="lbl">'+m.lbl+'</div></div>';
  }).join('');

  var total = disciplines.length + tools.length + growth.length + metrics.length;
  var done = 0;
  function tick(){
    done = Math.min(done+1,total);
    document.getElementById('progress').style.width = (done/total*100)+'%';
    if(done<total) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  var ts = Math.floor(Date.now()/1000);
  var payload = JSON.stringify({action:'internetofagents-report',ts:ts});
  var hash = Array.prototype.reduce.call(payload,function(a,b){a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);
  document.getElementById('receipt').textContent = 'sha256:'+(hash>>>0).toString(16).padStart(8,'0');
  document.getElementById('count').textContent = total+' data points';
  document.getElementById('clock').textContent = new Date().toISOString();
})();
</script>

       alt="QR Verify" style="width:100%;height:100%;display:block;">
</div>
</body>
</html>
