<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080">
<title>internetofagents report 2026</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#050505;color:#D4AF37;font-family:'JetBrains Mono','Consolas',monospace}
  #root{position:relative;width:100%;height:100%}
  .scanlines{position:absolute;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.20) 3px,rgba(0,0,0,.20) 4px)}
</style>
</head>
<body>
<div id="root" data-width="1920" data-height="1080">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div class="scanlines"></div>
</div>
<script>
(function(){
  var P=new URLSearchParams(location.search);
  var TITLE=P.get('title')||'#internetofagents report 2026';
  var TEXT=P.get('text')||'creative intelligence';
  var LINES=TEXT.split('|').map(function(s){return s.trim()}).filter(Boolean);

  var canv=document.getElementById('c');
  var ctx=canv.getContext('2d');
  var W=1920,H=1080,GOLD='#D4AF37',CYAN='#00eaff',GREEN='#00eaa0',RED='#ff5050';

  function hexA(h,a){h=h.replace('#','');return'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+','+a+')'}

  var disciplines=[
    {name:'Web Development',val:76},
    {name:'Product Design',val:73},
    {name:'Web Design',val:72},
    {name:'Marketing',val:72},
    {name:'Video Editing',val:69},
    {name:'Graphic Design',val:66},
    {name:'Brand Design',val:66},
    {name:'Motion & Animation',val:66}
  ];
  var tools=[
    {name:'ChatGPT',val:25.8},
    {name:'Claude',val:18.7},
    {name:'Notion AI',val:14.8},
    {name:'Perplexity',val:5.6},
    {name:'Gamma',val:4.5},
    {name:'Figma Make',val:3.5}
  ];
  var growth=[
    {name:'Kling',val:25},
    {name:'Replit',val:14.6},
    {name:'Claude',val:11.6},
    {name:'Cursor',val:9.9},
    {name:'Google Gemini',val:9.0},
    {name:'Runway',val:5.5},
    {name:'ElevenLabs',val:5.4},
    {name:'Lovable',val:5.0},
    {name:'ChatGPT',val:1.3}
  ];

  function drawBar(x,y,w,h,pct,color,label,val){
    ctx.fillStyle='rgba(212,175,55,0.08)';
    ctx.fillRect(x,y,w,h);
    ctx.fillStyle=color;
    ctx.fillRect(x,y,w*pct,h);
    ctx.fillStyle=hexA(GOLD,0.7);
    ctx.font='11px "JetBrains Mono",monospace';
    ctx.textAlign='left';
    ctx.fillText(label,x,y-4);
    ctx.textAlign='right';
    ctx.fillStyle=hexA(CYAN,0.9);
    ctx.fillText(val,x+w,y-4);
  }

  function render(p){
    p=Math.max(0,Math.min(1,p));
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0a0f1a');g.addColorStop(0.5,'#050505');g.addColorStop(1,'#0a0f1a');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    var aura=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,900);
    aura.addColorStop(0,hexA(GOLD,0.06));aura.addColorStop(1,hexA(GOLD,0));
    ctx.fillStyle=aura;ctx.fillRect(0,0,W,H);

    for(var i=0;i<120;i++){
      var x=(i*137.508+p*60)%W,y=(i*97.31+p*40)%H;
      var tw=0.5+0.5*Math.sin(p*Math.PI*2+i);
      ctx.fillStyle=hexA(GOLD,0.12*tw);
      ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill();
    }

    ctx.font='700 32px "JetBrains Mono",monospace';
    ctx.fillStyle=hexA(GOLD,0.9);ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.fillText(TITLE,W/2,60);
    ctx.font='400 14px "JetBrains Mono",monospace';
    ctx.fillStyle=hexA(GOLD,0.4);
    ctx.fillText('creative intelligence 2026 · contralabs data · sovereign visualization',W/2,85);

    // Panel 1: AI Adoption by Discipline
    var p1x=40,p1y=110,p1w=880,p1h=380;
    ctx.strokeStyle=hexA(GOLD,0.15);ctx.strokeRect(p1x,p1y,p1w,p1h);
    ctx.fillStyle=hexA(GOLD,0.6);ctx.font='600 14px "JetBrains Mono",monospace';ctx.textAlign='left';
    ctx.fillText('AI ADOPTION BY DISCIPLINE',p1x+16,p1y+24);
    var maxD=76;
    var barH=30,barGap=8;
    for(var di=0;di<disciplines.length;di++){
      var d=disciplines[di];
      var by=p1y+40+di*(barH+barGap);
      var bw=(d.val/maxD)*(p1w-120);
      var reveal=Math.max(0,Math.min(1,(p-0.1-di*0.05)/0.3));
      drawBar(p1x+16,by,bw,barH,reveal,di<3?CYAN:hexA(GOLD,0.5),d.name,d.val+'%');
    }

    // Panel 2: Most-Used Tools
    var p2x=960,p2y=110,p2w=920,p2h=380;
    ctx.strokeStyle=hexA(GOLD,0.15);ctx.strokeRect(p2x,p2y,p2w,p2h);
    ctx.fillStyle=hexA(GOLD,0.6);ctx.font='600 14px "JetBrains Mono",monospace';ctx.textAlign='left';
    ctx.fillText('MOST-USED TOOLS',p2x+16,p2y+24);
    var maxT=25.8;
    for(var ti=0;ti<tools.length;ti++){
      var t=tools[ti];
      var by=p2y+40+ti*(barH+barGap);
      var bw=(t.val/maxT)*(p2w-120);
      var reveal=Math.max(0,Math.min(1,(p-0.15-ti*0.05)/0.3));
      drawBar(p2x+16,by,bw,barH,reveal,ti===0?CYAN:ti===1?GREEN:hexA(GOLD,0.4),t.name,t.val+'%');
    }

    // Panel 3: Fastest-Growing
    var p3x=40,p3y=520,p3w=880,p3h=480;
    ctx.strokeStyle=hexA(GOLD,0.15);ctx.strokeRect(p3x,p3y,p3w,p3h);
    ctx.fillStyle=hexA(GOLD,0.6);ctx.font='600 14px "JetBrains Mono",monospace';ctx.textAlign='left';
    ctx.fillText('FASTEST-GROWING (JOB SPEC MENTIONS H1 2026 vs H1 2025)',p3x+16,p3y+24);
    var maxG=25;
    for(var gi=0;gi<growth.length;gi++){
      var gr=growth[gi];
      var by=p3y+40+gi*(barH+barGap);
      var bw=(gr.val/maxG)*(p3w-120);
      var reveal=Math.max(0,Math.min(1,(p-0.2-gi*0.04)/0.3));
      var col=gi<3?CYAN:gi<6?GREEN:hexA(GOLD,0.35);
      drawBar(p3x+16,by,bw,barH,reveal,col,gr.name,'x'+gr.val);
    }

    // Panel 4: Key Metrics
    var p4x=960,p4y=520,p4w=920,p4h=480;
    ctx.strokeStyle=hexA(GOLD,0.15);ctx.strokeRect(p4x,p4y,p4w,p4h);
    ctx.fillStyle=hexA(GOLD,0.6);ctx.font='600 14px "JetBrains Mono",monospace';ctx.textAlign='left';
    ctx.fillText('KEY METRICS',p4x+16,p4y+24);
    var metrics=[
      {num:'76%',lbl:'Top Adoption (Web Dev)'},
      {num:'25.8%',lbl:'ChatGPT Share'},
      {num:'25x',lbl:'Kling Growth'},
      {num:'66%',lbl:'Brand Design (Low)'}
    ];
    for(var mi=0;mi<metrics.length;mi++){
      var m=metrics[mi];
      var mx=p4x+20+(mi%2)*440,my=p4y+60+Math.floor(mi/2)*180;
      var reveal=Math.max(0,Math.min(1,(p-0.3-mi*0.1)/0.3));
      ctx.globalAlpha=reveal;
      ctx.font='700 48px "JetBrains Mono",monospace';
      ctx.fillStyle=mi===0?CYAN:mi===1?GREEN:GOLD;
      ctx.textAlign='center';
      ctx.fillText(m.num,mx+200,my+60);
      ctx.font='400 12px "JetBrains Mono",monospace';
      ctx.fillStyle=hexA(GOLD,0.5);
      ctx.fillText(m.lbl,mx+200,my+85);
      ctx.globalAlpha=1;
    }

    ctx.fillStyle=hexA(CYAN,0.5);ctx.fillRect(0,H-6,W*p,4);

    ctx.font='400 11px "JetBrains Mono",monospace';
    ctx.fillStyle=hexA(GOLD,0.35);ctx.textAlign='left';
    ctx.fillText('supervisionvidaeo:// · internetofagents-report',40,H-50);
    ctx.textAlign='right';
    ctx.fillText('sha256:faedda25...',W-40,H-50);

    if(LINES.length){
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font='600 28px "JetBrains Mono",monospace';
      for(var li=0;li<LINES.length;li++){
        var lp2=Math.max(0,Math.min(1,(p-0.85)/0.15));
        ctx.fillStyle=hexA('#ffd98a',0.85*lp2);
        ctx.fillText(LINES[li],W/2,H-100+li*40);
      }
    }

    var sy=((p*1.4)%1)*H;
    var sg=ctx.createLinearGradient(0,sy-80,0,sy+80);
    sg.addColorStop(0,'rgba(0,234,255,0)');sg.addColorStop(0.5,'rgba(0,234,255,0.045)');sg.addColorStop(1,'rgba(0,234,255,0)');
    ctx.fillStyle=sg;ctx.fillRect(0,sy-80,W,160);
  }

  window.__renderFrame=function(i,total){render(i/Math.max(1,total-1))};
  render(0);
})();
</script>

</body>
</html>
