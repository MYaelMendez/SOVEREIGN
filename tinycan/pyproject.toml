[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinycan"
version = "0.1.0"
description = "The bus between the policy and the motors, simulated and graded. Asimov-1 topology."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Yael Mendez", email = "yael@llm.store" }]
keywords = ["can-bus", "spi", "robotics", "firmware", "deterministic", "asimov"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tinycan = "tinycan:main"

[project.urls]
Homepage = "https://myaelmendez.github.io"
Repository = "https://github.com/MYaelMendez/tinycan"

[tool.setuptools]
py-modules = ["tinycan"]
