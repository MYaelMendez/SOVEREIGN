[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyqr"
version = "0.1.0"
description = "El instrumento soberano del chip QR: firma de extremo a extremo, emisión con receipt, verificación y grado de reproducibilidad."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Yæl Méndez", email = "yael@llm.store" }]
keywords = ["qr", "ed25519", "identity", "receipts", "opensourceware"]

[tool.setuptools]
py-modules = ["tinyqr"]
