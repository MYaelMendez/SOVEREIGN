<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>rændær:// text — The Human Loop</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; }
  canvas { display: block; }
  #overlay {
    position: fixed; bottom: 40px; left: 40px; right: 40px;
    color: #FFD700; font-family: 'JetBrains Mono', monospace;
    font-size: 22px; line-height: 1.5; pointer-events: none;
    text-shadow: 0 0 8px rgba(255,215,0,0.5);
  }
  #text {
    position: fixed; bottom: 150px; left: 50px; right: 50px;
    color: #FFD700; font-family: 'JetBrains Mono', monospace;
    font-size: 72px; font-weight: 900; line-height: 1.2;
    text-shadow: 0 0 30px rgba(255,215,0,0.9), 0 0 80px rgba(255,215,0,0.5);
    opacity: 1;
  }
  #sub {
    position: fixed; bottom: 90px; left: 50px; right: 50px;
    color: #FFD700; font-family: 'JetBrains Mono', monospace;
    font-size: 20px; letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(255,215,0,0.5);
    opacity: 1;
  }
</style>
</head>
<body>
<div id="text">æ://  →  the human loop</div>
<div id="sub">render.mjs  ·  text → video  ·  rændær://  ·  2026</div>
<div id="overlay"></div>
<script type="importmap">
{
  "imports": { "three": "../vendor/three.module.js" }
}
</script>
<script type="module">
import * as THREE from 'three';

// ── Scene ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

const camera = new THREE.PerspectiveCamera(45, 1280/720, 0.1, 100);
camera.position.set(0, 0, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1280, 720);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

// ── Ambient light to brighten the scene ──
const ambient = new THREE.AmbientLight(0x404040, 1.5);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xFFD700, 2.0);
dirLight.position.set(5, 5, 5);
scene.add(dirLight);
const dirLight2 = new THREE.DirectionalLight(0xFFD700, 1.5);
dirLight2.position.set(-5, -3, 3);
scene.add(dirLight2);

// ── 3D text (bright gold) ──
function makeTextMesh(label, size, opacity) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.font = `bold ${size}px 'JetBrains Mono', monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(255,215,0,0.9)';
  ctx.shadowBlur = 30;
  ctx.fillStyle = '#FFD700';
  ctx.fillText(label, 256, 128);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    opacity: opacity,
    depthWrite: false,
  });
  const geo = new THREE.PlaneGeometry(size * 1.6, size * 0.8);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(0, 0, 0);
  return mesh;
}

const text1 = makeTextMesh('æ://  →  the human loop', 3.4, 0.95);
scene.add(text1);

const text2 = makeTextMesh('the human loop', 1.4, 0.75);
text2.position.y = -0.25;
text2.rotation.x = 0.05;
scene.add(text2);

// ── Particles ──
const particles = new THREE.BufferGeometry();
const pCount = 3000;
const pPos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount; i++) {
  pPos[i*3] = (Math.random() - 0.5) * 16;
  pPos[i*3+1] = (Math.random() - 0.5) * 8;
  pPos[i*3+2] = (Math.random() - 0.5) * 10 - 3;
}
particles.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({
  color: 0xFFD700,
  size: 0.12,
  transparent: true,
  opacity: 0.8,
  blending: THREE.AdditiveBlending,
});
const pSystem = new THREE.Points(particles, pMat);
scene.add(pSystem);

// ── Deterministic render hook ──
let driven = false;

function applyFrame(t) {
  const time = t * 6;
  pSystem.rotation.y = time * 0.3;
  pSystem.rotation.x = Math.sin(time * 0.5) * 0.15;
  pSystem.material.opacity = 0.4 + 0.4 * (0.5 + 0.5 * Math.sin(time * 1.3));
  const ov = document.getElementById('overlay');
  if (ov) {
    const phase = 0.5 + 0.5 * Math.sin(time * 0.8);
    ov.style.opacity = Math.max(0, Math.min(1, phase));
    ov.textContent = `rændær:// text  ·  ${String(Math.floor(time % 6))}:${String(Math.floor((time % 1) * 60)).padStart(2,'0')}`;
  }
  const o = document.getElementById('text');
  const s = document.getElementById('sub');
  if (o) o.style.opacity = 0.9 + 0.1 * (0.5 + 0.5 * Math.sin(time * 0.6));
  if (s) s.style.opacity = 0.7 + 0.3 * (0.5 + 0.5 * Math.sin(time * 0.4 + 1.2));
  renderer.render(scene, camera);
}

window.__renderFrame = (i, total) => {
  driven = true;
  applyFrame(i / Math.max(1, total - 1));
  return true;
};

applyFrame(0);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  if (!driven) applyFrame(clock.getElapsedTime() / 6);
}
animate();
</script>
</body>
</html>
