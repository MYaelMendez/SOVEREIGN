<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSIDE COMPUTE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    font-family: 'JetBrains Mono', monospace; color: #D4AF37;
  }
  .title {
    position: absolute; top: 40px; left: 0; right: 0; text-align: center;
    font-size: 22px; letter-spacing: 8px; font-weight: 700;
    text-shadow: 0 0 24px rgba(212,175,55,0.6);
  }
  .subtitle {
    position: absolute; top: 76px; left: 0; right: 0; text-align: center;
    font-size: 10px; letter-spacing: 3px; color: rgba(212,175,55,0.5);
  }
  .caption {
    position: absolute; bottom: 90px; left: 0; right: 0; text-align: center;
    font-size: 13px; letter-spacing: 2px; color: rgba(240,236,228,0.75);
    transition: opacity 0.4s;
  }
  .stat {
    position: absolute; bottom: 56px; left: 0; right: 0; text-align: center;
    font-size: 10px; letter-spacing: 2px; color: rgba(212,175,55,0.45);
  }
  .brand {
    position: absolute; bottom: 24px; left: 0; right: 0; text-align: center;
    font-size: 11px; letter-spacing: 4px; color: #D4AF37;
  }
</style>
</head>
<body>
<div id="hud">
  <div class="title" id="title">INSIDE COMPUTE</div>
  <div class="subtitle" id="subtitle">RTX 3050 · 6 GB · CUDA 8.6</div>
  <div class="caption" id="caption">booting…</div>
  <div class="stat" id="stat"></div>
  <div class="brand">æ://</div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 720, H = 1280, FPS = 30;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.FogExp2(0x050505, 0.03);

const camera = new THREE.PerspectiveCamera(58, W / H, 0.1, 200);
camera.position.set(0, 0, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ── Lighting ──
scene.add(new THREE.AmbientLight(0x223344, 0.7));
const l1 = new THREE.PointLight(0xD4AF37, 3, 40); l1.position.set(3, 4, 5); scene.add(l1);
const l2 = new THREE.PointLight(0x00eaff, 2, 30); l2.position.set(-4, -2, 3); scene.add(l2);

const GOLD = new THREE.Color(0xD4AF37);
const CYAN = new THREE.Color(0x00eaff);
const NEON = new THREE.Color(0x00ff9d);
const AMBER = new THREE.Color(0xffaa33);

// ══════════════════════════════════════════════════════════
// LAYER 1: THE DIE — a wireframe chip substrate seen from inside
// ══════════════════════════════════════════════════════════
const dieGroup = new THREE.Group();
scene.add(dieGroup);

// Chip package (outer box, wireframe)
const pkg = new THREE.Mesh(
  new THREE.BoxGeometry(6, 6, 6),
  new THREE.MeshBasicMaterial({ color: 0x1a2a3a, wireframe: true, transparent: true, opacity: 0.25 })
);
dieGroup.add(pkg);

// Silicon die (inner slab)
const die = new THREE.Mesh(
  new THREE.BoxGeometry(4.2, 0.2, 4.2),
  new THREE.MeshStandardMaterial({ color: 0x0a1a2a, metalness: 0.9, roughness: 0.3 })
);
die.position.y = -1.8;
dieGroup.add(die);

// ══════════════════════════════════════════════════════════
// LAYER 2: SM CORES — 4x4 grid of compute units on the die
// ══════════════════════════════════════════════════════════
const cores = [];
const CORE_N = 4;
const coreGeo = new THREE.BoxGeometry(0.8, 0.25, 0.8);
const coreMat = new THREE.MeshStandardMaterial({
  color: 0xD4AF37, emissive: 0xD4AF37, emissiveIntensity: 0.2,
  metalness: 0.8, roughness: 0.2,
});
for (let r = 0; r < CORE_N; r++) {
  for (let c = 0; c < CORE_N; c++) {
    const m = new THREE.Mesh(coreGeo, coreMat.clone());
    m.position.set((c - (CORE_N-1)/2) * 1.05, -1.6, (r - (CORE_N-1)/2) * 1.05);
    dieGroup.add(m);
    cores.push({ m, phase: (r * CORE_N + c) * 0.37, r, c });
  }
}

// ══════════════════════════════════════════════════════════
// LAYER 3: INSTRUCTION BUSES — glowing traces between cores
// ══════════════════════════════════════════════════════════
const busGroup = new THREE.Group();
dieGroup.add(busGroup);
const busMat = new THREE.MeshBasicMaterial({ color: 0x00eaff, transparent: true, opacity: 0.5 });
for (let i = 0; i < CORE_N; i++) {
  // horizontal bus
  const h = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.03, 0.05), busMat);
  h.position.set(0, -1.42, (i - (CORE_N-1)/2) * 1.05);
  busGroup.add(h);
  // vertical bus
  const v = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.03, 4.4), busMat);
  v.position.set((i - (CORE_N-1)/2) * 1.05, -1.42, 0);
  busGroup.add(v);
}

// ══════════════════════════════════════════════════════════
// LAYER 4: DATA PACKETS — glowing points racing along the buses
// ══════════════════════════════════════════════════════════
const PACKETS = 600;
const pktGeo = new THREE.BufferGeometry();
const pktPos = new Float32Array(PACKETS * 3);
const pktCol = new Float32Array(PACKETS * 3);
const pktMeta = []; // {axis, lane, speed, offset}
for (let i = 0; i < PACKETS; i++) {
  const axis = Math.random() < 0.5 ? 'h' : 'v';
  const lane = (Math.floor(Math.random() * CORE_N) - (CORE_N-1)/2) * 1.05;
  const speed = 1.5 + Math.random() * 3.5;
  const offset = Math.random() * 4.4 - 2.2;
  pktMeta.push({ axis, lane, speed, offset });
  const col = Math.random() < 0.5 ? CYAN : (Math.random() < 0.5 ? NEON : AMBER);
  pktCol[i*3] = col.r; pktCol[i*3+1] = col.g; pktCol[i*3+2] = col.b;
  pktPos[i*3] = 0; pktPos[i*3+1] = -1.4; pktPos[i*3+2] = 0;
}
pktGeo.setAttribute('position', new THREE.BufferAttribute(pktPos, 3));
pktGeo.setAttribute('color', new THREE.BufferAttribute(pktCol, 3));
const pktMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute vec3 aMeta; // axis(0=h,1=v), lane, speed
    uniform float uTime;
    varying vec3 vColor;
    void main(){
      vColor = color;
      vec3 p = position;
      float t = uTime * aMeta.z + position.x * 0.0;
      float span = 4.4;
      float pos = mod(t, span) - span*0.5;
      if (aMeta.x < 0.5) { p.x = pos; p.z = aMeta.y; }
      else               { p.z = pos; p.x = aMeta.y; }
      p.y = -1.4;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 5.0 * (300.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float a = pow(1.0 - d*2.0, 2.0);
      gl_FragColor = vec4(vColor, a);
    }
  `,
  vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
});
// pack metadata into an attribute
const metaArr = new Float32Array(PACKETS * 3);
pktMeta.forEach((m, i) => {
  metaArr[i*3] = m.axis === 'h' ? 0 : 1;
  metaArr[i*3+1] = m.lane;
  metaArr[i*3+2] = m.speed;
});
pktGeo.setAttribute('aMeta', new THREE.BufferAttribute(metaArr, 3));
const packets = new THREE.Points(pktGeo, pktMat);
dieGroup.add(packets);

// ══════════════════════════════════════════════════════════
// LAYER 5: THE WAFER — thousands of microscopic transistors
// ══════════════════════════════════════════════════════════
const TRANSISTORS = 4000;
const trGeo = new THREE.BufferGeometry();
const trPos = new Float32Array(TRANSISTORS * 3);
const trCol = new Float32Array(TRANSISTORS * 3);
const trSeed = new Float32Array(TRANSISTORS);
for (let i = 0; i < TRANSISTORS; i++) {
  trPos[i*3]   = (Math.random() - 0.5) * 4.0;
  trPos[i*3+1] = -1.9 + Math.random() * 0.05;
  trPos[i*3+2] = (Math.random() - 0.5) * 4.0;
  const c = new THREE.Color().setHSL(0.12 + Math.random()*0.05, 0.7, 0.35 + Math.random()*0.25);
  trCol[i*3] = c.r; trCol[i*3+1] = c.g; trCol[i*3+2] = c.b;
  trSeed[i] = Math.random();
}
trGeo.setAttribute('position', new THREE.BufferAttribute(trPos, 3));
trGeo.setAttribute('color', new THREE.BufferAttribute(trCol, 3));
trGeo.setAttribute('aSeed', new THREE.BufferAttribute(trSeed, 1));
const trMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute float aSeed; uniform float uTime;
    varying vec3 vColor; varying float vFlicker;
    void main(){
      vColor = color;
      vFlicker = 0.35 + 0.65 * step(0.5, fract(aSeed * 13.7 + uTime * 0.6));
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = 2.0 * (300.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor; varying float vFlicker;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      gl_FragColor = vec4(vColor * vFlicker, (1.0 - d*2.0) * vFlicker);
    }
  `,
  vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
});
const transistors = new THREE.Points(trGeo, trMat);
dieGroup.add(transistors);

// ══════════════════════════════════════════════════════════
// LAYER 6: POWER RAILS — vertical energy columns at the edges
// ══════════════════════════════════════════════════════════
const railMat = new THREE.MeshBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0.35 });
for (let i = 0; i < 4; i++) {
  const a = (i / 4) * Math.PI * 2 + Math.PI/4;
  const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 3.6, 6), railMat);
  rail.position.set(Math.cos(a) * 2.6, -0.2, Math.sin(a) * 2.6);
  dieGroup.add(rail);
}

// ══════════════════════════════════════════════════════════
// POST: bloom + grade
// ══════════════════════════════════════════════════════════
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.85, 0.55, 0.8));

const GradePass = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(W, H) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes;
    varying vec2 vUv;
    float rand(vec2 c){ return fract(sin(dot(c, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      vec2 d = vUv - 0.5; float r2 = dot(d,d);
      float ca = 0.0018 + r2*0.005;
      vec3 col;
      col.r = texture2D(tDiffuse, vUv + d*ca).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - d*ca).b;
      col *= smoothstep(1.15, 0.25, r2*2.2);
      col *= 1.0 - 0.05*step(0.5, fract(vUv.y*uRes.y*0.5));
      col += (rand(vUv*uRes + uTime) - 0.5) * 0.03;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
};
const gradePass = new ShaderPass(GradePass);
composer.addPass(gradePass);
composer.addPass(new OutputPass());

// ══════════════════════════════════════════════════════════
// NARRATIVE — captions keyed to deterministic time
// ══════════════════════════════════════════════════════════
const CAPTIONS = [
  { t: 0.0,  c: 'inside compute' },
  { t: 3.0,  c: '16 streaming multiprocessors' },
  { t: 6.0,  c: 'data races along the buses' },
  { t: 9.0,  c: '4,000 transistors, switching' },
  { t: 12.0, c: 'æRTXvideo · zero cloud' },
];
const captionEl = document.getElementById('caption');
const statEl = document.getElementById('stat');
let lastCaption = '';

// ══════════════════════════════════════════════════════════
// DETERMINISTIC FRAME — the æRTXrender contract
// ══════════════════════════════════════════════════════════
function applyFrame(t) {
  pktMat.uniforms.uTime.value = t;
  trMat.uniforms.uTime.value = t;
  gradePass.uniforms.uTime.value = t;

  // Cores pulse — compute activity sweeping across the die
  cores.forEach(({ m, phase }) => {
    const pulse = 0.15 + 0.85 * Math.max(0, Math.sin(t * 1.4 + phase));
    m.material.emissiveIntensity = 0.15 + pulse * 0.9;
    m.material.emissive.setRGB(
      0.83 * (0.5 + pulse*0.5),
      0.69 * (0.5 + pulse*0.5),
      0.22 * (0.5 + pulse*0.5)
    );
    m.scale.y = 1 + pulse * 0.5;
  });

  // Camera drifts through the package
  const ang = t * 0.08;
  camera.position.x = Math.sin(ang) * 3.2;
  camera.position.z = 9 - t * 0.12;
  camera.position.y = Math.sin(t * 0.15) * 0.6;
  camera.lookAt(0, -1.0, 0);

  // Die rotation
  dieGroup.rotation.y = t * 0.05;

  // Captions
  let cap = CAPTIONS[0].c;
  for (const c of CAPTIONS) if (t >= c.t) cap = c.c;
  if (cap !== lastCaption) {
    captionEl.textContent = cap;
    captionEl.style.opacity = 1;
    lastCaption = cap;
  }
  statEl.textContent = `${(t).toFixed(1)}s · ${cores.length} SMs · ${TRANSISTORS} transistors · ${PACKETS} packets`;
}

// Real-time preview until the harness takes over
const clock = new THREE.Clock();
let driven = false;
function animate() {
  requestAnimationFrame(animate);
  if (driven) return;
  const t = clock.getElapsedTime();
  applyFrame(t);
  composer.render();
}
animate();

window.__renderFrame = (i, total) => {
  driven = true;
  applyFrame(i / FPS);
  composer.render();
  return true;
};

window.__INSIDE_COMPUTE__ = { ready: true, cores: cores.length, transistors: TRANSISTORS, packets: PACKETS, deterministic: true };
</script>

" onmouseover="this.style.transform='scale(1.1)';this.style.boxShadow='0 0 20px rgba(212,175,55,0.4)'"
   onmouseout="this.style.transform='scale(1)';this.style.boxShadow='none'"
