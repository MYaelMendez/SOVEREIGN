<style>

  .vlc-header {

  .vlc-state {

    border-radius: 3px;

    color: #ff4444;

  .vlc-state.playing { background: rgba(0,255,157,0.15); color: #00ff9d; }
  .vlc-state.paused { background: rgba(212,175,55,0.15); color: #D4AF37; }

  {

let currentScriptIndex = 0;
let playing = false;
let speed = 1.0;
let fontSize = 22;
let scrollY = 0;
let mirror = false;
let lastTime = 0;
let rafId = null;

const textEl = document.getElementById('text');
const container = document.getElementById('text-container');
const statusEl = document.getElementById('status');
const editPanel = document.getElementById('edit-panel');
const editTextarea = document.getElementById('edit-textarea');
const scriptPanel = document.getElementById('script-panel');
const scriptList = document.getElementById('script-list');

function renderText() {
  textEl.style.fontSize = fontSize + 'px';
  textEl.style.transform = mirror ? `translateY(${-scrollY}px) scaleX(-1)` : `translateY(${-scrollY}px)`;
}

function updateStatus() {
  const state = playing ? 'PLAYING' : 'PAUSED';
  statusEl.textContent = `${state} · ${speed.toFixed(1)}× · ${fontSize}px${mirror ? ' · MIRROR' : ''}`;
}

function tick(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = (timestamp - lastTime) / 1000;
  lastTime = timestamp;

  if (playing) {
    scrollY += speed * 50 * dt;
    renderText();
    const maxScroll = textEl.scrollHeight - container.clientHeight;
    if (scrollY >= maxScroll) {
      playing = false;
      updateStatus();
    }
  }
  rafId = requestAnimationFrame(tick);
}

function play() {
  playing = true;
  lastTime = 0;
  document.getElementById('btn-play').classList.add('active');
  document.getElementById('btn-pause').classList.remove('active');
  updateStatus();
}

function pause() {
  playing = false;
  document.getElementById('btn-play').classList.remove('active');
  document.getElementById('btn-pause').classList.add('active');
  updateStatus();
}

function reset() {
  scrollY = 0;
  renderText();
  pause();
}

function setSpeed(val) {
  speed = Math.max(0.1, Math.min(5.0, val));
  updateStatus();
}

function setFontSize(val) {
  fontSize = Math.max(14, Math.min(48, val));
  renderText();
  updateStatus();
}

function toggleMirror() {
  mirror = !mirror;
  document.getElementById('mirror-overlay').classList.toggle('active', mirror);
  document.getElementById('btn-mirror').classList.toggle('active', mirror);
  renderText();
  updateStatus();
}

function openScriptPanel() {
  renderScriptList();
  scriptPanel.classList.add('open');
  editPanel.classList.remove('open');
}

function closeScriptPanel() {
  scriptPanel.classList.remove('open');
}

function renderScriptList() {
  scriptList.innerHTML = '';
  SCRIPTS.forEach((script, i) => {
    const div = document.createElement('div');
    div.className = `script-item${i === currentScriptIndex ? ' active' : ''}`;
    div.innerHTML = `<div class="script-name">${script.name}</div><div class="script-desc">${script.desc}</div>`;
    div.addEventListener('click', () => loadScript(i));
    scriptList.appendChild(div);
  });
}

function loadScript(index) {
  currentScriptIndex = index;
  const script = SCRIPTS[index];
  if (script.text) {
    textEl.textContent = script.text;
    scrollY = 0;
    renderText();
  } else {
    openEditor();
  }
  closeScriptPanel();
}

function openEditor() {
  editTextarea.value = textEl.textContent;
  editPanel.classList.add('open');
  scriptPanel.classList.remove('open');
  editTextarea.focus();
}

function closeEditor() {
  editPanel.classList.remove('open');
}

function applyEditor() {
  const newText = editTextarea.value;
  textEl.textContent = newText;
  SCRIPTS[currentScriptIndex].text = newText;
  scrollY = 0;
  renderText();
  closeEditor();
}

// VLC
const VLC_HTTP = 'http://127.0.0.1:8081/requests/status.json';
const VLC_AUTH = 'Basic ' + btoa(':hermes');

async function vlcCommand(cmd, params = {}) {
  const qs = Object.entries({ command: cmd, ...params })
    .map(([k, v]) => `${k}=${encodeURIComponent(v)}`)
    .join('&');
  try {
    const resp = await fetch(`${VLC_HTTP}?${qs}`, { headers: { 'Authorization': VLC_AUTH } });
    return await resp.json();
  } catch (e) {
    return { error: e.message };
  }
}

async function pollVlcStatus() {
  try {
    const resp = await fetch(VLC_HTTP, { headers: { 'Authorization': VLC_AUTH } });
    const data = await resp.json();
    updateVlcUI(data);
  } catch (e) {
    document.getElementById('vlc-status').textContent = 'VLC HTTP: not running';
    const stateEl = document.getElementById('vlc-state');
    stateEl.textContent = 'OFFLINE';
    stateEl.className = 'vlc-state';
  }
}

function fmtTime(seconds) {
  if (!seconds || isNaN(seconds)) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

function updateVlcUI(data) {
  const state = data.state || 'stopped';
  const stateEl = document.getElementById('vlc-state');
  stateEl.textContent = state.toUpperCase();
  stateEl.className = `vlc-state ${state}`;

  const time = data.time || 0;
  const length = data.length || 0;
  const percent = length > 0 ? Math.round((time / length) * 100) : 0;
  document.getElementById('vlc-seek').value = percent;
  document.getElementById('vlc-time').textContent = `${fmtTime(time)} / ${fmtTime(length)}`;

  const vol = data.volume || 0;
  const volPercent = Math.round((vol / 512) * 100);
  document.getElementById('vlc-vol').value = volPercent;
  document.getElementById('vlc-vol-val').textContent = `${volPercent}%`;

  document.getElementById('vlc-status').textContent = `VLC HTTP: ${state} · ${data.information?.category?.meta?.filename || 'no media'}`;
}

// Event listeners
document.getElementById('btn-play').addEventListener('click', play);
document.getElementById('btn-pause').addEventListener('click', pause);
document.getElementById('btn-reset').addEventListener('click', reset);
document.getElementById('btn-mirror').addEventListener('click', toggleMirror);
document.getElementById('btn-scripts').addEventListener('click', openScriptPanel);
document.getElementById('btn-edit').addEventListener('click', openEditor);
document.getElementById('btn-edit-cancel').addEventListener('click', closeEditor);
document.getElementById('btn-edit-apply').addEventListener('click', applyEditor);
document.getElementById('btn-scripts-close').addEventListener('click', closeScriptPanel);

document.getElementById('vlc-play').addEventListener('click', () => vlcCommand('pl_play'));
document.getElementById('vlc-pause').addEventListener('click', () => vlcCommand('pl_pause'));
document.getElementById('vlc-stop').addEventListener('click', () => vlcCommand('pl_stop'));
document.getElementById('vlc-prev').addEventListener('click', () => vlcCommand('pl_prev'));
document.getElementById('vlc-next').addEventListener('click', () => vlcCommand('pl_next'));
document.getElementById('vlc-open').addEventListener('click', () => {
  const path = prompt('Enter media file path or URL:');
  if (path) {
    vlcCommand('pl_empty').then(() => {
      vlcCommand('pl_add', { input: path }).then(() => vlcCommand('pl_play'));
    });
  }
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch(e.key) {
    case ' ': e.preventDefault(); playing ? pause() : play(); break;
    case 'ArrowUp': e.preventDefault(); setSpeed(speed + 0.2); break;
    case 'ArrowDown': e.preventDefault(); setSpeed(speed - 0.2); break;
    case 'ArrowLeft': e.preventDefault(); scrollY = Math.max(0, scrollY - 80); renderText(); break;
    case 'ArrowRight': e.preventDefault(); scrollY += 80; renderText(); break;
    case 'm': case 'M': toggleMirror(); break;
    case 'r': case 'R': reset(); break;
    case 'e': case 'E': editPanel.classList.contains('open') ? closeEditor() : openEditor(); break;
    case 's': case 'S': scriptPanel.classList.contains('open') ? closeScriptPanel() : openScriptPanel(); break;
    case '+': case '=': setFontSize(fontSize + 2); break;
    case '-': setFontSize(fontSize - 2); break;
    case 'Escape': closeEditor(); closeScriptPanel(); break;
  }
});

function scanMediaDir(dirPath) {
  // Use fetch to a local endpoint, or use the File System Access API
  // For now, use a simple approach: try to fetch a directory listing
  // Since we can't list directories from browser, we'll use a known list
  // or prompt the user to select files

  // Try to use the File System Access API (Chrome/Edge)
  if ('showDirectoryPicker' in window) {
    return pickDirectoryFS();
  }

  // Fallback: use a predefined list of known media files
  return Promise.resolve(getKnownMediaFiles(dirPath));
}

async function pickDirectoryFS() {
  try {
    const dirHandle = await window.showDirectoryPicker();
    const files = [];
    for await (const entry of dirHandle.values()) {
      if (entry.kind === 'file' && entry.name.match(/\.(mp4|webm|mkv|avi|mov)$/i)) {
        const file = await entry.getFile();
        files.push({
          name: file.name,
          size: file.size,
          path: file.name, // Can't get full path from FS API
          url: URL.createObjectURL(file),
        });
      }
    }
    return files;
  } catch (e) {
    return [];
  }
}

function getKnownMediaFiles(dirPath) {
  // Known media files on the system
  const known = {
    'C:/æ/videolab': [
      { name: 'cuda-mcp2.mp4', size: 254664, path: 'C:/æ/videolab/cuda-mcp2.mp4' },

    ],
  };
  return known[dirPath] || [];
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function renderMediaGrid() {
  const grid = document.getElementById('media-grid');
  const empty = document.getElementById('media-empty');
  const count = document.getElementById('media-count');

  grid.innerHTML = '';
  count.textContent = `${mediaFiles.length} files`;

  if (mediaFiles.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  mediaFiles.forEach((file, i) => {
    const div = document.createElement('div');
    div.className = 'media-item';
    div.innerHTML = `
      <div class="media-icon">🎬</div>
      <div class="media-name">${file.name}</div>
      <div class="media-size">${formatSize(file.size)}</div>
    `;
    div.addEventListener('click', () => openMediaInVlc(file));
    grid.appendChild(div);
  });
}

function openMediaInVlc(file) {
  // Mark active
  document.querySelectorAll('.media-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');

  // Open in VLC via HTTP API
  vlcCommand('pl_empty').then(() => {
    vlcCommand('pl_add', { input: file.path }).then(() => {
      vlcCommand('pl_play');
    });
  });
}
