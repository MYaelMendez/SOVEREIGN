<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic Electronic Engineering Constellation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; overflow: hidden; font-family: 'Consolas', 'Monaco', monospace; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 16px 24px;
    background: linear-gradient(180deg, rgba(5,5,5,0.95) 0%, transparent 100%);
    color: #D4AF37; pointer-events: none; z-index: 10;
  }
  #hud h1 { font-size: 14px; letter-spacing: 4px; text-transform: uppercase; }
  #hud p { font-size: 10px; color: #888; margin-top: 4px; letter-spacing: 1px; }
  #stats {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 24px;
    background: linear-gradient(0deg, rgba(5,5,5,0.95) 0%, transparent 100%);
    color: #666; font-size: 10px; pointer-events: none; z-index: 10;
    display: flex; justify-content: space-between;
  }
  #stats span { color: #D4AF37; }
  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(212,175,55,0.015) 2px, rgba(212,175,55,0.015) 4px);
  }
</style>
</head>
<body>
<div id="hud">
  <h1>Agentic Electronic Engineering Constellation</h1>
  <p>æ:// language · Python backbone · Three.js viewport · WebMCP tools · WebAuthn gate · DAOLLC state machine</p>
</div>
<div class="scanlines"></div>
<div id="stats">
  <span id="fps">60 FPS</span>
  <span id="nodes">0 nodes</span>
  <span id="edges">0 edges</span>
  <span id="phase">INITIALIZING</span>
</div>

<!-- UMD builds: work with file:// AND http:// -->
<script src="https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.186.1/examples/js/controls/OrbitControls.js"></script>

<script>
// --- Scene setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.FogExp2(0x050505, 0.012);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 8, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

// --- Lighting ---
const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
scene.add(ambientLight);

const goldLight = new THREE.PointLight(0xD4AF37, 2, 50);
goldLight.position.set(0, 10, 0);
scene.add(goldLight);

const blueLight = new THREE.PointLight(0x4488ff, 1, 30);
blueLight.position.set(-10, 5, -10);
scene.add(blueLight);

const redLight = new THREE.PointLight(0xff4444, 0.5, 20);
redLight.position.set(10, 3, 10);
scene.add(redLight);

// --- Constellation data ---
const NODES = [
  // Core
  { id: 'root', label: 'HUMAN://ROOT', pos: [0, 0, 0], color: 0xD4AF37, size: 0.8, type: 'core' },
  { id: 'ae', label: 'æ:// language', pos: [0, 3, 0], color: 0xD4AF37, size: 0.6, type: 'core' },
  { id: 'conductor', label: 'conductor.py', pos: [-3, 2, 0], color: 0xff4444, size: 0.4, type: 'core' },

  // Python backbone
  { id: 'python', label: 'Python backbone', pos: [-5, 4, -2], color: 0x44ff44, size: 0.5, type: 'python' },
  { id: 'cupy', label: 'CuPy 14.2', pos: [-7, 5, -3], color: 0x44ff44, size: 0.35, type: 'python' },
  { id: 'numpy', label: 'NumPy 2.5', pos: [-6, 6, -1], color: 0x44ff44, size: 0.35, type: 'python' },
  { id: 'gpu-mcp', label: 'gpu-mcp', pos: [-8, 4, -4], color: 0x44ff44, size: 0.4, type: 'python' },
  { id: 'vision', label: 'vision-supervision', pos: [-4, 5, -5], color: 0x44ff44, size: 0.4, type: 'python' },

  // Three.js viewport
  { id: 'threejs', label: 'Three.js 0.186', pos: [5, 4, -2], color: 0x4488ff, size: 0.5, type: 'three' },
  { id: 'f1', label: 'F1 Fundamentos', pos: [7, 5, -3], color: 0x4488ff, size: 0.25, type: 'three' },
  { id: 'f4', label: 'F4 Shaders', pos: [8, 6, -1], color: 0x4488ff, size: 0.25, type: 'three' },
  { id: 'f6', label: 'F6 Ray Marching', pos: [6, 6, -4], color: 0x4488ff, size: 0.25, type: 'three' },
  { id: 'f7', label: 'F7 100k Inst', pos: [9, 4, -5], color: 0x4488ff, size: 0.25, type: 'three' },
  { id: 'f10', label: 'F10 Post-FX', pos: [5, 5, -6], color: 0x4488ff, size: 0.25, type: 'three' },
  { id: 'f11', label: 'F11 DOF+SSR', pos: [8, 3, -6], color: 0x4488ff, size: 0.25, type: 'three' },
  { id: 'f12', label: 'F12 WebMCP', pos: [6, 7, -2], color: 0x4488ff, size: 0.3, type: 'three' },

  // WebMCP + WebAuthn
  { id: 'webmcp', label: 'WebMCP', pos: [3, 6, 2], color: 0xff88ff, size: 0.5, type: 'webmcp' },
  { id: 'webauthn', label: 'WebAuthn', pos: [1, 7, 3], color: 0xff88ff, size: 0.4, type: 'webmcp' },
  { id: 'passkey', label: 'Passkey Gate', pos: [-1, 8, 2], color: 0xff88ff, size: 0.35, type: 'webmcp' },

  // DAOLLC
  { id: 'daollc', label: 'DAOLLC.AI', pos: [-3, 6, 3], color: 0xffaa44, size: 0.5, type: 'daollc' },
  { id: 'gate', label: 'Evidence Gate', pos: [-5, 7, 2], color: 0xffaa44, size: 0.35, type: 'daollc' },
  { id: 'receipts', label: 'Receipts SHA-256', pos: [-4, 8, 4], color: 0xffaa44, size: 0.35, type: 'daollc' },

  // Cloud
  { id: 'nous', label: 'Nous Portal', pos: [0, 8, -4], color: 0x88aaff, size: 0.5, type: 'cloud' },
  { id: 'ae-cloud', label: 'æ (RUNNING)', pos: [-2, 9, -5], color: 0x88aaff, size: 0.4, type: 'cloud' },
  { id: 'llm-store', label: 'LLM.STORE', pos: [2, 9, -5], color: 0x666688, size: 0.35, type: 'cloud' },

  // VS Code
  { id: 'vscode', label: 'VS Code 0.3.0', pos: [-6, 3, 4], color: 0x44aaff, size: 0.5, type: 'vscode' },
  { id: 'bridge', label: 'Preview Bridge', pos: [-8, 4, 5], color: 0x44aaff, size: 0.35, type: 'vscode' },
  { id: 'humanloop', label: 'Human Loop', pos: [-7, 5, 3], color: 0x44aaff, size: 0.35, type: 'vscode' },

  // Plugins
  { id: 'plugins', label: '10 Plugins', pos: [6, 3, 4], color: 0x44ffaa, size: 0.4, type: 'plugins' },
  { id: 'vlc', label: 'VLC Player', pos: [8, 4, 5], color: 0x44ffaa, size: 0.3, type: 'plugins' },
  { id: 'mesh-mgr', label: 'Mesh Manager', pos: [7, 5, 3], color: 0x44ffaa, size: 0.3, type: 'plugins' },

  // Public surface
  { id: 'domains', label: '6 Domains', pos: [0, 5, 6], color: 0xffdd44, size: 0.4, type: 'public' },
  { id: 'github', label: 'GitHub Pages', pos: [-2, 6, 7], color: 0xffdd44, size: 0.3, type: 'public' },
  { id: 'droplet', label: 'Droplet', pos: [2, 6, 7], color: 0xffdd44, size: 0.3, type: 'public' },
];

const EDGES = [
  ['root', 'ae'], ['root', 'conductor'],
  ['ae', 'python'], ['ae', 'threejs'], ['ae', 'webmcp'], ['ae', 'daollc'],
  ['ae', 'nous'], ['ae', 'vscode'], ['ae', 'plugins'], ['ae', 'domains'],
  ['python', 'cupy'], ['python', 'numpy'], ['python', 'gpu-mcp'], ['python', 'vision'],
  ['threejs', 'f1'], ['threejs', 'f4'], ['threejs', 'f6'], ['threejs', 'f7'],
  ['threejs', 'f10'], ['threejs', 'f11'], ['threejs', 'f12'],
  ['webmcp', 'webauthn'], ['webmcp', 'passkey'],
  ['daollc', 'gate'], ['daollc', 'receipts'],
  ['nous', 'ae-cloud'], ['nous', 'llm-store'],
  ['vscode', 'bridge'], ['vscode', 'humanloop'],
  ['plugins', 'vlc'], ['plugins', 'mesh-mgr'],
  ['domains', 'github'], ['domains', 'droplet'],
  ['webmcp', 'threejs'], ['daollc', 'webmcp'],
];

// --- Build scene ---
const nodeMap = {};
const nodeGroup = new THREE.Group();
scene.add(nodeGroup);

// Create nodes
NODES.forEach(n => {
  const geo = new THREE.SphereGeometry(n.size, 32, 32);
  const mat = new THREE.MeshStandardMaterial({
    color: n.color,
    emissive: n.color,
    emissiveIntensity: 0.3,
    metalness: 0.8,
    roughness: 0.2,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(...n.pos);
  mesh.userData = n;
  nodeGroup.add(mesh);
  nodeMap[n.id] = mesh;

  // Glow
  const glowGeo = new THREE.SphereGeometry(n.size * 1.5, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({
    color: n.color,
    transparent: true,
    opacity: 0.1,
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.copy(mesh.position);
  nodeGroup.add(glow);
});

// Create edges
const edgeGroup = new THREE.Group();
scene.add(edgeGroup);

EDGES.forEach(([a, b]) => {
  const aPos = nodeMap[a].position;
  const bPos = nodeMap[b].position;
  const points = [aPos.clone(), bPos.clone()];
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({
    color: 0xD4AF37,
    transparent: true,
    opacity: 0.3,
  });
  const line = new THREE.Line(geo, mat);
  edgeGroup.add(line);
});

// --- Particles ---
const particleCount = 2000;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
const particleColors = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  particlePositions[i * 3] = (Math.random() - 0.5) * 40;
  particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 20;
  particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 40;

  const color = new THREE.Color();
  color.setHSL(0.12 + Math.random() * 0.1, 0.8, 0.5 + Math.random() * 0.3);
  particleColors[i * 3] = color.r;
  particleColors[i * 3 + 1] = color.g;
  particleColors[i * 3 + 2] = color.b;
}

particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

const particleMat = new THREE.PointsMaterial({
  size: 0.05,
  vertexColors: true,
  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending,
});

const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// --- Animation ---
const clock = new THREE.Clock();
let frame = 0;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  frame++;

  // Pulse nodes
  nodeGroup.children.forEach((child, i) => {
    if (child.userData && child.userData.size) {
      const scale = 1 + Math.sin(t * 2 + i) * 0.1;
      child.scale.setScalar(scale);
    }
  });

  // Rotate particles slowly
  particles.rotation.y = t * 0.02;

  // Update HUD
  if (frame % 10 === 0) {
    document.getElementById('fps').textContent = `${Math.round(1 / clock.getDelta())} FPS`;
    document.getElementById('nodes').textContent = `${NODES.length} nodes`;
    document.getElementById('edges').textContent = `${EDGES.length} edges`;
    document.getElementById('phase').textContent = t < 5 ? 'BOOTING' : t < 10 ? 'CONSTELLATION' : t < 15 ? 'AGENTIC' : 'ENGINEERING';
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Verification hook ---
window.__CONSTELLATION__ = {
  ready: true,
  nodes: NODES.length,
  edges: EDGES.length,
  revision: '186',
  phase: 'agentic-electronic-engineering',
};
</script>
<!-- æ:// QR Verification Badge -->
<div id="æ-qr-badge" style="
  position:fixed;bottom:16px;right:16px;z-index:99999;
  width:56px;height:56px;border:1px solid #D4AF37;border-radius:8px;
  background:#050505;padding:4px;cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s;
" onmouseover="this.style.transform='scale(1.1)';this.style.boxShadow='0 0 20px rgba(212,175,55,0.4)'"
   onmouseout="this.style.transform='scale(1)';this.style.boxShadow='none'"
   onclick="window.open('https://myaelmendez.github.io/verify.html?url='+encodeURIComponent(location.href),'_blank')"
   title="æ:// Verify this surface">
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=48x48&data=https://myaelmendez.github.io/threejs-curriculo/constellation-viewport.html&color=D4AF37&bgcolor=050505"
       alt="QR Verify" style="width:100%;height:100%;display:block;">
</div>
</body>
</html>
