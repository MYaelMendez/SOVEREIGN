<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>æRTXvideo — Sovereign GPU Video Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 16px 24px;
    color: #D4AF37; pointer-events: none; z-index: 10;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    display: flex; justify-content: space-between;
    background: linear-gradient(180deg, rgba(5,5,5,0.9) 0%, transparent 100%);
  }
</style>
</head>
<body>
<div id="hud">
  <span>æRTXvideo</span>
  <span id="stats">loading…</span>
</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 720, H = 1280;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.FogExp2(0x050505, 0.018);

const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 200);
camera.position.set(0, 1.5, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.target.set(0, 0.5, 0);

// ── Lighting ──
scene.add(new THREE.AmbientLight(0x404040, 0.6));
const gold = new THREE.PointLight(0xD4AF37, 4, 40); gold.position.set(2, 4, 3); scene.add(gold);
const cyan = new THREE.PointLight(0x00eaff, 2.5, 30); cyan.position.set(-4, 1, -3); scene.add(cyan);
const green = new THREE.PointLight(0x00ff9d, 1.5, 25); green.position.set(3, -2, 4); scene.add(green);

// ── GLSL noise (simplex 3D + fbm) ──
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
float fbm(vec3 p){float f=0.0,w=0.5;for(int i=0;i<5;i++){f+=w*snoise(p);p*=2.0;w*=0.5;}return f;}
`;

// ── Hero: liquid gold torus knot (vertex-displaced by fbm) ──
const heroGeo = new THREE.TorusKnotGeometry(1.15, 0.36, 320, 48);
const heroMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uGold: { value: new THREE.Color(0xD4AF37) },
    uHot:  { value: new THREE.Color(0xffe9a8) },
  },
  vertexShader: `
    uniform float uTime;
    varying vec3 vNormal; varying vec3 vView; varying float vDisp;
    ${NOISE}
    void main(){
      float d = fbm(position*0.9 + vec3(0.0, uTime*0.35, 0.0)) * 0.16;
      vDisp = d;
      vec3 p = position + normal * d;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vView = normalize(-mv.xyz);
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 uGold; uniform vec3 uHot; uniform float uTime;
    varying vec3 vNormal; varying vec3 vView; varying float vDisp;
    void main(){
      vec3 n = normalize(vNormal);
      float fres = pow(1.0 - abs(dot(n, vView)), 2.4);
      float diff = max(dot(n, normalize(vec3(1.0,1.2,0.8))), 0.0);
      float spec = pow(max(dot(reflect(-normalize(vec3(1.0,1.2,0.8)), n), vView), 0.0), 48.0);
      vec3 col = mix(uGold*0.35, uHot, diff*0.7);
      col += uHot * spec * 1.3;
      col += uGold * fres * 1.6;
      col += vec3(vDisp*1.4, vDisp*1.0, vDisp*0.3);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const hero = new THREE.Mesh(heroGeo, heroMat);
hero.position.y = 0.5;
scene.add(hero);

// ── Inner glow core ──
const core = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.55, 3),
  new THREE.MeshBasicMaterial({ color: 0xD4AF37, transparent: true, opacity: 0.12 })
);
core.position.y = 0.5;
scene.add(core);

// ── Orbiting rings ──
const rings = [];
[[2.4, 0x00eaff, 0.35, Math.PI/2.2], [2.9, 0x00ff9d, -0.25, Math.PI/1.7], [3.4, 0xD4AF37, 0.18, Math.PI/3]].forEach(([r, c, s, tilt]) => {
  const m = new THREE.Mesh(
    new THREE.TorusGeometry(r, 0.012, 8, 160),
    new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.35 })
  );
  m.rotation.x = tilt; m.position.y = 0.5;
  scene.add(m); rings.push({ m, s });
});

// ── GPU particles (80k) with curl-noise flow ──
const N = 80000;
const pGeo = new THREE.BufferGeometry();
const pos = new Float32Array(N*3), col = new Float32Array(N*3), siz = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const r = 3 + Math.random()*9;
  const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
  pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
  pos[i*3+1] = r*Math.sin(ph)*Math.sin(th)*0.8 + 0.5;
  pos[i*3+2] = r*Math.cos(ph);
  const c = new THREE.Color().setHSL(0.11 + Math.random()*0.12, 0.85, 0.45 + Math.random()*0.35);
  col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
  siz[i] = 0.02 + Math.random()*0.05;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
pGeo.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
const pMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute float aSize; uniform float uTime;
    varying vec3 vColor;
    ${NOISE}
    void main(){
      vColor = color;
      vec3 p = position;
      float t = uTime * 0.12;
      p.x += snoise(p*0.18 + vec3(t,0.0,0.0)) * 0.9;
      p.y += snoise(p*0.18 + vec3(0.0,t,0.0)) * 0.9;
      p.z += snoise(p*0.18 + vec3(0.0,0.0,t)) * 0.9;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = aSize * 420.0 / -mv.z;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float a = pow(1.0 - d*2.0, 1.6);
      gl_FragColor = vec4(vColor, a);
    }
  `,
  vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// ── Post-processing: bloom + film grain / vignette / chromatic ──
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.75, 0.5, 0.82));

const GradePass = {
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(W, H) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes;
    varying vec2 vUv;
    float rand(vec2 c){ return fract(sin(dot(c, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      vec2 d = vUv - 0.5;
      float r2 = dot(d,d);
      // chromatic aberration
      float ca = 0.0022 + r2*0.006;
      vec3 col;
      col.r = texture2D(tDiffuse, vUv + d*ca).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - d*ca).b;
      // vignette
      col *= smoothstep(1.15, 0.28, r2*2.2);
      // scanlines
      col *= 1.0 - 0.05*step(0.5, fract(vUv.y*uRes.y*0.5));
      // film grain
      col += (rand(vUv*uRes + uTime) - 0.5) * 0.035;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
};
const gradePass = new ShaderPass(GradePass);
composer.addPass(gradePass);
composer.addPass(new OutputPass());

// ── Animate ──
const clock = new THREE.Clock();
let frames = 0;
let renderTime = 0;          // deterministic time when driven by __renderFrame
let driven = false;          // true once the render harness takes control

function applyFrame(t) {
  heroMat.uniforms.uTime.value = t;
  pMat.uniforms.uTime.value = t;
  gradePass.uniforms.uTime.value = t;
  hero.rotation.y = t * 0.25;
  hero.rotation.x = t * 0.12;
  core.scale.setScalar(1 + Math.sin(t*2.5)*0.12);
  core.material.opacity = 0.1 + Math.sin(t*3)*0.06;
  rings.forEach(r => { r.m.rotation.z = t * r.s; });
  particles.rotation.y = t * 0.02;
  controls.update();
}

function animate() {
  requestAnimationFrame(animate);
  if (driven) return;                       // harness controls the clock
  const t = clock.getElapsedTime();
  applyFrame(t);
  composer.render();
  if (++frames % 12 === 0) {
    const info = renderer.info.render;
    document.getElementById('stats').textContent =
      `${Math.round(1/clock.getDelta())} fps · ${info.calls} calls · ${info.triangles.toLocaleString()} tris`;
  }
}
animate();

// ── Deterministic render hook (æRTXrender) ──
// Frame i of N is ALWAYS the same visual: t = i / FPS. Same input → same video.
window.__renderFrame = (i, total) => {
  driven = true;
  const FPS = 30;
  const t = i / FPS;
  applyFrame(t);
  composer.render();
  return true;
};

window.addEventListener('resize', () => {
  camera.aspect = W/H; camera.updateProjectionMatrix();
});
window.__AERTX__ = { ready: true, particles: N, w: W, h: H, deterministic: true };
</script>
