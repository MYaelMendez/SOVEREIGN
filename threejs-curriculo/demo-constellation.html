<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>æ:// Three.js Demo — Constellation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color('#050505');

const camera = new THREE.PerspectiveCamera(60, 16/9, 0.1, 1000);
camera.position.set(0, 0, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(1920, 1080);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

// --- Controls ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

// --- Constellation: nodes + edges ---
const nodeCount = 80;
const nodes = [];
const nodeGeometry = new THREE.SphereGeometry(0.15, 8, 8);
const nodeMaterial = new THREE.MeshBasicMaterial({ color: 0xD4AF37 });

for (let i = 0; i < nodeCount; i++) {
  const mesh = new THREE.Mesh(nodeGeometry, nodeMaterial);
  mesh.position.set(
    (Math.random() - 0.5) * 40,
    (Math.random() - 0.5) * 25,
    (Math.random() - 0.5) * 15
  );
  scene.add(mesh);
  nodes.push(mesh);
}

// --- Edges: connect nearby nodes ---
const edgeMaterial = new THREE.LineBasicMaterial({ color: 0xD4AF37, transparent: true, opacity: 0.15 });
const edgeGeometry = new THREE.BufferGeometry();
const edgePositions = [];

for (let i = 0; i < nodeCount; i++) {
  for (let j = i + 1; j < nodeCount; j++) {
    const dist = nodes[i].position.distanceTo(nodes[j].position);
    if (dist < 8) {
      edgePositions.push(
        nodes[i].position.x, nodes[i].position.y, nodes[i].position.z,
        nodes[j].position.x, nodes[j].position.y, nodes[j].position.z
      );
    }
  }
}

edgeGeometry.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));
const edges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
scene.add(edges);

// --- Central glow ---
const glowGeometry = new THREE.SphereGeometry(2, 32, 32);
const glowMaterial = new THREE.MeshBasicMaterial({ color: 0xD4AF37, transparent: true, opacity: 0.08 });
const glow = new THREE.Mesh(glowGeometry, glowMaterial);
scene.add(glow);

// --- Particles ---
const particleCount = 500;
const particleGeometry = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount * 3; i++) {
  particlePositions[i] = (Math.random() - 0.5) * 60;
}

particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
const particleMaterial = new THREE.PointsMaterial({ color: 0xD4AF37, size: 0.05, transparent: true, opacity: 0.6 });
const particles = new THREE.Points(particleGeometry, particleMaterial);
scene.add(particles);

// --- Animation ---
let time = 0;

function animate() {
  requestAnimationFrame(animate);
  time += 0.01;
  
  // Pulse nodes
  nodes.forEach((node, i) => {
    const scale = 1 + Math.sin(time + i * 0.1) * 0.3;
    node.scale.set(scale, scale, scale);
  });
  
  // Rotate particles
  particles.rotation.y += 0.001;
  particles.rotation.x += 0.0005;
  
  // Pulse glow
  glow.scale.set(1 + Math.sin(time * 0.5) * 0.1, 1 + Math.sin(time * 0.5) * 0.1, 1);
  
  controls.update();
  renderer.render(scene, camera);
}

animate();

// --- Expose for headless capture ---
window.__demo = { scene, camera, renderer, nodes, edges, particles, glow };
</script>
