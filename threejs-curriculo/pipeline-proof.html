<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>æ:// Pipeline Proof — Three.js → Video → QR → VLC</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 720, H = 1280;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.FogExp2(0x050505, 0.015);

const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 100);
camera.position.set(0, 0, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.AmbientLight(0x404040, 0.5));

const goldLight = new THREE.PointLight(0xD4AF37, 3, 30);
goldLight.position.set(0, 3, 3);
scene.add(goldLight);

const cyanLight = new THREE.PointLight(0x00eaff, 2, 20);
cyanLight.position.set(-3, -2, -3);
scene.add(cyanLight);

// ── Scene 1: Torus Knot ──
const torusKnot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(0.8, 0.25, 128, 24),
  new THREE.MeshStandardMaterial({
    color: 0xD4AF37, emissive: 0xD4AF37, emissiveIntensity: 0.3,
    metalness: 0.95, roughness: 0.05,
  })
);
scene.add(torusKnot);

// ── Scene 2: Icosahedron Shell ──
const ico = new THREE.Mesh(
  new THREE.IcosahedronGeometry(2.5, 1),
  new THREE.MeshBasicMaterial({ color: 0x00ff9d, wireframe: true, transparent: true, opacity: 0.15 })
);
scene.add(ico);

// ── Scene 3: Particle Field ──
const pCount = 10000;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(pCount * 3);
const pCol = new Float32Array(pCount * 3);
for (let i = 0; i < pCount; i++) {
  pPos[i*3] = (Math.random()-0.5)*12;
  pPos[i*3+1] = (Math.random()-0.5)*20;
  pPos[i*3+2] = (Math.random()-0.5)*12;
  const c = new THREE.Color();
  c.setHSL(0.12 + Math.random()*0.1, 0.8, 0.3+Math.random()*0.4);
  pCol[i*3] = c.r; pCol[i*3+1] = c.g; pCol[i*3+2] = c.b;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.02, vertexColors: true, transparent: true, opacity: 0.6,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(particles);

// ── Scene 4: QR Grid (simulated chip) ──
const qrGroup = new THREE.Group();
qrGroup.position.y = -3.5;
scene.add(qrGroup);
const qrSize = 15;
const qrModuleSize = 0.08;
const qrGeo = new THREE.BoxGeometry(qrModuleSize*0.9, 0.02, qrModuleSize*0.9);
const qrMat = new THREE.MeshStandardMaterial({ color: 0xD4AF37, emissive: 0xD4AF37, emissiveIntensity: 0.3 });
function isQR(r, c) {
  if (r<7 && c<7) return (r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4));
  if (r<7 && c>=qrSize-7) return (r===0||r===6||c===qrSize-1||c===qrSize-7||(r>=2&&r<=4&&c>=qrSize-5&&c<=qrSize-3));
  if (r>=qrSize-7 && c<7) return (r===qrSize-1||r===qrSize-7||c===0||c===6||(r>=qrSize-5&&r<=qrSize-3&&c>=2&&c<=4));
  return ((r*7+c*13+r*c)%3)===0;
}
for (let r=0; r<qrSize; r++) for (let c=0; c<qrSize; c++) {
  if (isQR(r,c)) {
    const m = new THREE.Mesh(qrGeo, qrMat);
    m.position.set((c-qrSize/2)*qrModuleSize, 0, (r-qrSize/2)*qrModuleSize);
    qrGroup.add(m);
  }
}

// ── Scene 5: Ray Marching Plane ──
const rayMarchMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main() {
      vec2 uv = (vUv - 0.5) * 2.0;
      uv.x *= 0.5625;
      vec3 ro = vec3(0.0, 0.0, 5.0);
      vec3 rd = normalize(vec3(uv, -1.5));
      float t = 0.0;
      for(int i = 0; i < 64; i++) {
        vec3 p = ro + rd * t;
        float d = length(p) - 1.0;
        if(d < 0.001 || t > 20.0) break;
        t += d;
      }
      vec3 col = vec3(0.02, 0.02, 0.03);
      if(t < 20.0) {
        vec3 p = ro + rd * t;
        vec3 n = normalize(p);
        vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
        float diff = max(dot(n, lightDir), 0.0);
        float spec = pow(max(dot(reflect(-lightDir, n), -rd), 0.0), 32.0);
        col = vec3(0.8, 0.6, 0.3) * diff + vec3(1.0, 0.9, 0.7) * spec;
      }
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const rayMarchQuad = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), rayMarchMat);
rayMarchQuad.position.set(0, 2, -2);
rayMarchQuad.visible = false;
scene.add(rayMarchQuad);

// ── Post-processing ──
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.4, 0.3, 0.85));
composer.addPass(new OutputPass());

// ── Animation with scene transitions ──
const clock = new THREE.Clock();
const SCENE_DURATION = 3; // seconds per scene
const TOTAL_SCENES = 5;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const sceneIndex = Math.floor(t / SCENE_DURATION) % TOTAL_SCENES;
  const sceneT = (t % SCENE_DURATION) / SCENE_DURATION;

  // Scene visibility
  torusKnot.visible = sceneIndex === 0;
  ico.visible = sceneIndex === 1;
  particles.visible = sceneIndex === 2;
  qrGroup.visible = sceneIndex === 3;
  rayMarchQuad.visible = sceneIndex === 4;

  // Animations
  if (torusKnot.visible) {
    torusKnot.rotation.x = t * 0.2;
    torusKnot.rotation.y = t * 0.3;
    torusKnot.material.emissiveIntensity = 0.3 + Math.sin(t * 2) * 0.15;
  }
  if (ico.visible) {
    ico.rotation.y = t * 0.1;
    ico.rotation.x = t * 0.05;
  }
  if (particles.visible) {
    particles.rotation.y = t * 0.02;
  }
  if (qrGroup.visible) {
    qrGroup.rotation.y = Math.sin(t * 0.5) * 0.1;
    qrMat.emissiveIntensity = 0.3 + Math.sin(t * 3) * 0.2;
  }
  if (rayMarchQuad.visible) {
    rayMarchMat.uniforms.uTime.value = t;
  }

  controls.update();
  composer.render();
}
animate();

window.__PIPELINE_PROOF__ = { ready: true, scenes: TOTAL_SCENES, width: W, height: H };
</script>

   onmouseout="this.style.transform='scale(1)';this.style.boxShadow='none'"
   onclick="window.open('https://myaelmendez.github.io/verify.html?url='+encodeURIComponent(location.href),'_blank')"
   title="æ:// Verify this surface">
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=48x48&data=https://myaelmendez.github.io/threejs-curriculo/pipeline-proof.html&color=D4AF37&bgcolor=050505"
       alt="QR Verify" style="width:100%;height:100%;display:block;">
</div>
