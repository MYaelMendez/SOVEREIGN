<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>æ — Three.js Avatar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; overflow: hidden; font-family: 'JetBrains Mono', 'Consolas', monospace; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 16px 24px;
    background: linear-gradient(180deg, rgba(5,5,5,0.95) 0%, transparent 100%);
    color: #D4AF37; pointer-events: none; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
  }
  #hud h1 { font-size: 14px; letter-spacing: 4px; text-transform: uppercase; }
  #hud .stats { font-size: 10px; color: rgba(212,175,55,0.5); }
  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(212,175,55,0.015) 2px, rgba(212,175,55,0.015) 4px);
  }
</style>
</head>
<body>
<div id="hud">
  <h1>æ — Avatar</h1>
  <div class="stats" id="stats">FPS: 0 | Draw Calls: 0 | Triangles: 0</div>
</div>
<div class="scanlines"></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const GLSL_NOISE = `
vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v) {
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
`;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.FogExp2(0x050505, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 3, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;

scene.add(new THREE.AmbientLight(0x404040, 0.5));

const goldLight = new THREE.PointLight(0xD4AF37, 3, 30);
goldLight.position.set(0, 5, 5);
scene.add(goldLight);

const blueLight = new THREE.PointLight(0x4488ff, 1.5, 20);
blueLight.position.set(-5, 3, -5);
scene.add(blueLight);

const redLight = new THREE.PointLight(0xff4444, 1, 15);
redLight.position.set(5, 2, 5);
scene.add(redLight);

const coreGroup = new THREE.Group();
scene.add(coreGroup);

const torusKnot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(1.2, 0.35, 200, 32),
  new THREE.MeshStandardMaterial({
    color: 0xD4AF37,
    emissive: 0xD4AF37,
    emissiveIntensity: 0.3,
    metalness: 0.95,
    roughness: 0.05,
  })
);
coreGroup.add(torusKnot);

const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.8, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xD4AF37, transparent: true, opacity: 0.15 })
);
coreGroup.add(innerGlow);

const rings = [];

const outerRing = new THREE.Mesh(
  new THREE.TorusGeometry(3, 0.02, 16, 100),
  new THREE.MeshBasicMaterial({ color: 0xD4AF37, transparent: true, opacity: 0.4 })
);
outerRing.rotation.x = Math.PI / 2;
scene.add(outerRing);
rings.push({ mesh: outerRing, speed: 0.3 });

const middleRing = new THREE.Mesh(
  new THREE.TorusGeometry(2.5, 0.015, 16, 100),
  new THREE.MeshBasicMaterial({ color: 0x00ff9d, transparent: true, opacity: 0.3 })
);
middleRing.rotation.x = Math.PI / 3;
middleRing.rotation.y = Math.PI / 4;
scene.add(middleRing);
rings.push({ mesh: middleRing, speed: -0.5 });

const innerRing = new THREE.Mesh(
  new THREE.TorusGeometry(2, 0.01, 16, 100),
  new THREE.MeshBasicMaterial({ color: 0x00eaff, transparent: true, opacity: 0.25 })
);
innerRing.rotation.x = Math.PI / 4;
innerRing.rotation.z = Math.PI / 6;
scene.add(innerRing);
rings.push({ mesh: innerRing, speed: 0.7 });

const particleSystems = [];

function createOrbitParticles(radius, count, color, speed) {
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    positions[i * 3] = Math.cos(angle) * radius;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 0.5;
    positions[i * 3 + 2] = Math.sin(angle) * radius;
    sizes[i] = 0.02 + Math.random() * 0.03;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(color) } },
    vertexShader: `
      attribute float size;
      uniform float uTime;
      varying float vAlpha;
      void main() {
        vec3 p = position;
        float angle = uTime * 0.5;
        float c = cos(angle);
        float s = sin(angle);
        p.xz = mat2(c, -s, s, c) * p.xz;
        vAlpha = 0.5 + 0.5 * sin(uTime * 2.0 + position.x * 10.0);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = size * 200.0 / -mv.z;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        if(d > 0.5) discard;
        float alpha = (1.0 - d * 2.0) * vAlpha;
        gl_FragColor = vec4(uColor, alpha);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);
  particleSystems.push({ mesh: points, mat, speed });
}

createOrbitParticles(3, 30, 0xD4AF37, 0.3);
createOrbitParticles(2.5, 25, 0x00ff9d, -0.4);
createOrbitParticles(2, 20, 0x00eaff, 0.5);

const bgCount = 10000;
const bgGeo = new THREE.BufferGeometry();
const bgPositions = new Float32Array(bgCount * 3);
const bgColors = new Float32Array(bgCount * 3);
for (let i = 0; i < bgCount; i++) {
  bgPositions[i * 3] = (Math.random() - 0.5) * 30;
  bgPositions[i * 3 + 1] = (Math.random() - 0.5) * 30;
  bgPositions[i * 3 + 2] = (Math.random() - 0.5) * 30;
  const color = new THREE.Color();
  color.setHSL(0.12 + Math.random() * 0.1, 0.8, 0.3 + Math.random() * 0.4);
  bgColors[i * 3] = color.r;
  bgColors[i * 3 + 1] = color.g;
  bgColors[i * 3 + 2] = color.b;
}
bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
bgGeo.setAttribute('color', new THREE.BufferAttribute(bgColors, 3));
const bgParticles = new THREE.Points(bgGeo, new THREE.PointsMaterial({
  size: 0.03, vertexColors: true, transparent: true, opacity: 0.6,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(bgParticles);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.4, 0.3, 0.85));
composer.addPass(new OutputPass());

const clock = new THREE.Clock();
let frame = 0;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  frame++;

  torusKnot.rotation.x = t * 0.2;
  torusKnot.rotation.y = t * 0.3;
  torusKnot.rotation.z = t * 0.1;
  innerGlow.scale.setScalar(1 + Math.sin(t * 2) * 0.1);
  innerGlow.material.opacity = 0.1 + Math.sin(t * 3) * 0.05;

  rings.forEach(r => { r.mesh.rotation.z = t * r.speed; });
  particleSystems.forEach(ps => {
    ps.mat.uniforms.uTime.value = t;
    ps.mesh.rotation.y = t * ps.speed;
  });
  bgParticles.rotation.y = t * 0.01;
  bgParticles.rotation.x = t * 0.005;

  if (frame % 10 === 0) {
    const fps = Math.round(1 / clock.getDelta());
    const info = renderer.info;
    document.getElementById('stats').textContent =
      `FPS: ${fps} | Draw Calls: ${info.render.calls} | Triangles: ${info.render.triangles.toLocaleString()}`;
  }

  controls.update();
  composer.render();
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

window.__AVATAR__ = { ready: true, revision: '186', particleCount: bgCount, ringCount: rings.length, orbitSystems: particleSystems.length };
</script>
