<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Agentic Electronic Engineering — Human Loop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050505;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

// --- Scene Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color('#050505');

const camera = new THREE.PerspectiveCamera(30, 9/16, 0.1, 100);
camera.position.set(0, 0, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// --- Paper Background ---
const paperGeo = new THREE.PlaneGeometry(10, 16);
const paperMat = new THREE.MeshBasicMaterial({ color: 0xf6f1e7 });
const paper = new THREE.Mesh(paperGeo, paperMat);
paper.position.z = -0.5;
scene.add(paper);

// --- Materials: gold on void ---
const goldMat = new THREE.MeshBasicMaterial({ color: 0xD4AF37 });
const dimGoldMat = new THREE.MeshBasicMaterial({ color: 0x8B7355 });
const faintMat = new THREE.MeshBasicMaterial({ color: 0x2A2520 });

// --- Picasso Line Portrait: continuous single-line human face ---
function createPortrait() {
  const group = new THREE.Group();
  
  // Single continuous line forming abstract face
  // Picasso style: asymmetric, geometric, intelligent
  const faceLine = new THREE.CatmullRomCurve3([
    // Forehead left
    new THREE.Vector3(-0.6, 1.8, 0),
    new THREE.Vector3(-0.3, 2.1, 0.02),
    new THREE.Vector3(0.1, 2.0, 0.04),
    new THREE.Vector3(0.4, 1.9, 0.02),
    // Right eye (geometric)
    new THREE.Vector3(0.5, 1.6, 0.05),
    new THREE.Vector3(0.3, 1.5, 0.05),
    new THREE.Vector3(0.4, 1.4, 0.05),
    // Nose (angular)
    new THREE.Vector3(0.2, 1.3, 0.06),
    new THREE.Vector3(0.1, 0.9, 0.05),
    new THREE.Vector3(0.0, 0.7, 0.04),
    // Left eye (different from right - Picasso asymmetry)
    new THREE.Vector3(-0.1, 1.5, 0.05),
    new THREE.Vector3(-0.4, 1.6, 0.05),
    new THREE.Vector3(-0.3, 1.4, 0.05),
    // Mouth (minimal)
    new THREE.Vector3(-0.15, 0.5, 0.04),
    new THREE.Vector3(0.0, 0.4, 0.04),
    new THREE.Vector3(0.15, 0.5, 0.04),
    // Jaw
    new THREE.Vector3(0.3, 0.2, 0.02),
    new THREE.Vector3(0.4, -0.2, 0),
    new THREE.Vector3(0.2, -0.5, 0.02),
    // Neck
    new THREE.Vector3(0.1, -0.7, 0),
    new THREE.Vector3(0.0, -0.9, 0),
    // Shoulder hint
    new THREE.Vector3(-0.3, -1.0, 0),
    new THREE.Vector3(-0.6, -0.9, 0.02),
    // Back to start (continuous)
    new THREE.Vector3(-0.7, -0.5, 0),
    new THREE.Vector3(-0.8, 0.0, 0.02),
    new THREE.Vector3(-0.7, 0.5, 0.04),
    new THREE.Vector3(-0.6, 1.0, 0.05),
    new THREE.Vector3(-0.6, 1.8, 0)
  ]);
  
  const faceGeo = new THREE.TubeGeometry(faceLine, 200, 0.006, 8, true);
  group.add(new THREE.Mesh(faceGeo, goldMat));
  
  // Second line: abstract circuit/brain pattern inside head
  const brainLine = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.3, 1.7, 0.08),
    new THREE.Vector3(-0.1, 1.9, 0.1),
    new THREE.Vector3(0.2, 1.8, 0.12),
    new THREE.Vector3(0.1, 1.6, 0.1),
    new THREE.Vector3(-0.2, 1.5, 0.08),
    new THREE.Vector3(0.0, 1.3, 0.1),
    new THREE.Vector3(0.3, 1.4, 0.12),
    new THREE.Vector3(0.2, 1.2, 0.1),
    new THREE.Vector3(-0.1, 1.1, 0.08),
    new THREE.Vector3(-0.3, 1.3, 0.1)
  ]);
  
  const brainGeo = new THREE.TubeGeometry(brainLine, 60, 0.004, 6, true);
  group.add(new THREE.Mesh(brainGeo, dimGoldMat));
  
  return group;
}

const portrait = createPortrait();
portrait.position.set(-0.5, 0, 0);
scene.add(portrait);

// --- Gold cognitive loop (the "intelligence" loop) ---
const loopCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-2.0, 2.0, 0.05),
  new THREE.Vector3(0, 2.5, 0.1),
  new THREE.Vector3(2.0, 1.5, 0.05),
  new THREE.Vector3(2.2, -1.0, 0),
  new THREE.Vector3(0, -2.0, 0.05),
  new THREE.Vector3(-2.0, -1.0, 0)
]);

const loopGeo = new THREE.TubeGeometry(loopCurve, 120, 0.008, 6, false);
scene.add(new THREE.Mesh(loopGeo, goldMat));

// --- Minimal geometric icons (Picasso-style, not emoji) ---
function createGeometricIcon(type, x, y, z, scale = 0.2) {
  const group = new THREE.Group();
  
  if (type === 'triangle') {
    const path = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0.3, 0),
      new THREE.Vector3(-0.25, -0.2, 0),
      new THREE.Vector3(0.25, -0.2, 0),
      new THREE.Vector3(0, 0.3, 0)
    ]);
    group.add(new THREE.Mesh(new THREE.TubeGeometry(path, 20, 0.006, 4, true), goldMat));
  } else if (type === 'circle') {
    const path = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.25, 0, 0),
      new THREE.Vector3(0, 0.25, 0),
      new THREE.Vector3(-0.25, 0, 0),
      new THREE.Vector3(0, -0.25, 0),
      new THREE.Vector3(0.25, 0, 0)
    ]);
    group.add(new THREE.Mesh(new THREE.TubeGeometry(path, 20, 0.006, 4, true), goldMat));
  } else if (type === 'cross') {
    const h = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.2, 0, 0),
      new THREE.Vector3(0.2, 0, 0)
    ]);
    const v = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, -0.2, 0),
      new THREE.Vector3(0, 0.2, 0)
    ]);
    group.add(new THREE.Mesh(new THREE.TubeGeometry(h, 10, 0.006, 4, false), goldMat));
    group.add(new THREE.Mesh(new THREE.TubeGeometry(v, 10, 0.006, 4, false), goldMat));
  } else if (type === 'spiral') {
    const points = [];
    for (let i = 0; i < 20; i++) {
      const angle = i * 0.5;
      const r = 0.05 + i * 0.015;
      points.push(new THREE.Vector3(Math.cos(angle) * r, Math.sin(angle) * r, 0));
    }
    const path = new THREE.CatmullRomCurve3(points);
    group.add(new THREE.Mesh(new THREE.TubeGeometry(path, 40, 0.004, 4, false), goldMat));
  }
  
  group.position.set(x, y, z);
  group.scale.set(scale, scale, scale);
  return group;
}

// Minimal icon placement
const icons = [
  createGeometricIcon('triangle', 1.8, 2.2, 0.1, 0.15),
  createGeometricIcon('circle', -1.8, 2.2, 0.1, 0.15),
  createGeometricIcon('cross', 1.8, -1.8, 0.1, 0.15),
  createGeometricIcon('spiral', -1.8, -1.8, 0.1, 0.15)
];

icons.forEach(icon => scene.add(icon));

// --- Moving dot on gold loop ---
const dot = new THREE.Mesh(
  new THREE.SphereGeometry(0.035, 12, 12),
  new THREE.MeshBasicMaterial({ color: 0xb9872d })
);
scene.add(dot);

// --- Parallax ---
let tx = 0, ty = 0;

addEventListener('pointermove', e => {
  tx = (e.clientX / innerWidth - 0.5) * 0.25;
  ty = (e.clientY / innerHeight - 0.5) * 0.25;
});

// --- Animation ---
let t = 0;

function animate() {
  requestAnimationFrame(animate);
  
  // Parallax
  camera.position.x += (tx - camera.position.x) * 0.03;
  camera.position.y += (-ty - camera.position.y) * 0.03;
  camera.lookAt(0, 0, 0);
  
  // Cognitive loop
  t = (t + 0.0015) % 1;
  const p = loopCurve.getPoint(t);
  dot.position.copy(p);
  
  // Subtle icon drift
  icons.forEach((icon, i) => {
    icon.position.y += Math.sin(Date.now() * 0.001 + i) * 0.0005;
  });
  
  renderer.render(scene, camera);
}

animate();

// --- Resize ---
addEventListener('resize', () => {
  camera.aspect = 9/16;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
