<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js Mastery Showcase — æ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050505; overflow: hidden; font-family: 'JetBrains Mono', 'Consolas', monospace; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 16px 24px;
    background: linear-gradient(180deg, rgba(5,5,5,0.95) 0%, transparent 100%);
    color: #D4AF37; pointer-events: none; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
  }
  #hud h1 { font-size: 14px; letter-spacing: 4px; text-transform: uppercase; }
  #hud .stats { font-size: 10px; color: rgba(212,175,55,0.5); }
  #controls {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 24px;
    background: linear-gradient(0deg, rgba(5,5,5,0.95) 0%, transparent 100%);
    color: #D4AF37; z-index: 10; display: flex; gap: 8px; align-items: center;
  }
  .btn {
    background: rgba(5,5,5,0.6); border: 1px solid rgba(212,175,55,0.3);
    color: #D4AF37; padding: 6px 12px; font-size: 11px; cursor: pointer;
    border-radius: 3px; transition: all 0.2s; font-family: inherit;
  }
  .btn:hover { border-color: #D4AF37; background: rgba(212,175,55,0.1); }
  .btn.active { background: #D4AF37; color: #050505; }
  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(212,175,55,0.015) 2px, rgba(212,175,55,0.015) 4px);
  }
</style>
</head>
<body>
<div id="hud">
  <h1>Three.js Mastery Showcase</h1>
  <div class="stats" id="stats">FPS: 0 | Draw Calls: 0 | Triangles: 0</div>
</div>
<div class="scanlines"></div>
<div id="controls">
  <button class="btn active" data-mode="0">Ray Marching</button>
  <button class="btn" data-mode="1">GPU Particles</button>
  <button class="btn" data-mode="2">Post-FX</button>
  <button class="btn" data-mode="3">Instancing</button>
  <button class="btn" data-mode="4">Shaders</button>
  <button class="btn" data-mode="5">Morph</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ═══════════════════════════════════════════════════════════
// GLSL NOISE LIBRARY
// ═══════════════════════════════════════════════════════════

const GLSL_NOISE = `
vec3 mod289(vec3 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0/289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v) {
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
float fbm(vec3 p) {
  float f = 0.0;
  float w = 0.5;
  for(int i = 0; i < 5; i++) {
    f += w * snoise(p);
    p *= 2.0;
    w *= 0.5;
  }
  return f;
}
`;

// ═══════════════════════════════════════════════════════════
// SCENE SETUP
// ═══════════════════════════════════════════════════════════

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.FogExp2(0x050505, 0.008);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

// Lighting
const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
scene.add(ambientLight);

const goldLight = new THREE.PointLight(0xD4AF37, 2, 50);
goldLight.position.set(0, 10, 0);
scene.add(goldLight);

const blueLight = new THREE.PointLight(0x4488ff, 1, 30);
blueLight.position.set(-10, 5, -10);
scene.add(blueLight);

const redLight = new THREE.PointLight(0xff4444, 0.5, 20);
redLight.position.set(10, 3, 10);
scene.add(redLight);

// ═══════════════════════════════════════════════════════════
// MODE 0: RAY MARCHING SDF
// ═══════════════════════════════════════════════════════════

const rayMarchMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec2 uResolution;
    varying vec2 vUv;
    ${GLSL_NOISE}
    
    float sdSphere(vec3 p, float r) { return length(p) - r; }
    float sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0); }
    float sdTorus(vec3 p, vec2 t) { vec2 q = vec2(length(p.xz)-t.x,p.y); return length(q)-t.y; }
    float sdCapsule(vec3 p, vec3 a, vec3 b, float r) { vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); return length(pa-ba*h)-r; }
    float smin(float a, float b, float k) { float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }
    
    float map(vec3 p) {
      float d = sdSphere(p, 1.0);
      d = smin(d, sdBox(p + vec3(2.0,0.0,0.0), vec3(0.5)), 0.3);
      d = smin(d, sdTorus(p + vec3(-2.0,0.0,0.0), vec2(0.8,0.3)), 0.3);
      d = smin(d, sdCapsule(p, vec3(0.0,-2.0,0.0), vec3(0.0,2.0,0.0), 0.3), 0.3);
      return d;
    }
    
    vec3 calcNormal(vec3 p) {
      vec2 e = vec2(0.001, 0.0);
      return normalize(vec3(
        map(p+e.xyy)-map(p-e.xyy),
        map(p+e.yxy)-map(p-e.yxy),
        map(p+e.yyx)-map(p-e.yyx)
      ));
    }
    
    float softShadow(vec3 ro, vec3 rd, float mint, float maxt, float k) {
      float res = 1.0;
      float t = mint;
      for(int i = 0; i < 32; i++) {
        float h = map(ro + rd*t);
        res = min(res, k*h/t);
        t += clamp(h, 0.02, 0.1);
        if(h < 0.001 || t > maxt) break;
      }
      return clamp(res, 0.0, 1.0);
    }
    
    void main() {
      vec2 uv = (vUv - 0.5) * 2.0;
      uv.x *= uResolution.x / uResolution.y;
      
      vec3 ro = vec3(0.0, 0.0, 5.0);
      vec3 rd = normalize(vec3(uv, -1.5));
      
      float t = 0.0;
      float d;
      for(int i = 0; i < 128; i++) {
        vec3 p = ro + rd * t;
        d = map(p);
        if(d < 0.001 || t > 20.0) break;
        t += d;
      }
      
      vec3 col = vec3(0.02, 0.02, 0.03);
      
      if(t < 20.0) {
        vec3 p = ro + rd * t;
        vec3 n = calcNormal(p);
        vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
        float diff = max(dot(n, lightDir), 0.0);
        float spec = pow(max(dot(reflect(-lightDir, n), -rd), 0.0), 32.0);
        float ao = 1.0 - float(i) / 128.0;
        float shadow = softShadow(p + n * 0.01, lightDir, 0.02, 5.0, 8.0);
        
        col = vec3(0.8, 0.6, 0.3) * diff * shadow * ao;
        col += vec3(1.0, 0.9, 0.7) * spec * shadow;
        col += vec3(0.1, 0.08, 0.05) * ao;
      }
      
      // Fog
      col = mix(col, vec3(0.02, 0.02, 0.03), 1.0 - exp(-t * 0.1));
      
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});

const rayMarchQuad = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  rayMarchMaterial
);
rayMarchQuad.position.set(0, 0, -5);
scene.add(rayMarchQuad);

// ═══════════════════════════════════════════════════════════
// MODE 1: GPU PARTICLES (100k)
// ═══════════════════════════════════════════════════════════

const particleCount = 100000;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
const particleColors = new Float32Array(particleCount * 3);
const particleSizes = new Float32Array(particleCount);

for (let i = 0; i < particleCount; i++) {
  particlePositions[i * 3] = (Math.random() - 0.5) * 20;
  particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 20;
  particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 20;
  
  const color = new THREE.Color();
  color.setHSL(0.12 + Math.random() * 0.1, 0.8, 0.5 + Math.random() * 0.3);
  particleColors[i * 3] = color.r;
  particleColors[i * 3 + 1] = color.g;
  particleColors[i * 3 + 2] = color.b;
  
  particleSizes[i] = 0.02 + Math.random() * 0.03;
}

particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
particleGeo.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));

const particleMaterial = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    uniform float uTime;
    ${GLSL_NOISE}
    void main() {
      vColor = color;
      vec3 p = position;
      p.x += snoise(p * 0.5 + uTime * 0.1) * 0.5;
      p.y += snoise(p * 0.5 + uTime * 0.1 + 100.0) * 0.5;
      p.z += snoise(p * 0.5 + uTime * 0.1 + 200.0) * 0.5;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = size * 300.0 / -mv.z;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if(d > 0.5) discard;
      float alpha = 1.0 - d * 2.0;
      gl_FragColor = vec4(vColor, alpha);
    }
  `,
  vertexColors: true,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const particles = new THREE.Points(particleGeo, particleMaterial);
particles.visible = false;
scene.add(particles);

// ═══════════════════════════════════════════════════════════
// MODE 2: POST-PROCESSING
// ═══════════════════════════════════════════════════════════

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.5, 0.4, 0.85
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// Post-FX scene objects
const postFxGroup = new THREE.Group();
postFxGroup.visible = false;
scene.add(postFxGroup);

// Torus Knot with emissive material
const torusKnot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(1, 0.3, 128, 32),
  new THREE.MeshStandardMaterial({
    color: 0xD4AF37,
    emissive: 0xD4AF37,
    emissiveIntensity: 0.5,
    metalness: 0.9,
    roughness: 0.1,
  })
);
postFxGroup.add(torusKnot);

// Icosahedron with wireframe
const ico = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.5, 1),
  new THREE.MeshBasicMaterial({ color: 0x00ff9d, wireframe: true, transparent: true, opacity: 0.3 })
);
ico.position.set(3, 0, 0);
postFxGroup.add(ico);

// ═══════════════════════════════════════════════════════════
// MODE 3: INSTANCING (100k)
// ═══════════════════════════════════════════════════════════

const instancedGeo = new THREE.BoxGeometry(0.05, 0.05, 0.05);
const instancedMat = new THREE.MeshStandardMaterial({ color: 0xD4AF37, metalness: 0.8, roughness: 0.2 });
const instancedMesh = new THREE.InstancedMesh(instancedGeo, instancedMat, 100000);
instancedMesh.visible = false;
scene.add(instancedMesh);

const dummy = new THREE.Object3D();
for (let i = 0; i < 100000; i++) {
  dummy.position.set(
    (Math.random() - 0.5) * 20,
    (Math.random() - 0.5) * 20,
    (Math.random() - 0.5) * 20
  );
  dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  dummy.updateMatrix();
  instancedMesh.setMatrixAt(i, dummy.matrix);
}

// ═══════════════════════════════════════════════════════════
// MODE 4: CUSTOM SHADERS
// ═══════════════════════════════════════════════════════════

const shaderGroup = new THREE.Group();
shaderGroup.visible = false;
scene.add(shaderGroup);

// Water shader
const waterMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    uniform float uTime;
    varying vec2 vUv;
    varying float vElev;
    ${GLSL_NOISE}
    void main() {
      vUv = uv;
      vec3 p = position;
      float e = snoise(p * 0.5 + uTime * 0.3) * 0.3;
      e += snoise(p * 1.0 + uTime * 0.5) * 0.15;
      p.y += e;
      vElev = e;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    varying float vElev;
    void main() {
      vec3 deep = vec3(0.0, 0.05, 0.1);
      vec3 shallow = vec3(0.0, 0.3, 0.4);
      vec3 foam = vec3(0.8, 0.9, 1.0);
      vec3 col = mix(deep, shallow, vElev * 2.0 + 0.5);
      col = mix(col, foam, smoothstep(0.2, 0.3, vElev));
      float fresnel = pow(1.0 - abs(dot(vec3(0.0, 1.0, 0.0), vec3(0.0, 0.0, 1.0))), 2.0);
      col += vec3(0.1, 0.15, 0.2) * fresnel;
      gl_FragColor = vec4(col, 0.8);
    }
  `,
  transparent: true,
  side: THREE.DoubleSide,
});

const water = new THREE.Mesh(new THREE.PlaneGeometry(10, 10, 128, 128), waterMat);
water.rotation.x = -Math.PI / 2;
water.position.y = -2;
shaderGroup.add(water);

// Fire shader
const fireMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    ${GLSL_NOISE}
    void main() {
      vec2 uv = vUv;
      float n = snoise(vec3(uv * 3.0, uTime * 0.5));
      n += snoise(vec3(uv * 6.0, uTime * 0.8)) * 0.5;
      n += snoise(vec3(uv * 12.0, uTime * 1.2)) * 0.25;
      n = n * 0.5 + 0.5;
      float shape = 1.0 - abs(uv.x - 0.5) * 2.0;
      shape = pow(shape, 1.5);
      float fire = n * shape;
      fire *= smoothstep(0.0, 0.3, uv.y);
      fire *= 1.0 - smoothstep(0.7, 1.0, uv.y);
      vec3 col = mix(vec3(0.0, 0.0, 0.0), vec3(0.8, 0.1, 0.0), fire);
      col = mix(col, vec3(1.0, 0.5, 0.0), fire * fire);
      col = mix(col, vec3(1.0, 0.9, 0.5), fire * fire * fire);
      gl_FragColor = vec4(col, fire);
    }
  `,
  transparent: true,
  side: THREE.DoubleSide,
});

const fire = new THREE.Mesh(new THREE.PlaneGeometry(3, 4), fireMat);
fire.position.set(0, 0, 0);
shaderGroup.add(fire);

// Fresnel shader
const fresnelMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vView;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vView = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vView;
    void main() {
      float fresnel = pow(1.0 - abs(dot(vNormal, vView)), 3.0);
      vec3 col = mix(vec3(0.0, 0.2, 0.4), vec3(0.0, 0.8, 1.0), fresnel);
      col += vec3(0.2, 0.0, 0.4) * (1.0 - fresnel);
      gl_FragColor = vec4(col, 0.8);
    }
  `,
  transparent: true,
});

const fresnelSphere = new THREE.Mesh(new THREE.SphereGeometry(1.5, 64, 64), fresnelMat);
fresnelSphere.position.set(0, 2, 0);
shaderGroup.add(fresnelSphere);

// ═══════════════════════════════════════════════════════════
// MODE 5: MORPH TARGETS
// ═══════════════════════════════════════════════════════════

const morphGroup = new THREE.Group();
morphGroup.visible = false;
scene.add(morphGroup);

const morphGeo = new THREE.IcosahedronGeometry(1.5, 4);
const morphMat = new THREE.MeshStandardMaterial({ color: 0xD4AF37, metalness: 0.8, roughness: 0.2 });
const morphMesh = new THREE.Mesh(morphGeo, morphMat);

// Create morph targets
const spikePositions = new Float32Array(morphGeo.attributes.position.array.length);
const pillowPositions = new Float32Array(morphGeo.attributes.position.array.length);

for (let i = 0; i < morphGeo.attributes.position.array.length; i += 3) {
  const x = morphGeo.attributes.position.array[i];
  const y = morphGeo.attributes.position.array[i + 1];
  const z = morphGeo.attributes.position.array[i + 2];
  const len = Math.sqrt(x*x + y*y + z*z);
  
  // Spike: push outward
  spikePositions[i] = x * 1.5;
  spikePositions[i + 1] = y * 1.5;
  spikePositions[i + 2] = z * 1.5;
  
  // Pillow: pull inward
  pillowPositions[i] = x * 0.7;
  pillowPositions[i + 1] = y * 0.7;
  pillowPositions[i + 2] = z * 0.7;
}

morphGeo.morphAttributes.position = [
  new THREE.Float32BufferAttribute(spikePositions, 3),
  new THREE.Float32BufferAttribute(pillowPositions, 3),
];
morphMesh.morphTargetInfluences = [0, 0];
morphGroup.add(morphMesh);

// ═══════════════════════════════════════════════════════════
// MODE MANAGEMENT
// ═══════════════════════════════════════════════════════════

let currentMode = 0;
const modes = [
  { name: 'Ray Marching', objects: [rayMarchQuad], hide: [particles, postFxGroup, instancedMesh, shaderGroup, morphGroup] },
  { name: 'GPU Particles', objects: [particles], hide: [rayMarchQuad, postFxGroup, instancedMesh, shaderGroup, morphGroup] },
  { name: 'Post-FX', objects: [postFxGroup], hide: [rayMarchQuad, particles, instancedMesh, shaderGroup, morphGroup] },
  { name: 'Instancing', objects: [instancedMesh], hide: [rayMarchQuad, particles, postFxGroup, shaderGroup, morphGroup] },
  { name: 'Shaders', objects: [shaderGroup], hide: [rayMarchQuad, particles, postFxGroup, instancedMesh, morphGroup] },
  { name: 'Morph', objects: [morphGroup], hide: [rayMarchQuad, particles, postFxGroup, instancedMesh, shaderGroup] },
];

function setMode(mode) {
  currentMode = mode;
  modes.forEach((m, i) => {
    const active = i === mode;
    m.objects.forEach(o => o.visible = active);
    m.hide.forEach(o => o.visible = !active);
  });
  document.querySelectorAll('.btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === mode);
  });
}

document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => setMode(parseInt(btn.dataset.mode)));
});

// ═══════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════

const clock = new THREE.Clock();
let frame = 0;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  frame++;

  // Update uniforms
  rayMarchMaterial.uniforms.uTime.value = t;
  particleMaterial.uniforms.uTime.value = t;
  waterMat.uniforms.uTime.value = t;
  fireMat.uniforms.uTime.value = t;
  fresnelMat.uniforms.uTime.value = t;

  // Animate objects
  if (currentMode === 0) {
    rayMarchQuad.rotation.y = t * 0.1;
  } else if (currentMode === 1) {
    particles.rotation.y = t * 0.02;
  } else if (currentMode === 2) {
    torusKnot.rotation.x = t * 0.3;
    torusKnot.rotation.y = t * 0.5;
    ico.rotation.x = t * 0.2;
    ico.rotation.y = t * 0.4;
  } else if (currentMode === 3) {
    instancedMesh.rotation.y = t * 0.05;
  } else if (currentMode === 4) {
    fresnelSphere.rotation.y = t * 0.3;
  } else if (currentMode === 5) {
    // Morph animation
    const spike = (Math.sin(t * 2) + 1) / 2;
    const pillow = (Math.cos(t * 2) + 1) / 2;
    morphMesh.morphTargetInfluences[0] = spike;
    morphMesh.morphTargetInfluences[1] = pillow;
    morphMesh.rotation.y = t * 0.3;
  }

  // Update stats
  if (frame % 10 === 0) {
    const fps = Math.round(1 / clock.getDelta());
    const info = renderer.info;
    document.getElementById('stats').textContent = 
      `FPS: ${fps} | Draw Calls: ${info.render.calls} | Triangles: ${info.render.triangles.toLocaleString()}`;
  }

  controls.update();
  
  if (currentMode === 2) {
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
}

animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

// Verification hook
window.__SHOWCASE__ = {
  ready: true,
  modes: modes.length,
  revision: '186',
  particleCount,
  instancedCount: 100000,
};
