<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b15"><title>æææ:// Pico OS · Agentic Notes</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:13px system-ui,sans-serif;background:#070b16;color:#f5f4f1}body{background:radial-gradient(ellipse at 55% 12%,#193451 0,transparent 60%),#070b16}header{padding:18px 18px 12px;display:flex;justify-content:space-between;align-items:center}a{color:#ffe1a1}h1{margin:0;font-size:24px;color:#f4c76b}small{color:#a6b7c8}.tag{font-size:10px;color:#b6d2e4;letter-spacing:2px}.shell{width:min(100%,560px);margin:auto}.board{position:relative;min-height:760px;margin:0 10px;border:1px solid #2a3447;border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#102035 0,transparent 65%),linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:auto,30px 30px,30px 30px}.note{position:absolute;min-width:130px;min-height:90px;width:45%;height:190px;overflow:hidden;border:1px solid var(--tone);border-radius:16px;background:color-mix(in srgb,var(--tone) 13%,#08111b);box-shadow:0 10px 30px #0009,0 0 18px color-mix(in srgb,var(--tone) 18%,transparent);display:flex;flex-direction:column;resize:both;touch-action:none}.note.max{left:8px!important;top:8px!important;width:calc(100% - 16px)!important;height:calc(100% - 16px)!important;resize:none}.note.min{height:47px!important;min-height:47px;resize:none}.note .bar{display:flex;align-items:center;gap:3px;padding:7px;background:#0005;cursor:grab;touch-action:none}.name{font-weight:800;color:var(--tone);font-size:10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ctl{border:1px solid #ffffff2a;background:#0c1420;color:#fff;border-radius:7px;width:25px;height:27px;padding:0;cursor:pointer;font-size:13px}.ctl:focus-visible,.dock button:focus-visible{outline:2px solid white}.content{flex:1;overflow:auto;padding:12px;touch-action:pan-y}.note.min .content{display:none}.metric{font-size:clamp(22px,7vw,43px);color:var(--tone);font-weight:900;margin:8px 0}.note p{font-size:11px;line-height:1.5;color:#d6dce4}.dock{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px}.dock button{background:#131d2d;color:#e2eaf4;border:1px solid #36455a;border-radius:9px;padding:9px;cursor:pointer}.dock button[aria-pressed=true]{border-color:#f4c76b;color:#f4c76b}.command{display:flex;gap:8px;padding:10px 14px 20px}.command input{flex:1;min-width:0;background:#0d1725;border:1px solid #45546a;border-radius:10px;padding:12px;color:white}.command button{background:#e6bd68;border:0;border-radius:10px;padding:10px;font-weight:700}.status{padding:0 15px 15px;color:#9db2c4;font-size:11px}.qr{font-size:10px;color:var(--tone);text-decoration:underline;cursor:pointer;background:none;border:0;padding:2px}.hidden{display:none!important}
</style></head><body><div class="shell"><header><div><h1>æææ:// <span style="color:#9ddfff">Pico OS</span></h1><div class="tag">AGENTIC NOTES · HUMAN://ROOT</div></div><a href="../">← Home</a></header><main class="board" id="board" aria-label="Movable colored notes"></main><nav class="dock" id="dock" aria-label="Note dock"></nav><form class="command" id="command"><input id="cmd" aria-label="Command" placeholder=">_æ:// help · open terminal · reset"><button>RUN</button></form><div class="status" id="status" role="status">Prototype · HTML/JS compositor · Rust/WASM and WebMCP integration pending</div></div>
<script>
const defs=[["vessel","🛸 VESSEL","#53d8ff","FLEET","Agents online · simulated"],["pipeline","⚙️ æPI PIPELINE","#f6ca68","GATE","Authorization required"],["nodes","🌐 NODE MAP","#b997ff","MESH","Connected capabilities"],["terminal",">_ CODÆ TERMINAL","#74ffaf",">_","help · list · open [name] · reset"],["watch","⌚ HERMES WATCH","#ff8fc7","WITNESS","Receipts are not authority"],["library","📚 LIBRARY","#ffa36a","LEARN","Discover · Build · Teach"]];
const board=document.querySelector('#board'),dock=document.querySelector('#dock'),status=document.querySelector('#status');
const initial=Object.fromEntries(defs.map((d,i)=>[d[0],{x:3+(i%2)*49,y:12+Math.floor(i/2)*225,mode:'float',visible:true}]));
let saved;try{saved=JSON.parse(localStorage.getItem('ae-pico-notes'))}catch{}
let state={...initial,...saved},z=1;
function persist(){try{localStorage.setItem('ae-pico-notes',JSON.stringify(state))}catch{}}
function render(){board.innerHTML='';dock.innerHTML='';defs.forEach(([id,name,tone,label,desc])=>{let s=state[id]||initial[id];let db=document.createElement('button');db.textContent=name;db.setAttribute('aria-pressed',String(s.visible));db.onclick=()=>{s.visible=true;s.mode='float';persist();render()};dock.append(db);if(!s.visible)return;let n=document.createElement('section');n.className='note'+(s.mode==='max'?' max':s.mode==='min'?' min':'');n.style.cssText='--tone:'+tone+';left:'+s.x+'%;top:'+s.y+'px;z-index:'+(++z);n.innerHTML='<div class="bar"><span class="name">'+name+'</span><button class="ctl" data-action="max" title="Maximize">🟨</button><button class="ctl" data-action="fit" title="Fit">🟦</button><button class="ctl" data-action="min" title="Minimize">🟩</button><button class="ctl" data-action="dock" title="Dock">♻️</button></div><div class="content"><button class="qr" data-action="address" title="Copy address">^æQR · æææ://'+id+'</button><div class="metric">'+label+'</div><p>'+desc+'</p></div>';board.append(n);n.querySelectorAll('[data-action]').forEach(b=>b.onclick=e=>{e.stopPropagation();let a=b.dataset.action;if(a==='address'){navigator.clipboard?.writeText('https://'+location.host+location.pathname+'#'+id).then(()=>status.textContent='Copied note address').catch(()=>status.textContent='Address: #'+id);return}if(a==='dock')s.visible=false;else if(a==='fit')s.mode='float';else if(a==='max')s.mode=s.mode==='max'?'float':'max';else if(a==='min')s.mode=s.mode==='min'?'float':'min';persist();render()});let bar=n.querySelector('.bar');bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||s.mode==='max')return;e.preventDefault();n.style.zIndex=++z;bar.setPointerCapture(e.pointerId);let x=e.clientX,y=e.clientY,startX=n.offsetLeft,startY=n.offsetTop;const move=v=>{let maxX=board.clientWidth-n.offsetWidth,maxY=board.clientHeight-n.offsetHeight;let nx=Math.max(0,Math.min(maxX,startX+v.clientX-x)),ny=Math.max(0,Math.min(maxY,startY+v.clientY-y));n.style.left=nx+'px';n.style.top=ny+'px';s.x=nx/board.clientWidth*100;s.y=ny};const up=()=>{bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',up);bar.removeEventListener('pointercancel',up);persist()};bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',up);bar.addEventListener('pointercancel',up)});});}
document.querySelector('#command').onsubmit=e=>{e.preventDefault();let cmd=document.querySelector('#cmd').value.trim().toLowerCase();if(cmd==='reset'){state=structuredClone(initial);persist();render();status.textContent='Layout reset'}else if(cmd==='list'){status.textContent=defs.map(d=>d[0]).join(' · ')}else if(cmd==='help'){status.textContent='Commands: help, list, open vessel|pipeline|nodes|terminal|watch|library, reset'}else if(cmd.startsWith('open ')){let id=cmd.slice(5);if(state[id]){state[id].visible=true;state[id].mode='float';persist();render();status.textContent='Opened '+id}else status.textContent='Unknown note'}else status.textContent='Unknown command · type help';document.querySelector('#cmd').value=''};
render();if(location.hash){let id=decodeURIComponent(location.hash.slice(1));if(state[id]){state[id].visible=true;persist();render()}}
</script><!-- æ:// QR Verification Badge -->

   onmouseout="this.style.transform='scale(1)';this.style.boxShadow='none'"
