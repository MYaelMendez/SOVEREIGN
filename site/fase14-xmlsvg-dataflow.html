<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>æ:// fase14-xmlsvg — XML/SVG → Dataflow Geometry</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--void:#050505;--gold:#D4AF37;--cyan:#00eaff;--green:#4dff9e}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--void);font-family:'JetBrains Mono',ui-monospace,monospace}
#c{position:fixed;top:0;left:0;width:1920px;height:1080px;display:block;z-index:1}
#scanlines{position:fixed;top:0;left:0;width:1920px;height:1080px;z-index:40;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.28) 0px,rgba(0,0,0,0.28) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply}
#vignette{position:fixed;top:0;left:0;width:1920px;height:1080px;z-index:41;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,0.62) 100%)}
#hud{position:fixed;top:44px;left:52px;z-index:50;color:var(--gold);pointer-events:none}
#hud h1{font-size:31px;font-weight:700;letter-spacing:3px;text-shadow:0 0 20px rgba(212,175,55,0.65)}
#hud .sub{margin-top:10px;font-size:15px;letter-spacing:5px;color:var(--cyan);text-transform:uppercase;opacity:0.9}
#hud .rule{width:420px;height:1px;margin:22px 0;background:linear-gradient(90deg,var(--gold),transparent)}
#hud ul{list-style:none;margin-top:22px;font-size:14px;line-height:1.95}
#hud li{opacity:0.72}
#hud li::before{content:'\25B8 ';color:var(--cyan)}
#hud .v{color:var(--cyan)}
#readout{position:fixed;bottom:44px;left:52px;z-index:50;color:var(--cyan);font-size:15px;letter-spacing:3px}
#readout .g{color:var(--gold)}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="hud">
  <h1>æ:// fase14-xmlsvg</h1>
  <div class="sub">Semana 14 · XML/SVG → Dataflow Geometry</div>
  <div class="rule"></div>
  <ul>
    <li>xml elements &middot; <span class="v" id="xcount">0</span></li>
    <li>svg paths &middot; <span class="v" id="scount">0</span></li>
    <li>data nodes &middot; <span class="v" id="ncount">0</span></li>
    <li>signals &middot; <span class="v" id="sigcount">0</span></li>
  </ul>
</div>
<div id="readout">frame <span class="g" id="fc">0</span> / <span id="tc">0</span> &middot; t <span class="g" id="tt">0.00</span>s</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
var W=1920,H=1080,DURATION=15.0;
var GOLD=0xD4AF37,CYAN=0x00eaff,GREEN=0x4dff9e,VIOLET=0x8b5cf6,RED=0xff5a5a;
var scene,camera,renderer,backdropMat;
var nodes=[],edges=[],signals=[];

// XML spreadsheet data
var XML_DATA='<?xml version="1.0"?><ae:data><ae:row id="R1" name="Revenue" value="100" type="metric" x="10" y="5"/><ae:row id="R2" name="COGS" value="60" type="cost" x="20" y="10"/><ae:row id="R3" name="Gross_Profit" value="40" type="profit" x="30" y="5"/><ae:row id="R4" name="Opex" value="25" type="cost" x="40" y="12"/><ae:row id="R5" name="Net_Income" value="15" type="profit" x="50" y="5"/><ae:row id="R6" name="Tax" value="5" type="cost" x="60" y="10"/><ae:row id="R7" name="EPS" value="2.5" type="metric" x="70" y="5"/></ae:data>';

// SVG paths
var SVG_PATHS=[
  'M 10 10 L 90 10 L 90 50 L 10 50 Z',
  'M 110 10 L 190 10 L 190 50 L 110 50 Z',
  'M 210 10 L 290 10 L 290 50 L 210 50 Z',
  'M 310 10 L 390 10 L 390 50 L 310 50 Z'
];

function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a0a0a);
  camera=new THREE.PerspectiveCamera(50,W/H,0.1,6000);
  camera.position.set(0,100,350);
  camera.lookAt(0,0,0);
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
  renderer.setPixelRatio(1);
  renderer.setSize(W,H);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=2.5;

  backdropMat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0}},
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'varying vec2 vUv;uniform float uTime;void main(){vec2 p=vUv-0.5;float d=length(p*vec2(1.0,0.82));float core=smoothstep(0.82,0.0,d);float ring=smoothstep(0.05,0.0,abs(d-0.44));vec3 col=vec3(0.84,0.69,0.22)*core*1.8+vec3(0.0,0.92,1.0)*ring*1.2+vec3(0.84,0.69,0.22)*0.35;col*=1.2+0.3*sin(uTime*1.3);gl_FragColor=vec4(col,1.0);}'
  });
  var backdrop=new THREE.Mesh(new THREE.PlaneGeometry(2000,1200),backdropMat);
  backdrop.position.set(0,0,-800);
  backdrop.renderOrder=-1;
  scene.add(backdrop);

  scene.add(new THREE.AmbientLight(0xffffff,1.2));
  var key=new THREE.DirectionalLight(0xffffff,2.0);key.position.set(100,200,150);scene.add(key);

  // Parse XML → nodes
  var parser=new DOMParser();
  var xmlDoc=parser.parseFromString(XML_DATA,'text/xml');
  var rows=xmlDoc.getElementsByTagName('ae:row');
  var nodeColors={metric:GOLD,cost:RED,profit:GREEN};
  var boxGeo=new THREE.BoxGeometry(14,10,14);

  for(var i=0;i<rows.length;i++){
    var row=rows[i];
    var type=row.getAttribute('type');
    var x=parseFloat(row.getAttribute('x'));
    var y=parseFloat(row.getAttribute('y'));
    var color=nodeColors[type]||GOLD;
    var mat=new THREE.MeshStandardMaterial({color:color,emissive:color,emissiveIntensity:0.5,roughness:0.3,metalness:0.6});
    var mesh=new THREE.Mesh(boxGeo,mat);
    mesh.position.set((x-40)*9,(14-y)*7,0);
    scene.add(mesh);
    nodes.push({mesh:mesh,mat:mat,color:color});
  }

  // SVG paths as flat overlays
  for(var s=0;s<SVG_PATHS.length;s++){
    var shape=new THREE.Shape();
    var parts=SVG_PATHS[s].split(' ');
    var started=false;
    for(var p=0;p<parts.length;p++){
      var part=parts[p];
      if(part.indexOf('M')===0||part.indexOf('L')===0){
        var coords=part.replace(/[ML]/,'').split(',');
        if(coords.length>=2){
          var px=parseFloat(coords[0]);
          var py=parseFloat(coords[1]);
          if(!started){shape.moveTo(px,py);started=true;}
          else{shape.lineTo(px,py);}
        }
      }
    }
    shape.closePath();
    var geo=new THREE.ShapeGeometry(shape);
    var color=[GOLD,CYAN,GREEN,VIOLET][s];
    var mat=new THREE.MeshBasicMaterial({color:color,side:THREE.DoubleSide});
    var mesh=new THREE.Mesh(geo,mat);
    mesh.position.set(-120+s*80,50,-40);
    mesh.rotation.x=Math.PI*0.1;
    scene.add(mesh);
  }

  // Edges
  for(var e=0;e<nodes.length-1;e++){
    var a=nodes[e],b=nodes[e+1];
    var geo=new THREE.BufferGeometry().setFromPoints([a.mesh.position.clone(),b.mesh.position.clone()]);
    var line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x333333}));
    scene.add(line);
    edges.push({line:line,a:a,b:b});
  }

  // Signals
  var pulseGeo=new THREE.SphereGeometry(2,8,8);
  for(var i=0;i<8;i++){
    var color=[GOLD,CYAN,GREEN,VIOLET][i%4];
    var mat=new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0});
    var s=new THREE.Mesh(pulseGeo,mat);
    s.visible=false;
    scene.add(s);
    signals.push({mesh:s,mat:mat,edgeIdx:i%edges.length,t:0,speed:0.12+Math.random()*0.15});
  }

  document.getElementById('xcount').textContent=rows.length;
  document.getElementById('scount').textContent=SVG_PATHS.length;
  document.getElementById('ncount').textContent=nodes.length;
  document.getElementById('sigcount').textContent=signals.length;
}

function renderAt(t){
  backdropMat.uniforms.uTime.value=t;

  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    n.mesh.rotation.y=t*0.3+i*0.2;
    n.mesh.position.y=(14-n.y)*7+Math.sin(t*1.2+i*0.5)*2;
    n.mat.emissiveIntensity=0.4+0.2*Math.sin(t*2+i*0.6);
  }

  for(var e=0;e<edges.length;e++){
    edges[e].line.geometry.setFromPoints([edges[e].a.mesh.position.clone(),edges[e].b.mesh.position.clone()]);
  }

  for(var i=0;i<signals.length;i++){
    var s=signals[i];
    if(edges[s.edgeIdx]){
      s.t=(t*s.speed+i*0.1)%1;
      s.mesh.position.lerpVectors(edges[s.edgeIdx].a.mesh.position,edges[s.edgeIdx].b.mesh.position,s.t);
      s.mesh.visible=true;
      s.mat.opacity=Math.sin(s.t*Math.PI)*0.8;
    }
  }

  var ang=0.6+Math.sin(t*0.5)*0.4;
  camera.position.set(Math.cos(ang)*350,100+Math.sin(t*0.6)*20,Math.sin(ang)*350);
  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
}

window.__renderFrame=function(i,total){
  if(!renderer)return;
  var n=Math.max(1,(total||1)-1);
  var t=(i/n)*DURATION;
  renderAt(t);
  document.getElementById('fc').textContent=i;
  document.getElementById('tc').textContent=total;
  document.getElementById('tt').textContent=t.toFixed(2);
  return true;
};

init();
window.__renderFrame(0,1);
</script>

" onmouseover="this.style.transform='scale(1.1)';this.style.boxShadow='0 0 20px rgba(212,175,55,0.4)'"
   onmouseout="this.style.transform='scale(1)';this.style.boxShadow='none'"
   onclick="window.open('https://myaelmendez.github.io/verify.html?url='+encodeURIComponent(location.href),'_blank')"
   title="æ:// Verify this surface">
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=48x48&data=https://myaelmendez.github.io/fase14-xmlsvg-dataflow.html&color=D4AF37&bgcolor=050505"
       alt="QR Verify" style="width:100%;height:100%;display:block;">
</div>
</body>
