<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>æ:// fase16 — Video → Context → Agent Action</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--void:#050505;--gold:#D4AF37;--cyan:#00eaff;--green:#4dff9e;--red:#ff5a5a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--void);font-family:'JetBrains Mono',ui-monospace,monospace}
#c{position:fixed;top:0;left:0;width:1920px;height:1080px;display:block;z-index:1}
#scanlines{position:fixed;top:0;left:0;width:1920px;height:1080px;z-index:40;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.28) 0px,rgba(0,0,0,0.28) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply}
#vignette{position:fixed;top:0;left:0;width:1920px;height:1080px;z-index:41;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,0.62) 100%)}
#hud{position:fixed;top:44px;left:52px;z-index:50;color:var(--gold);pointer-events:none}
#hud h1{font-size:31px;font-weight:700;letter-spacing:3px;text-shadow:0 0 20px rgba(212,175,55,0.65)}
#hud .sub{margin-top:10px;font-size:15px;letter-spacing:5px;color:var(--cyan);text-transform:uppercase;opacity:0.9}
#hud .rule{width:420px;height:1px;margin:22px 0;background:linear-gradient(90deg,var(--gold),transparent)}
#hud .loop{font-size:16px;letter-spacing:2px}
#hud .st{opacity:0.45;transition:opacity .2s,color .2s,text-shadow .2s}
#hud .st.on{opacity:1;color:#eafcff;text-shadow:0 0 16px rgba(0,234,255,0.9)}
#hud .ar{color:var(--gold);opacity:0.6;margin:0 8px}
#hud ul{list-style:none;margin-top:22px;font-size:14px;line-height:1.95}
#hud li{opacity:0.72}
#hud li::before{content:'\25B8 ';color:var(--cyan)}
#hud .v{color:var(--cyan)}
#readout{position:fixed;bottom:44px;left:52px;z-index:50;color:var(--cyan);font-size:15px;letter-spacing:3px}
#readout .g{color:var(--gold)}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="hud">
  <h1>æ:// fase16-video-context</h1>
  <div class="sub">Semana 16 · Video → Context → Agent Action</div>
  <div class="rule"></div>
  <div class="loop">
    <span class="st" data-st="0">capture</span><span class="ar">&rarr;</span>
    <span class="st" data-st="1">parse</span><span class="ar">&rarr;</span>
    <span class="st" data-st="2">act</span><span class="ar">&rarr;</span>
    <span class="st" data-st="3">verify</span>
  </div>
  <ul>
    <li>frames analyzed &middot; <span class="v" id="fa">0</span> / <span class="v">450</span></li>
    <li>avg luma &middot; <span class="v" id="al">0.0</span></li>
    <li>objects detected &middot; <span class="v" id="od">0</span></li>
    <li>actions taken &middot; <span class="v" id="ac">0</span></li>
    <li>receipt &middot; <span class="v" id="rc">pending</span></li>
  </ul>
</div>
<div id="readout">frame <span class="g" id="fc">0</span> / <span id="tc">0</span> &middot; t <span class="g" id="tt">0.00</span>s</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
var W=1920,H=1080,DURATION=15.0;
var GOLD=0xD4AF37,CYAN=0x00eaff,GREEN=0x4dff9e,RED=0xff5a5a;
var scene,camera,renderer,backdropMat;
var nodes=[],signals=[];
var capturedFrames=0, avgLuma=0, objects=0, actions=0;

function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a0a0a);
  camera=new THREE.PerspectiveCamera(50,W/H,0.1,6000);
  camera.position.set(0,140,380);
  camera.lookAt(0,0,0);
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
  renderer.setPixelRatio(1);
  renderer.setSize(W,H);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=2.5;

  backdropMat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0}},
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'varying vec2 vUv;uniform float uTime;void main(){vec2 p=vUv-0.5;float d=length(p*vec2(1.0,0.82));float core=smoothstep(0.82,0.0,d);float ring=smoothstep(0.05,0.0,abs(d-0.44));vec3 col=vec3(0.84,0.69,0.22)*core*1.8+vec3(0.0,0.92,1.0)*ring*1.2+vec3(0.84,0.69,0.22)*0.35;col*=1.2+0.3*sin(uTime*1.3);gl_FragColor=vec4(col,1.0);}'
  });
  var backdrop=new THREE.Mesh(new THREE.PlaneGeometry(2000,1200),backdropMat);
  backdrop.position.set(0,0,-800);
  backdrop.renderOrder=-1;
  scene.add(backdrop);

  scene.add(new THREE.AmbientLight(0xffffff,1.4));
  var key=new THREE.DirectionalLight(0xffffff,2.0);key.position.set(120,260,180);scene.add(key);
  var rim=new THREE.PointLight(CYAN,2.5,3000);rim.position.set(-180,120,-120);scene.add(rim);

  // Video context nodes (represent frames analyzed)
  var boxGeo=new THREE.BoxGeometry(10,6,10);
  for(var i=0;i<12;i++){
    var color=[GOLD,CYAN,GREEN,RED][i%4];
    var mat=new THREE.MeshStandardMaterial({color:color,emissive:color,emissiveIntensity:0.5,roughness:0.3,metalness:0.6});
    var mesh=new THREE.Mesh(boxGeo,mat);
    mesh.position.set((i-6)*28, Math.sin(i*0.7)*8, 0);
    scene.add(mesh);
    nodes.push({mesh:mesh,mat:mat,color:color,phase:i*0.3});
  }

  // Signal pulses (agent actions)
  var pulseGeo=new THREE.SphereGeometry(2,8,8);
  for(var i=0;i<8;i++){
    var color=[GOLD,CYAN,GREEN,RED][i%4];
    var mat=new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0});
    var s=new THREE.Mesh(pulseGeo,mat);
    s.visible=false;scene.add(s);
    signals.push({mesh:s,mat:mat,edgeIdx:i%nodes.length,t:0,speed:0.18+Math.random()*0.2});
  }

  // Octahedra as AI Agent nodes
  var agentGeo=new THREE.OctahedronGeometry(4,0);
  for(var i=0;i<4;i++){
    var color=[GOLD,CYAN,GREEN,RED][i];
    var mat=new THREE.MeshStandardMaterial({color:color,emissive:color,emissiveIntensity:0.9,roughness:0.2,metalness:0.5,transparent:true,opacity:0.9});
    var node=new THREE.Mesh(agentGeo,mat);
    var angle=(i/4)*Math.PI*2;
    node.position.set(Math.cos(angle)*120,30+Math.random()*10,Math.sin(angle)*100);
    scene.add(node);
    nodes.push({mesh:node,mat:mat,color:color,phase:i*0.5, isAgent:true});
  }
}

function renderAt(t){
  backdropMat.uniforms.uTime.value=t;

  // Agent loop phases
  var phase=Math.floor(t/DURATION*4)%4;
  var stepEls=document.querySelectorAll('#hud .st');
  for(var k=0;k<stepEls.length;k++)stepEls[k].classList.toggle('on',k===phase);

  // Update metrics
  capturedFrames=Math.floor(t/DURATION*450);
  avgLuma= (25 + 80*Math.sin(t*0.3))%100;
  objects=Math.floor((t/DURATION)*8);
  actions=objects>0?Math.floor(t/DURATION*24/4):0;
  document.getElementById('fa').textContent=capturedFrames;
  document.getElementById('al').textContent=avgLuma.toFixed(1);
  document.getElementById('od').textContent=objects;
  document.getElementById('ac').textContent=actions;
  if(actions>=8)document.getElementById('rc').textContent='✓ receipt';

  // Nodes (video frames) animate
  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    if(!n.isAgent){
      n.mesh.rotation.y=t*0.4+i*0.3;
      n.mesh.position.y=Math.sin(t*1.2+n.phase)*8;
      n.mat.emissiveIntensity=0.4+0.2*Math.sin(t*2+n.phase*0.8);
    } else {
      n.mesh.position.y=30+Math.sin(t*1.5+n.phase)*4;
      n.mesh.rotation.y=t*0.5+n.phase;
      n.mesh.rotation.x=Math.sin(t*0.3+n.phase)*0.2;
      n.mat.emissiveIntensity=0.7+0.3*Math.sin(t*2+n.phase);
    }
  }

  // Signals pulse between nodes
  for(var i=0;i<signals.length;i++){
    var s=signals[i];
    s.t=(t*0.18+i*0.12)%1;
    var a=nodes[i];
    var b=nodes[(i+4)%nodes.length];
    s.mesh.position.lerpVectors(a.mesh.position,b.mesh.position,s.t);
    s.mesh.visible=true;
    s.mat.opacity=Math.sin(s.t*Math.PI)*0.8;
  }

  // Camera gentle sway
  var ang=0.4+Math.sin(t*0.5)*0.5;
  camera.position.set(Math.cos(ang)*380,140+Math.sin(t*0.7)*25,Math.sin(ang)*380);
  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
}

window.__renderFrame=function(i,total){
  if(!renderer)return;
  var n=Math.max(1,(total||1)-1);
  var t=(i/n)*DURATION;
  renderAt(t);
  document.getElementById('fc').textContent=i;
  document.getElementById('tc').textContent=total;
  document.getElementById('tt').textContent=t.toFixed(2);
  return true;
};

init();
window.__renderFrame(0,1);
</script>

  position:fixed;bottom:16px;right:16px;z-index:99999;
  width:56px;height:56px;border:1px solid #D4AF37;border-radius:8px;
  background:#050505;padding:4px;cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s;
" onmouseover="this.style.transform='scale(1.1)';this.style.boxShadow='0 0 20px rgba(212,175,55,0.4)'"
   onmouseout="this.style.transform='scale(1)';this.style.boxShadow='none'"
   onclick="window.open('https://myaelmendez.github.io/verify.html?url='+encodeURIComponent(location.href),'_blank')"
   title="æ:// Verify this surface">
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=48x48&data=https://myaelmendez.github.io/fase16-video-to-context.html&color=D4AF37&bgcolor=050505"
       alt="QR Verify" style="width:100%;height:100%;display:block;">
</div>
</body>
</html>
