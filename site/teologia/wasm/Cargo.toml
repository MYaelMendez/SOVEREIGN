[package]
name = "teologia-ai"
version = "0.1.0"
edition = "2021"
description = "teologia.ai platform — Rust WASM core for the æ:// devotional surface"
license = "MIT"
repository = "https://github.com/MYaelMendez/MYaelMendez.github.io"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# wasm-opt fails on this toolchain's bulk-memory output unless the flag is
# passed; the binaryen bundled by wasm-pack does not. The crate is already
# `opt-level = "z"` + LTO, so skip the extra pass rather than ship a broken build.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
