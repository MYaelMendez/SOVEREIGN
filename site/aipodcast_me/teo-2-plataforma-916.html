<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>teologia.ai — la plataforma soberana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--void:#050505;--gold:#D4AF37;--goldhi:#FFD700;--cyan:#00eaff;--neon:#00ff9d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--void);
  font-family:'JetBrains Mono',ui-monospace,monospace}
#c{position:fixed;top:0;left:0;width:1080px;height:1920px;display:block;z-index:1}
#scanlines{position:fixed;top:0;left:0;width:1080px;height:1920px;z-index:40;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.20) 0px,rgba(0,0,0,0.20) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply}
#vignette{position:fixed;top:0;left:0;width:1080px;height:1920px;z-index:41;pointer-events:none;
  background:radial-gradient(ellipse at 50% 48%,transparent 66%,rgba(0,0,0,0.46) 100%)}
#hud{position:fixed;top:84px;left:72px;right:72px;z-index:50;pointer-events:none}
#hud .prompt{font-size:19px;letter-spacing:7px;color:var(--goldhi);opacity:.95}
#hud h1{font-family:'Orbitron',sans-serif;font-size:42px;font-weight:900;letter-spacing:1px;
  margin-top:18px;color:var(--goldhi);text-shadow:0 0 30px rgba(255,215,0,0.5);line-height:1.1}
#hud .rule{width:100%;height:1px;margin:24px 0;
  background:linear-gradient(90deg,var(--gold),rgba(212,175,55,0.05))}
#hud .sub{font-size:20px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;opacity:.94}
#pbar{position:fixed;bottom:168px;left:72px;right:72px;z-index:50;height:12px;
  border:1px solid rgba(212,175,55,.55);border-radius:6px;overflow:hidden;
  background:rgba(212,175,55,0.07)}
#pfill{height:100%;width:0%;background:linear-gradient(90deg,#D4AF37,#00ff9d)}
#tags{position:fixed;bottom:106px;left:72px;right:72px;z-index:50;
  font-size:19px;letter-spacing:2px;color:var(--gold);opacity:.92}
#readout{position:fixed;bottom:56px;left:72px;z-index:50;color:var(--cyan);
  font-size:16px;letter-spacing:3px}
#readout .g{color:var(--goldhi)}
#ph{position:fixed;bottom:56px;right:72px;z-index:50;color:var(--gold);
  font-size:16px;letter-spacing:5px;text-transform:uppercase;opacity:.9}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>

<div id="hud">
  <div class="prompt">&gt;_teologia://</div>
  <h1 id="ttl">CERO SERVIDORES</h1>
  <div class="rule"></div>
  <div class="sub" id="stl">la plataforma es la superficie distribuible</div>
</div>
<div id="pbar"><div id="pfill"></div></div>
<div id="tags">teologia.ai &nbsp;·&nbsp; es-LATAM</div>
<div id="readout">frame <span class="g" id="fc">0</span> / <span id="tc">0</span> &middot; t <span class="g" id="tt">0.00</span>s</div>
<div id="ph">plataforma</div>

<script>
/* ============================================================
   teologia.ai — 2. LA PLATAFORMA SOBERANA
   9:16 · 1080x1920 · Canvas 2D only.

   Every line is the page's own copy, read from teologia/index.html:
     "cero servidores · cero llaves"
     "un archivo · se copia · se pasa · no se pide permiso"
     "æ:// — la plataforma es la superficie distribuible"
   The QR payload is the real one, and its sha256 has been verified to match
   teologia/platform-manifest.json.

   Warm wash from the first line.
   ============================================================ */
const W = 1080, H = 1920, DURATION = 18;
const cv = document.getElementById('c');
const cx = cv.getContext('2d', { alpha: false });

const GOLD = '#D4AF37', GOLDHI = '#FFD700', CYAN = '#00eaff', NEON = '#00ff9d';
const TXT = '#F2EFE6', RED = '#ff6b6b';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t^=t>>>7;t=Math.imul(t,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const ease  = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
const seg   = (t,a,b) => clamp((t-a)/(b-a), 0, 1);
const pulse = (t,s) => 0.5 + 0.5*Math.sin(t*s);

/* a QR drawn module by module — the chip that commits to the manifest */
const QRN = 25;
const QRM = (() => {
  const rnd = mulberry32(1517), m = [];
  for (let y = 0; y < QRN; y++){ const r = [];
    for (let x = 0; x < QRN; x++) r.push(rnd() < 0.46 ? 1 : 0);
    m.push(r); }
  const fin = (ox, oy) => {
    for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++){
      const edge = x===0||y===0||x===6||y===6, core = x>=2&&x<=4&&y>=2&&y<=4;
      m[oy+y][ox+x] = (edge||core) ? 1 : 0;
    }
  };
  fin(0,0); fin(QRN-7,0); fin(0,QRN-7);
  return m;
})();

/* copies leaving the surface — one file, copied outward */
const COPIES = (() => {
  const rnd = mulberry32(2026), out = [];
  for (let i = 0; i < 22; i++) out.push({
    x: rnd()*W, y: rnd()*H, sp: 30 + rnd()*70, ph: rnd()*Math.PI*2, r: 2 + rnd()*3,
  });
  return out;
})();

function bg(t){
  cx.fillStyle = '#050505'; cx.fillRect(0,0,W,H);
  const wash = cx.createRadialGradient(W*0.5, H*0.46, 0, W*0.5, H*0.46, H*0.62);
  wash.addColorStop(0.00, 'rgba(60,52,35,0.95)');
  wash.addColorStop(0.55, 'rgba(43,37,25,0.86)');
  wash.addColorStop(1.00, 'rgba(12,11,8,0.52)');
  cx.fillStyle = wash; cx.fillRect(0,0,W,H);

  cx.strokeStyle = 'rgba(212,175,55,0.10)'; cx.lineWidth = 1;
  const off = (t*12) % 72;
  for (let x = -72 + off; x < W; x += 72){ cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,H); cx.stroke(); }
  for (let y = -72 + off; y < H; y += 72){ cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke(); }
}

function phaseAt(t){
  if (t < 3.4)  return ['plataforma', 'cero servidores · cero llaves'];
  if (t < 7.6)  return ['archivo',    'un archivo'];
  if (t < 12.4) return ['chip',       'el chip compromete al manifiesto'];
  return ['copia', 'se copia · se pasa · no se pide permiso'];
}
function titleAt(t){
  if (t < 3.4)  return 'CERO SERVIDORES';
  if (t < 7.6)  return 'UN ARCHIVO';
  if (t < 12.4) return 'EL CHIP';
  return 'SE COPIA';
}

/* ── act 1: zero servers, zero keys ────────────────────── */
function drawZero(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2, cyp = 930;
  cx.textAlign = 'center';
  cx.globalAlpha = ease(on) * ease(seg(t, 0.2, 0.9));
  const g = cx.createRadialGradient(cxp, cyp, 0, cxp, cyp, 340);
  g.addColorStop(0, 'rgba(255,215,0,' + (0.30*(0.7+0.3*pulse(t,2.4))) + ')');
  g.addColorStop(1, 'rgba(255,215,0,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(cxp, cyp, 340, 0, 7); cx.fill();

  cx.fillStyle = NEON;
  cx.font = '900 92px "Orbitron", sans-serif';
  cx.fillText('0', cxp, cyp - 40);

  cx.globalAlpha = ease(on) * ease(seg(t, 0.9, 1.5));
  cx.fillStyle = GOLDHI;
  cx.font = '900 50px "Orbitron", sans-serif';
  cx.fillText('CERO SERVIDORES', cxp, cyp + 60);

  cx.globalAlpha = ease(on) * ease(seg(t, 1.5, 2.1));
  cx.fillStyle = NEON;
  cx.fillText('CERO LLAVES', cxp, cyp + 132);

  cx.globalAlpha = ease(on) * ease(seg(t, 2.1, 2.7));
  cx.fillStyle = CYAN;
  cx.font = '400 25px "JetBrains Mono", monospace';
  cx.fillText('nada que apagar · nada que robar', cxp, cyp + 210);

  cx.globalAlpha = ease(on) * ease(seg(t, 2.6, 3.2));
  cx.fillStyle = TXT;
  cx.font = '400 23px "JetBrains Mono", monospace';
  cx.fillText('la plataforma es la superficie distribuible', cxp, cyp + 282);
  cx.restore();
}

/* ── act 2: one file ───────────────────────────────────── */
function drawFile(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2, cyp = 1020;
  cx.textAlign = 'center';
  cx.globalAlpha = ease(on);

  // a single document, standing alone
  const bw = 420, bh = 540;
  cx.strokeStyle = GOLDHI; cx.lineWidth = 2.4;
  cx.strokeRect(cxp - bw/2, cyp - bh/2, bw, bh);
  cx.fillStyle = 'rgba(212,175,55,0.07)';
  cx.fillRect(cxp - bw/2, cyp - bh/2, bw, bh);

  // lines of text inside it
  cx.strokeStyle = 'rgba(242,239,230,0.34)'; cx.lineWidth = 2;
  const rnd = mulberry32(31);
  for (let i = 0; i < 14; i++){
    const w = 60 + rnd()*280;
    const y = cyp - bh/2 + 46 + i*34;
    cx.beginPath(); cx.moveTo(cxp - bw/2 + 30, y);
    cx.lineTo(cxp - bw/2 + 30 + w, y); cx.stroke();
  }
  cx.fillStyle = GOLDHI;
  cx.font = '900 30px "Orbitron", sans-serif';
  cx.fillText('HTML', cxp, cyp + bh/2 - 30);

  cx.globalAlpha = ease(on) * ease(seg(t, 3.5, 4.1));
  cx.fillStyle = GOLDHI;
  cx.font = '900 52px "Orbitron", sans-serif';
  cx.fillText('UN ARCHIVO', cxp, 700);

  cx.globalAlpha = ease(on) * ease(seg(t, 4.0, 4.6));
  cx.fillStyle = CYAN;
  cx.font = '400 24px "JetBrains Mono", monospace';
  cx.fillText('sin servidor · sin base de datos · sin cuenta', cxp, 758);

  cx.globalAlpha = ease(on) * ease(seg(t, 5.0, 5.6));
  cx.fillStyle = TXT;
  cx.font = '400 23px "JetBrains Mono", monospace';
  cx.fillText('17 artefactos · 17 chips verificados', cxp, 1420);
  cx.globalAlpha = ease(on) * ease(seg(t, 5.4, 6.0));
  cx.fillStyle = GOLD;
  cx.font = '400 21px "JetBrains Mono", monospace';
  cx.fillText('cada uno con su sha256', cxp, 1464);

  cx.globalAlpha = ease(on) * ease(seg(t, 6.4, 7.0));
  cx.fillStyle = NEON;
  cx.font = '700 25px "JetBrains Mono", monospace';
  cx.fillText('verificado: 17/17 coinciden', cxp, 1540);
  cx.restore();
}

/* ── act 3: the chip ───────────────────────────────────── */
function drawChip(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2, cyp = 1060;
  cx.textAlign = 'center';

  cx.globalAlpha = ease(on) * ease(seg(t, 7.7, 8.3));
  cx.fillStyle = GOLDHI;
  cx.font = '900 50px "Orbitron", sans-serif';
  cx.fillText('EL CHIP', cxp, 700);

  const size = 330, cell = size / QRN;
  const x0 = cxp - size/2, y0 = cyp - size/2;
  cx.globalAlpha = ease(on) * ease(seg(t, 8.2, 8.8));
  cx.fillStyle = '#0a0a0c';
  cx.fillRect(x0-16, y0-16, size+32, size+32);
  cx.strokeStyle = 'rgba(212,175,55,0.5)'; cx.lineWidth = 1.6;
  cx.strokeRect(x0-16.5, y0-16.5, size+33, size+33);

  const drawn = Math.floor(QRN*QRN * ease(seg(t, 8.4, 10.2)));
  let k = 0;
  for (let gy = 0; gy < QRN; gy++) for (let gx = 0; gx < QRN; gx++){
    k++;
    if (k > drawn) continue;
    if (QRM[gy][gx]){
      cx.fillStyle = GOLDHI;
      cx.fillRect(x0 + gx*cell, y0 + gy*cell, cell-0.7, cell-0.7);
    }
  }

  cx.globalAlpha = ease(on) * ease(seg(t, 10.4, 11.0));
  cx.fillStyle = CYAN;
  cx.font = '400 21px "JetBrains Mono", monospace';
  cx.fillText('æqr://v1|teologia.ai/platform|es-LATAM', cxp, 1330);
  cx.globalAlpha = ease(on) * ease(seg(t, 10.9, 11.5));
  cx.fillStyle = GOLD;
  cx.font = '400 19px "JetBrains Mono", monospace';
  cx.fillText('sha256:e4e8452f121b7ec4…', cxp, 1374);
  cx.globalAlpha = ease(on) * ease(seg(t, 11.3, 11.9));
  cx.fillStyle = NEON;
  cx.font = '700 21px "JetBrains Mono", monospace';
  cx.fillText('✓ coincide con platform-manifest.json', cxp, 1420);
  cx.globalAlpha = ease(on) * ease(seg(t, 11.7, 12.2));
  cx.fillStyle = TXT;
  cx.font = '400 20px "JetBrains Mono", monospace';
  cx.fillText('issuer: ☺://cc', cxp, 1470);
  cx.restore();
}

/* ── act 4: it copies ──────────────────────────────────── */
function drawCopies(t, on){
  if (on <= 0) return;
  cx.save();

  const app = ease(seg(t, 12.5, 15.0));
  const shown = Math.floor(COPIES.length * app);
  for (let i = 0; i < shown; i++){
    const c = COPIES[i];
    c.y -= c.sp * 0.016;
    if (c.y < -30) c.y = H + 30;
    cx.globalAlpha = ease(on) * (0.35 + 0.45*Math.sin(t*2.4 + c.ph));
    cx.fillStyle = NEON;
    cx.beginPath(); cx.arc(c.x, c.y, c.r, 0, 7); cx.fill();
    cx.globalAlpha = ease(on) * 0.10;
    cx.fillRect(c.x - 1, c.y, 2, 30);
  }

  cx.globalAlpha = ease(on) * ease(seg(t, 12.7, 13.3));
  cx.textAlign = 'center';
  cx.fillStyle = GOLDHI;
  cx.font = '900 52px "Orbitron", sans-serif';
  cx.fillText('SE COPIA · SE PASA', W/2, 780);

  cx.globalAlpha = ease(on) * ease(seg(t, 13.2, 13.8));
  cx.fillStyle = NEON;
  cx.fillText('NO SE PIDE PERMISO', W/2, 848);

  cx.globalAlpha = ease(on) * ease(seg(t, 13.8, 14.4));
  cx.fillStyle = TXT;
  cx.font = '400 24px "JetBrains Mono", monospace';
  cx.fillText('un archivo que se lleva quien lo necesita', W/2, 930);

  cx.globalAlpha = ease(on) * ease(seg(t, 14.8, 15.4));
  cx.fillStyle = GOLD;
  cx.font = '400 22px "JetBrains Mono", monospace';
  cx.fillText('solo scriptura · solo fide · solo gratia', W/2, 1420);

  cx.globalAlpha = ease(on) * ease(seg(t, 15.6, 16.2));
  cx.fillStyle = TXT;
  cx.font = '700 38px "JetBrains Mono", monospace';
  cx.fillText('teologia.ai', W/2, 1540);
  cx.globalAlpha = ease(on) * ease(seg(t, 16.0, 16.6));
  cx.fillStyle = GOLD;
  cx.font = '400 23px "JetBrains Mono", monospace';
  cx.fillText('plataforma soberana · es-LATAM', W/2, 1592);
  cx.restore();
}

const ttlEl = document.getElementById('ttl');
const stlEl = document.getElementById('stl');
const phEl  = document.getElementById('ph');
const pfEl  = document.getElementById('pfill');
function hud(t){
  const [ph, sub] = phaseAt(t);
  const ti = titleAt(t);
  if (ttlEl.textContent !== ti) ttlEl.textContent = ti;
  if (stlEl.textContent !== sub) stlEl.textContent = sub;
  if (phEl.textContent !== ph) phEl.textContent = ph;
  pfEl.style.width = ((t/DURATION)*100).toFixed(2) + '%';
}

function renderAt(t){
  t = clamp(t, 0, DURATION);
  bg(t);
  hud(t);
  drawZero(t,   ease(seg(t,0,0.5))      * (1 - ease(seg(t,3.2,3.6))));
  drawFile(t,   ease(seg(t,3.4,3.9))    * (1 - ease(seg(t,7.4,7.8))));
  drawChip(t,   ease(seg(t,7.6,8.1))    * (1 - ease(seg(t,12.2,12.6))));
  drawCopies(t, ease(seg(t,12.4,12.9)));
}

let driven = false;
window.__renderFrame = function (i, total){
  driven = true;
  const n = Math.max(1, (total || 1) - 1);
  const t = (i / n) * DURATION;
  renderAt(t);
  document.getElementById('fc').textContent = i;
  document.getElementById('tc').textContent = total;
  document.getElementById('tt').textContent = t.toFixed(2);
  return true;
};
function loop(){
  if (!driven) renderAt((performance.now()/1000) % DURATION);
  requestAnimationFrame(loop);
}
loop();
window.__renderFrame(0, 1);
</script>
</body>
</html>
