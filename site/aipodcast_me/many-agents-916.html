<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>@yaelmendez — many agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--void:#050505;--gold:#D4AF37;--goldhi:#FFD700;--cyan:#00eaff;--neon:#00ff9d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--void);
  font-family:'JetBrains Mono',ui-monospace,monospace}
#c{position:fixed;top:0;left:0;width:1080px;height:1920px;display:block;z-index:1}
#scanlines{position:fixed;top:0;left:0;width:1080px;height:1920px;z-index:40;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.20) 0px,rgba(0,0,0,0.20) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply}
#vignette{position:fixed;top:0;left:0;width:1080px;height:1920px;z-index:41;pointer-events:none;
  background:radial-gradient(ellipse at 50% 48%,transparent 66%,rgba(0,0,0,0.46) 100%)}
#hud{position:fixed;top:84px;left:72px;right:72px;z-index:50;pointer-events:none}
#hud .prompt{font-size:19px;letter-spacing:7px;color:var(--goldhi);opacity:.95}
#hud h1{font-family:'Orbitron',sans-serif;font-size:46px;font-weight:900;letter-spacing:1px;
  margin-top:18px;color:var(--goldhi);text-shadow:0 0 30px rgba(255,215,0,0.5);line-height:1.1}
#hud .rule{width:100%;height:1px;margin:24px 0;
  background:linear-gradient(90deg,var(--gold),rgba(212,175,55,0.05))}
#hud .sub{font-size:21px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;opacity:.94}
#pbar{position:fixed;bottom:168px;left:72px;right:72px;z-index:50;height:12px;
  border:1px solid rgba(212,175,55,.55);border-radius:6px;overflow:hidden;
  background:rgba(212,175,55,0.07)}
#pfill{height:100%;width:0%;background:linear-gradient(90deg,#D4AF37,#00ff9d)}
#tags{position:fixed;bottom:106px;left:72px;right:72px;z-index:50;
  font-size:19px;letter-spacing:2px;color:var(--gold);opacity:.92}
#readout{position:fixed;bottom:56px;left:72px;z-index:50;color:var(--cyan);
  font-size:16px;letter-spacing:3px}
#readout .g{color:var(--goldhi)}
#ph{position:fixed;bottom:56px;right:72px;z-index:50;color:var(--gold);
  font-size:16px;letter-spacing:5px;text-transform:uppercase;opacity:.9}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>

<div id="hud">
  <div class="prompt">&gt;_æ://</div>
  <h1 id="ttl">MANY AGENTS</h1>
  <div class="rule"></div>
  <div class="sub" id="stl">the follow-up · one human, many agents</div>
</div>
<div id="pbar"><div id="pfill"></div></div>
<div id="tags">#internetofagents &nbsp;·&nbsp; #onepersoncompany</div>
<div id="readout">frame <span class="g" id="fc">0</span> / <span id="tc">0</span> &middot; t <span class="g" id="tt">0.00</span>s</div>
<div id="ph">one</div>

<script>
/* ============================================================
   @yaelmendez — "many agents"  (follow-up to #onepersoncompany)
   9:16 · 1080x1920 · Canvas 2D only.

   The warm wash is written in from the first line. Gold on void #050505
   is luminance 5; the gate needs a mean above 20, and a sparse frame is
   refused — correctly, because it has no mass.
   ============================================================ */
const W = 1080, H = 1920, DURATION = 18;
const cv = document.getElementById('c');
const cx = cv.getContext('2d', { alpha: false });

const GOLD = '#D4AF37', GOLDHI = '#FFD700', CYAN = '#00eaff', NEON = '#00ff9d';
const TXT = '#F2EFE6';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const ease  = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
const seg   = (t,a,b) => clamp((t-a)/(b-a), 0, 1);
const pulse = (t,s) => 0.5 + 0.5*Math.sin(t*s);

/* the fleet — a lattice that fills the frame */
const FLEET = (() => {
  const rnd = mulberry32(3131), out = [];
  const cols = 9, rows = 11;
  const x0 = 118, x1 = W - 118, y0 = 430, y1 = 1560;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++){
      const jx = (rnd()-.5) * 22, jy = (rnd()-.5) * 22;
      out.push({
        x: x0 + (c/(cols-1)) * (x1-x0) + jx,
        y: y0 + (r/(rows-1)) * (y1-y0) + jy,
        ph: rnd() * Math.PI * 2,
        s: 4.0 + rnd() * 3.6,
        kind: rnd(),
      });
    }
  return out;
})();

/* the nine links of the chain */
const LINKS = ['custody','format','gate','authority','contract','dispatch','publish','delivery','adoption'];

function bg(t){
  cx.fillStyle = '#050505'; cx.fillRect(0,0,W,H);

  const wash = cx.createRadialGradient(W*0.5, H*0.46, 0, W*0.5, H*0.46, H*0.62);
  wash.addColorStop(0.00, 'rgba(60,52,35,0.95)');
  wash.addColorStop(0.55, 'rgba(43,37,25,0.86)');
  wash.addColorStop(1.00, 'rgba(12,11,8,0.52)');
  cx.fillStyle = wash; cx.fillRect(0,0,W,H);

  cx.strokeStyle = 'rgba(212,175,55,0.10)'; cx.lineWidth = 1;
  const off = (t*12) % 72;
  for (let x = -72 + off; x < W; x += 72){ cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,H); cx.stroke(); }
  for (let y = -72 + off; y < H; y += 72){ cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke(); }
}

function phaseAt(t){
  if (t < 3.2)  return ['one',     'one human'];
  if (t < 7.0)  return ['fleet',   'many agents'];
  if (t < 11.4) return ['order',   'claim before you act'];
  if (t < 15.0) return ['chain',   'nine links · custody → adoption'];
  return ['many', 'point your agents at me'];
}
function titleAt(t){
  if (t < 3.2)  return 'ONE HUMAN';
  if (t < 7.0)  return 'MANY AGENTS';
  if (t < 11.4) return 'NO COLLISION';
  if (t < 15.0) return 'THE CHAIN';
  return 'MANY AGENTS';
}

/* ── act 1: one becomes many ───────────────────────────── */
function drawOne(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2, cyp = 960;
  cx.textAlign = 'center';

  cx.globalAlpha = ease(on) * ease(seg(t, 0.2, 0.9));
  const g = cx.createRadialGradient(cxp, cyp, 0, cxp, cyp, 320);
  g.addColorStop(0, 'rgba(255,215,0,' + (0.34*(0.7+0.3*pulse(t,2.6))) + ')');
  g.addColorStop(1, 'rgba(255,215,0,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(cxp, cyp, 320, 0, 7); cx.fill();

  cx.fillStyle = GOLDHI;
  cx.beginPath(); cx.arc(cxp, cyp, 46, 0, 7); cx.fill();
  cx.fillStyle = '#0a0a0a';
  cx.font = '900 46px "Orbitron", sans-serif';
  cx.fillText('æ', cxp, cyp + 16);

  cx.fillStyle = TXT;
  cx.font = '900 62px "Orbitron", sans-serif';
  cx.globalAlpha = ease(on) * ease(seg(t, 0.9, 1.5));
  cx.fillText('ONE HUMAN', cxp, cyp + 170);

  // the count: 1 → many, the reveal
  const n = Math.floor(1 + 199 * ease(seg(t, 1.9, 2.9)));
  cx.globalAlpha = ease(on) * ease(seg(t, 1.7, 2.2));
  cx.fillStyle = CYAN;
  cx.font = '900 92px "Orbitron", sans-serif';
  cx.fillText(String(n), cxp, cyp + 280);
  cx.fillStyle = GOLD;
  cx.font = '400 25px "JetBrains Mono", monospace';
  cx.fillText(n === 1 ? 'agent' : 'agents', cxp, cyp + 326);
  cx.restore();
}

/* ── act 2: the fleet fills the frame ──────────────────── */
function drawFleet(t, on){
  if (on <= 0) return;
  cx.save();
  const app = ease(seg(t, 3.2, 6.4));
  const shown = Math.floor(FLEET.length * app);
  const rnd = mulberry32(7);

  for (let i = 0; i < shown; i++){
    const f = FLEET[i];
    const tw = 0.5 + 0.5 * Math.sin(t*2.6 + f.ph);
    const col = f.kind < 0.18 ? CYAN : (f.kind < 0.30 ? NEON : GOLD);
    cx.globalAlpha = ease(on) * tw * 0.95;
    cx.fillStyle = col;
    cx.beginPath(); cx.arc(f.x, f.y, f.s, 0, 7); cx.fill();
    cx.globalAlpha = ease(on) * tw * 0.20;
    cx.beginPath(); cx.arc(f.x, f.y, f.s * 3.0, 0, 7); cx.fill();

    // a few links between neighbours, so it reads as a network not confetti
    if (i > 0 && i % 7 === 0){
      const p = FLEET[i-1];
      cx.globalAlpha = ease(on) * 0.30;
      cx.strokeStyle = 'rgba(0,234,255,0.55)'; cx.lineWidth = 1.2;
      cx.beginPath(); cx.moveTo(p.x, p.y); cx.lineTo(f.x, f.y); cx.stroke();
    }
  }

  cx.globalAlpha = ease(on) * ease(seg(t, 4.2, 4.9));
  cx.textAlign = 'center';
  cx.fillStyle = GOLDHI;
  cx.font = '900 88px "Orbitron", sans-serif';
  cx.fillText('MANY', W/2, 800);
  cx.globalAlpha = ease(on) * ease(seg(t, 4.7, 5.4));
  cx.font = '900 88px "Orbitron", sans-serif';
  cx.fillText('AGENTS', W/2, 900);
  cx.globalAlpha = ease(on) * ease(seg(t, 5.3, 6.0));
  cx.fillStyle = CYAN;
  cx.font = '400 27px "JetBrains Mono", monospace';
  cx.fillText('one principal · many workers', W/2, 962);
  cx.restore();
}

/* ── act 3: they queue — the lock, with the real delays ── */
function drawOrder(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2;
  cx.textAlign = 'center';

  cx.globalAlpha = ease(on) * ease(seg(t, 7.0, 7.6));
  cx.fillStyle = GOLDHI;
  cx.font = '900 66px "Orbitron", sans-serif';
  cx.fillText('NO COLLISION', cxp, 700);
  cx.globalAlpha = ease(on) * ease(seg(t, 7.5, 8.1));
  cx.fillStyle = CYAN;
  cx.font = '400 26px "JetBrains Mono", monospace';
  cx.fillText('a shared resource gets a lock, and the lock gets a record', cxp, 756);

  // three agents arriving at one gate, serialized — the measured delays
  const rows = [
    ['agent-0', 0.01, 'acquired'],
    ['agent-1', 1.53, 'acquired'],
    ['agent-2', 3.08, 'acquired'],
  ];
  cx.font = '700 30px "JetBrains Mono", monospace';
  for (let i = 0; i < rows.length; i++){
    const [name, delay, verdict] = rows[i];
    const at = 8.3 + i * 0.55;
    const a = ease(seg(t, at, at + 0.5));
    const y = 900 + i * 130;
    cx.globalAlpha = ease(on) * a;

    // the lane
    cx.strokeStyle = 'rgba(212,175,55,0.26)'; cx.lineWidth = 1.4;
    cx.strokeRect(120, y - 46, 840, 92);

    cx.textAlign = 'left';
    cx.fillStyle = TXT;
    cx.font = '700 30px "JetBrains Mono", monospace';
    cx.fillText(name, 156, y + 11);

    // the wait bar — the delay is the point
    const bw = 300, bx = 400;
    cx.strokeStyle = 'rgba(212,175,55,0.34)'; cx.lineWidth = 1;
    cx.strokeRect(bx, y - 13, bw, 26);
    cx.fillStyle = NEON;
    cx.globalAlpha = ease(on) * a * 0.85;
    cx.fillRect(bx, y - 13, bw * clamp(delay / 3.5, 0.03, 1), 26);

    cx.globalAlpha = ease(on) * a;
    cx.fillStyle = GOLDHI;
    cx.fillText(delay.toFixed(2) + 's', bx + bw + 26, y + 11);
    cx.fillStyle = NEON;
    cx.font = '700 24px "JetBrains Mono", monospace';
    cx.fillText(verdict, 760, y + 9);
    cx.font = '700 30px "JetBrains Mono", monospace';
  }

  cx.textAlign = 'center';
  cx.globalAlpha = ease(on) * ease(seg(t, 10.3, 11.0));
  cx.fillStyle = GOLD;
  cx.font = '400 25px "JetBrains Mono", monospace';
  cx.fillText('serialized — each waits for the one before it', cxp, 1420);
  cx.restore();
}

/* ── act 4: the chain ──────────────────────────────────── */
function drawChain(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2;
  cx.textAlign = 'center';

  cx.globalAlpha = ease(on) * ease(seg(t, 11.4, 12.0));
  cx.fillStyle = GOLDHI;
  cx.font = '900 60px "Orbitron", sans-serif';
  cx.fillText('NINE LINKS', cxp, 640);

  const y0 = 730, gap = 92;
  for (let i = 0; i < LINKS.length; i++){
    const at = 12.0 + i * 0.24;
    const a = ease(seg(t, at, at + 0.4));
    const y = y0 + i * gap;
    cx.globalAlpha = ease(on) * a;

    // the node
    cx.fillStyle = i % 2 ? CYAN : GOLD;
    cx.beginPath(); cx.arc(300, y, 9, 0, 7); cx.fill();

    // the link line to the next
    if (i < LINKS.length - 1){
      cx.globalAlpha = ease(on) * a * ease(seg(t, at + 0.3, at + 0.6));
      cx.strokeStyle = 'rgba(212,175,55,0.5)'; cx.lineWidth = 2;
      cx.beginPath(); cx.moveTo(300, y + 10); cx.lineTo(300, y + gap - 10); cx.stroke();
    }

    cx.globalAlpha = ease(on) * a;
    cx.textAlign = 'left';
    cx.fillStyle = TXT;
    cx.font = '700 30px "JetBrains Mono", monospace';
    cx.fillText(LINKS[i], 350, y + 11);
    cx.fillStyle = 'rgba(242,239,230,0.42)';
    cx.font = '400 21px "JetBrains Mono", monospace';
    const roles = ['where the secret lives','how anything crosses','is it real','who may act','what was promised','which resource','audit → repair','reaches a person','is every agent taught'];
    cx.fillText(roles[i], 350, y + 40);
  }

  cx.textAlign = 'center';
  cx.globalAlpha = ease(on) * ease(seg(t, 14.4, 14.9));
  cx.fillStyle = GOLDHI;
  cx.font = '700 28px "JetBrains Mono", monospace';
  cx.fillText('most tasks are already a link', cxp, 1660);
  cx.restore();
}

/* ── act 5: the mark ───────────────────────────────────── */
function drawMark(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2, cyp = 900;
  cx.globalAlpha = ease(on);
  const g = cx.createRadialGradient(cxp, cyp, 0, cxp, cyp, 400);
  g.addColorStop(0, 'rgba(255,215,0,0.24)');
  g.addColorStop(1, 'rgba(255,215,0,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(cxp, cyp, 400, 0, 7); cx.fill();

  cx.textAlign = 'center';
  cx.fillStyle = GOLDHI;
  cx.font = '900 132px "Orbitron", sans-serif';
  cx.globalAlpha = ease(on) * ease(seg(t, 15.1, 15.7));
  cx.fillText('æ', cxp, cyp + 40);

  cx.globalAlpha = ease(on) * ease(seg(t, 15.5, 16.1));
  cx.fillStyle = TXT;
  cx.font = '900 68px "Orbitron", sans-serif';
  cx.fillText('MANY AGENTS', cxp, cyp + 146);

  cx.globalAlpha = ease(on) * ease(seg(t, 16.0, 16.6));
  cx.fillStyle = CYAN;
  cx.font = '400 27px "JetBrains Mono", monospace';
  cx.fillText('one human · one company · many agents', cxp, cyp + 206);

  cx.globalAlpha = ease(on) * ease(seg(t, 16.4, 17.0));
  cx.fillStyle = GOLD;
  cx.font = '700 25px "JetBrains Mono", monospace';
  cx.fillText('partnersps.doola.com/hhsoqhb23250', cxp, cyp + 272);

  cx.globalAlpha = ease(on) * ease(seg(t, 16.8, 17.4));
  cx.fillStyle = TXT;
  cx.font = '700 36px "JetBrains Mono", monospace';
  cx.fillText('@yaelmendez', cxp, cyp + 358);
  cx.globalAlpha = ease(on) * ease(seg(t, 17.1, 17.7));
  cx.fillStyle = GOLD;
  cx.font = '400 24px "JetBrains Mono", monospace';
  cx.fillText('#internetofagents  ·  #onepersoncompany', cxp, cyp + 410);
  cx.restore();
}

/* ── HUD ───────────────────────────────────────────────── */
const ttlEl = document.getElementById('ttl');
const stlEl = document.getElementById('stl');
const phEl  = document.getElementById('ph');
const pfEl  = document.getElementById('pfill');
function hud(t){
  const [ph, sub] = phaseAt(t);
  const ti = titleAt(t);
  if (ttlEl.textContent !== ti) ttlEl.textContent = ti;
  if (stlEl.textContent !== sub) stlEl.textContent = sub;
  if (phEl.textContent !== ph) phEl.textContent = ph;
  pfEl.style.width = ((t/DURATION)*100).toFixed(2) + '%';
}

/* ── the frame ─────────────────────────────────────────── */
function renderAt(t){
  t = clamp(t, 0, DURATION);
  bg(t);
  hud(t);

  drawOne(t,   ease(seg(t,0,0.5))   * (1 - ease(seg(t,3.0,3.5))));
  drawFleet(t, ease(seg(t,3.2,3.7)) * (1 - ease(seg(t,6.8,7.3))));
  drawOrder(t, ease(seg(t,7.0,7.5)) * (1 - ease(seg(t,11.1,11.6))));
  drawChain(t, ease(seg(t,11.4,11.9)) * (1 - ease(seg(t,14.7,15.2))));
  drawMark(t,  ease(seg(t,15.0,15.7)));
}

/* ── the external frame hook ───────────────────────────── */
let driven = false;
window.__renderFrame = function (i, total){
  driven = true;
  const n = Math.max(1, (total || 1) - 1);
  const t = (i / n) * DURATION;
  renderAt(t);
  document.getElementById('fc').textContent = i;
  document.getElementById('tc').textContent = total;
  document.getElementById('tt').textContent = t.toFixed(2);
  return true;
};

function loop(){
  if (!driven) renderAt((performance.now()/1000) % DURATION);
  requestAnimationFrame(loop);
}
loop();
window.__renderFrame(0, 1);
</script>
</body>
</html>
