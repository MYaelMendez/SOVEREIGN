<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>teologia.ai — enseñarles temprano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--void:#050505;--gold:#D4AF37;--goldhi:#FFD700;--cyan:#00eaff;--neon:#00ff9d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--void);
  font-family:'JetBrains Mono',ui-monospace,monospace}
#c{position:fixed;top:0;left:0;width:1080px;height:1920px;display:block;z-index:1}
#scanlines{position:fixed;top:0;left:0;width:1080px;height:1920px;z-index:40;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.20) 0px,rgba(0,0,0,0.20) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply}
#vignette{position:fixed;top:0;left:0;width:1080px;height:1920px;z-index:41;pointer-events:none;
  background:radial-gradient(ellipse at 50% 48%,transparent 66%,rgba(0,0,0,0.46) 100%)}
#hud{position:fixed;top:84px;left:72px;right:72px;z-index:50;pointer-events:none}
#hud .prompt{font-size:19px;letter-spacing:7px;color:var(--goldhi);opacity:.95}
#hud h1{font-family:'Orbitron',sans-serif;font-size:40px;font-weight:900;letter-spacing:1px;
  margin-top:18px;color:var(--goldhi);text-shadow:0 0 30px rgba(255,215,0,0.5);line-height:1.1}
#hud .rule{width:100%;height:1px;margin:24px 0;
  background:linear-gradient(90deg,var(--gold),rgba(212,175,55,0.05))}
#hud .sub{font-size:20px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;opacity:.94}
#pbar{position:fixed;bottom:168px;left:72px;right:72px;z-index:50;height:12px;
  border:1px solid rgba(212,175,55,.55);border-radius:6px;overflow:hidden;
  background:rgba(212,175,55,0.07)}
#pfill{height:100%;width:0%;background:linear-gradient(90deg,#D4AF37,#00ff9d)}
#tags{position:fixed;bottom:106px;left:72px;right:72px;z-index:50;
  font-size:19px;letter-spacing:2px;color:var(--gold);opacity:.92}
#readout{position:fixed;bottom:56px;left:72px;z-index:50;color:var(--cyan);
  font-size:16px;letter-spacing:3px}
#readout .g{color:var(--goldhi)}
#ph{position:fixed;bottom:56px;right:72px;z-index:50;color:var(--gold);
  font-size:16px;letter-spacing:5px;text-transform:uppercase;opacity:.9}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>

<div id="hud">
  <div class="prompt">&gt;_teologia://</div>
  <h1 id="ttl">ENSEÑARLES TEMPRANO</h1>
  <div class="rule"></div>
  <div class="sub" id="stl">lo que aprendimos tarde</div>
</div>
<div id="pbar"><div id="pfill"></div></div>
<div id="tags">teologia.ai &nbsp;·&nbsp; Donna, Texas</div>
<div id="readout">frame <span class="g" id="fc">0</span> / <span id="tc">0</span> &middot; t <span class="g" id="tt">0.00</span>s</div>
<div id="ph">enseñar</div>

<script>
/* ============================================================
   teologia.ai — 3. ENSEÑARLES TEMPRANO
   9:16 · 1080x1920 · Canvas 2D only.

   Read from the teologia.ai viewport: "Teach them early what we learned late.
   From Donna, Texas, to communities across Latin America: help people learn,
   build, and teach others." and the operating loop TEACH → BUILD → SHARE.
   LALM est. 1936 and LALI are named on that surface.

   Warm wash from the first line.
   ============================================================ */
const W = 1080, H = 1920, DURATION = 18;
const cv = document.getElementById('c');
const cx = cv.getContext('2d', { alpha: false });

const GOLD = '#D4AF37', GOLDHI = '#FFD700', CYAN = '#00eaff', NEON = '#00ff9d';
const TXT = '#F2EFE6';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t^=t>>>7;t=Math.imul(t,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const ease  = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
const seg   = (t,a,b) => clamp((t-a)/(b-a), 0, 1);
const pulse = (t,s) => 0.5 + 0.5*Math.sin(t*s);

/* the loop that travels outward: teach → build → share → teach */
const HANDS = (() => {
  const rnd = mulberry32(1936), out = [];
  for (let i = 0; i < 34; i++) out.push({
    x: 130 + rnd()*(W-260), y: 560 + rnd()*820,
    ph: rnd()*Math.PI*2, r: 3 + rnd()*3.4, k: rnd(),
  });
  return out;
})();

function bg(t){
  cx.fillStyle = '#050505'; cx.fillRect(0,0,W,H);
  const wash = cx.createRadialGradient(W*0.5, H*0.46, 0, W*0.5, H*0.46, H*0.62);
  wash.addColorStop(0.00, 'rgba(60,52,35,0.95)');
  wash.addColorStop(0.55, 'rgba(43,37,25,0.86)');
  wash.addColorStop(1.00, 'rgba(12,11,8,0.52)');
  cx.fillStyle = wash; cx.fillRect(0,0,W,H);

  cx.strokeStyle = 'rgba(212,175,55,0.10)'; cx.lineWidth = 1;
  const off = (t*12) % 72;
  for (let x = -72 + off; x < W; x += 72){ cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,H); cx.stroke(); }
  for (let y = -72 + off; y < H; y += 72){ cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke(); }

  for (const h of HANDS){
    const tw = 0.5 + 0.5*Math.sin(t*(1.5 + h.k) + h.ph);
    cx.globalAlpha = 0.14 + 0.38*tw;
    cx.fillStyle = h.k < 0.25 ? GOLDHI : CYAN;
    cx.beginPath(); cx.arc(h.x, h.y, h.r, 0, 7); cx.fill();
    cx.globalAlpha = 0.04 + 0.11*tw;
    cx.beginPath(); cx.arc(h.x, h.y, h.r*3.6, 0, 7); cx.fill();
  }
  cx.globalAlpha = 1;
}

function phaseAt(t){
  if (t < 3.4)  return ['enseñar', 'lo que aprendimos tarde'];
  if (t < 8.0)  return ['lugar',   'de Donna, Texas · hacia Latinoamérica'];
  if (t < 12.6) return ['loop',    'enseñar · construir · compartir'];
  return ['mision', 'la fe que obra por el amor'];
}
function titleAt(t){
  if (t < 3.4)  return 'ENSEÑARLES TEMPRANO';
  if (t < 8.0)  return 'DE DONNA, TEXAS';
  if (t < 12.6) return 'EL CICLO';
  return 'HACIA LATINOAMÉRICA';
}

/* ── act 1: teach them early ───────────────────────────── */
function drawEarly(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2, cyp = 930;
  cx.textAlign = 'center';
  cx.globalAlpha = ease(on) * ease(seg(t, 0.2, 0.9));
  const g = cx.createRadialGradient(cxp, cyp, 0, cxp, cyp, 340);
  g.addColorStop(0, 'rgba(255,215,0,' + (0.30*(0.7+0.3*pulse(t,2.4))) + ')');
  g.addColorStop(1, 'rgba(255,215,0,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(cxp, cyp, 340, 0, 7); cx.fill();

  cx.fillStyle = GOLDHI;
  cx.font = '900 62px "Orbitron", sans-serif';
  cx.fillText('ENSEÑARLES', cxp, cyp - 20);

  cx.globalAlpha = ease(on) * ease(seg(t, 0.9, 1.5));
  cx.fillStyle = NEON;
  cx.fillText('TEMPRANO', cxp, cyp + 56);

  cx.globalAlpha = ease(on) * ease(seg(t, 1.5, 2.1));
  cx.fillStyle = TXT;
  cx.font = '400 28px "JetBrains Mono", monospace';
  cx.fillText('lo que aprendimos tarde', cxp, cyp + 140);

  cx.globalAlpha = ease(on) * ease(seg(t, 2.1, 2.7));
  cx.fillStyle = CYAN;
  cx.font = '400 23px "JetBrains Mono", monospace';
  cx.fillText('ayudar a la gente a aprender, construir', cxp, cyp + 214);
  cx.globalAlpha = ease(on) * ease(seg(t, 2.5, 3.1));
  cx.fillText('y enseñar a otros', cxp, cyp + 252);
  cx.restore();
}

/* ── act 2: from Donna, Texas ──────────────────────────── */
function drawPlace(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2, cyp = 1000;
  cx.textAlign = 'center';
  cx.globalAlpha = ease(on);

  // the origin point, and lines reaching out
  const g = cx.createRadialGradient(cxp, cyp, 0, cxp, cyp, 300);
  g.addColorStop(0, 'rgba(255,215,0,' + (0.30*(0.7+0.3*pulse(t,2.2))) + ')');
  g.addColorStop(1, 'rgba(255,215,0,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(cxp, cyp, 300, 0, 7); cx.fill();

  cx.fillStyle = GOLDHI;
  cx.beginPath(); cx.arc(cxp, cyp, 22, 0, 7); cx.fill();
  cx.fillStyle = '#0a0a0a';
  cx.font = '900 22px "Orbitron", sans-serif';
  cx.fillText('☺', cxp, cyp + 8);

  // the reach
  const reach = ease(seg(t, 4.4, 7.2));
  for (let i = 0; i < 9; i++){
    const ang = (-0.95 + i*0.24) * Math.PI;
    const r = 240 + 190*reach;
    const x = cxp + Math.cos(ang)*r;
    const y = cyp + Math.sin(ang)*r*0.55;
    cx.globalAlpha = ease(on) * reach * (0.45 + 0.4*Math.sin(t*2 + i));
    cx.strokeStyle = CYAN; cx.lineWidth = 1.8;
    cx.beginPath(); cx.moveTo(cxp, cyp); cx.lineTo(x, y); cx.stroke();
    cx.fillStyle = NEON;
    cx.beginPath(); cx.arc(x, y, 7, 0, 7); cx.fill();
  }

  cx.globalAlpha = ease(on) * ease(seg(t, 3.6, 4.2));
  cx.fillStyle = GOLDHI;
  cx.font = '900 50px "Orbitron", sans-serif';
  cx.fillText('DE DONNA, TEXAS', cxp, 700);

  cx.globalAlpha = ease(on) * ease(seg(t, 4.6, 5.2));
  cx.fillStyle = CYAN;
  cx.font = '400 25px "JetBrains Mono", monospace';
  cx.fillText('hacia las comunidades de Latinoamérica', cxp, 760);

  cx.globalAlpha = ease(on) * ease(seg(t, 6.4, 7.0));
  cx.fillStyle = TXT;
  cx.font = '400 22px "JetBrains Mono", monospace';
  cx.fillText('LALM  ·  est. 1936', cxp, 1520);
  cx.globalAlpha = ease(on) * ease(seg(t, 6.8, 7.4));
  cx.fillStyle = GOLD;
  cx.fillText('LALI  ·  Latin American Lutheran Institute', cxp, 1564);
  cx.restore();
}

/* ── act 3: the loop ───────────────────────────────────── */
function drawLoop(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2;
  cx.textAlign = 'center';

  cx.globalAlpha = ease(on) * ease(seg(t, 8.1, 8.7));
  cx.fillStyle = GOLDHI;
  cx.font = '900 48px "Orbitron", sans-serif';
  cx.fillText('EL CICLO', cxp, 680);

  const steps = [
    ['ENSEÑAR',   'teach',   GOLDHI, 8.9],
    ['CONSTRUIR', 'build',   CYAN,   9.6],
    ['COMPARTIR', 'share',   NEON,   10.3],
  ];
  for (let i = 0; i < steps.length; i++){
    const [es, en, col, at] = steps[i];
    const a = ease(seg(t, at, at + 0.5));
    const y = 830 + i*180;
    cx.globalAlpha = ease(on) * a;
    const bw = 760, bh = 122;
    cx.strokeStyle = 'rgba(212,175,55,' + (0.38*a).toFixed(3) + ')';
    cx.lineWidth = 1.6;
    cx.strokeRect(cxp - bw/2, y - 42, bw, bh);
    cx.fillStyle = 'rgba(212,175,55,0.07)';
    cx.fillRect(cxp - bw/2, y - 42, bw, bh);
    cx.fillStyle = col;
    cx.font = '900 42px "Orbitron", sans-serif';
    cx.fillText(es, cxp, y + 6);
    cx.fillStyle = CYAN;
    cx.font = '400 20px "JetBrains Mono", monospace';
    cx.fillText(en, cxp, y + 44);

    if (i < steps.length - 1){
      cx.globalAlpha = ease(on) * a * ease(seg(t, at + 0.35, at + 0.7));
      cx.strokeStyle = GOLD; cx.lineWidth = 2.2;
      cx.beginPath(); cx.moveTo(cxp, y + 84); cx.lineTo(cxp, y + 128); cx.stroke();
      cx.beginPath(); cx.moveTo(cxp-12, y+114); cx.lineTo(cxp, y+130);
      cx.lineTo(cxp+12, y+114); cx.stroke();
    }
  }

  // and back around
  cx.globalAlpha = ease(on) * ease(seg(t, 11.0, 11.7));
  cx.strokeStyle = GOLD; cx.lineWidth = 2.2;
  cx.beginPath();
  cx.moveTo(cxp + 380, 1390);
  cx.bezierCurveTo(cxp + 470, 1390, cxp + 470, 900, cxp + 380, 900);
  cx.stroke();
  cx.fillStyle = GOLD;
  cx.beginPath(); cx.moveTo(cxp+394, 888); cx.lineTo(cxp+376, 900);
  cx.lineTo(cxp+394, 912); cx.fill();

  cx.globalAlpha = ease(on) * ease(seg(t, 11.4, 12.0));
  cx.fillStyle = TXT;
  cx.font = '400 22px "JetBrains Mono", monospace';
  cx.fillText('quien aprende, enseña', cxp, 1500);
  cx.globalAlpha = ease(on) * ease(seg(t, 11.8, 12.4));
  cx.fillStyle = GOLD;
  cx.font = '700 25px "JetBrains Mono", monospace';
  cx.fillText('edades 3 → 103', cxp, 1556);
  cx.restore();
}

/* ── act 4: the mission ────────────────────────────────── */
function drawMission(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2, cyp = 950;
  cx.textAlign = 'center';
  cx.globalAlpha = ease(on);
  const g = cx.createRadialGradient(cxp, cyp, 0, cxp, cyp, 400);
  g.addColorStop(0, 'rgba(255,215,0,0.22)');
  g.addColorStop(1, 'rgba(255,215,0,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(cxp, cyp, 400, 0, 7); cx.fill();

  cx.globalAlpha = ease(on) * ease(seg(t, 12.8, 13.4));
  cx.fillStyle = GOLDHI;
  cx.font = '900 50px "Orbitron", sans-serif';
  cx.fillText('FE · EDUCACIÓN', cxp, 840);
  cx.globalAlpha = ease(on) * ease(seg(t, 13.2, 13.8));
  cx.fillText('AGENCIA HUMANA', cxp, 906);

  cx.globalAlpha = ease(on) * ease(seg(t, 13.8, 14.4));
  cx.fillStyle = TXT;
  cx.font = '400 26px "JetBrains Mono", monospace';
  cx.fillText('la fe que obra por el amor', cxp, 990);

  cx.globalAlpha = ease(on) * ease(seg(t, 14.4, 15.0));
  cx.fillStyle = CYAN;
  cx.font = '400 23px "JetBrains Mono", monospace';
  cx.fillText('la inteligencia no se delega', cxp, 1060);
  cx.globalAlpha = ease(on) * ease(seg(t, 14.8, 15.4));
  cx.fillStyle = NEON;
  cx.fillText('se cultiva · se gobierna', cxp, 1104);

  cx.globalAlpha = ease(on) * ease(seg(t, 15.6, 16.2));
  cx.fillStyle = TXT;
  cx.font = '700 38px "JetBrains Mono", monospace';
  cx.fillText('teologia.ai', cxp, 1250);
  cx.globalAlpha = ease(on) * ease(seg(t, 16.0, 16.6));
  cx.fillStyle = GOLD;
  cx.font = '400 23px "JetBrains Mono", monospace';
  cx.fillText('solo scriptura · solo fide · solo gratia', cxp, 1302);
  cx.globalAlpha = ease(on) * ease(seg(t, 16.4, 17.0));
  cx.fillText('#aprendelatam  ·  #emprendelatam', cxp, 1356);
  cx.restore();
}

const ttlEl = document.getElementById('ttl');
const stlEl = document.getElementById('stl');
const phEl  = document.getElementById('ph');
const pfEl  = document.getElementById('pfill');
function hud(t){
  const [ph, sub] = phaseAt(t);
  const ti = titleAt(t);
  if (ttlEl.textContent !== ti) ttlEl.textContent = ti;
  if (stlEl.textContent !== sub) stlEl.textContent = sub;
  if (phEl.textContent !== ph) phEl.textContent = ph;
  pfEl.style.width = ((t/DURATION)*100).toFixed(2) + '%';
}

function renderAt(t){
  t = clamp(t, 0, DURATION);
  bg(t);
  hud(t);
  drawEarly(t,   ease(seg(t,0,0.5))      * (1 - ease(seg(t,3.2,3.6))));
  drawPlace(t,   ease(seg(t,3.4,3.9))    * (1 - ease(seg(t,7.8,8.2))));
  drawLoop(t,    ease(seg(t,8.0,8.5))    * (1 - ease(seg(t,12.4,12.8))));
  drawMission(t, ease(seg(t,12.7,13.3)));
}

let driven = false;
window.__renderFrame = function (i, total){
  driven = true;
  const n = Math.max(1, (total || 1) - 1);
  const t = (i / n) * DURATION;
  renderAt(t);
  document.getElementById('fc').textContent = i;
  document.getElementById('tc').textContent = total;
  document.getElementById('tt').textContent = t.toFixed(2);
  return true;
};
function loop(){
  if (!driven) renderAt((performance.now()/1000) % DURATION);
  requestAnimationFrame(loop);
}
loop();
window.__renderFrame(0, 1);
</script>
</body>
</html>
