:root{--void:#050505;--gold:#D4AF37;--cyan:#00eaff}

html,body{width:1920px;height:1080px;overflow:hidden;background:var(--void);font-family:'JetBrains Mono',ui-monospace,monospace}
#c{position:fixed;top:0;left:0;width:1920px;height:1080px;display:block;z-index:1}
#scanlines{position:fixed;top:0;left:0;width:1920px;height:1080px;z-index:40;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.28) 0px,rgba(0,0,0,0.28) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply}
#vignette{position:fixed;top:0;left:0;width:1920px;height:1080px;z-index:41;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 58%,rgba(0,0,0,0.55) 100%)}

#hud ul{list-style:none;font-size:15px;line-height:2.05}

#hud .v{color:#ffe9a8;text-shadow:0 0 12px rgba(212,175,55,0.7)}
#hud .c{color:var(--cyan);text-shadow:0 0 12px rgba(0,234,255,0.7)}
#pbar{margin-top:16px;width:520px;height:16px;border:1px solid var(--gold);border-radius:8px;overflow:hidden;background:rgba(212,175,55,0.06)}
#pfill{height:100%;width:0%;background:linear-gradient(90deg,#D4AF37,#00eaff)}

#badge:hover{transform:scale(1.1);box-shadow:0 0 22px rgba(212,175,55,0.45)}

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const W = 1920, H = 1080, DURATION = 12.0;
const GOLD = 0xD4AF37, CYAN = 0x00eaff;

/* ---- renderer / scene / camera ---- */
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);

const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 6000);
camera.position.set(0, 40, 180);
camera.lookAt(0, 0, 0);
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;

/* ---- backdrop glow : camera child, always fills the frame (luminance floor) ---- */
const backdropMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uGold: { value: new THREE.Color(GOLD) }, uCyan: { value: new THREE.Color(CYAN) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `
    uniform float uTime; uniform vec3 uGold; uniform vec3 uCyan; varying vec2 vUv;
    void main(){
      vec2 p = vUv - 0.5;
      float d = length(p * vec2(1.0, 0.82));
      float core = smoothstep(0.84, 0.0, d);
      float ring = smoothstep(0.05, 0.0, abs(d - 0.46));
      vec3 col = uGold * core * 0.58;
      col += uCyan * ring * 0.36;
      col += uGold * 0.055;
      col *= 0.88 + 0.12 * sin(uTime * 1.3);
      gl_FragColor = vec4(col, 1.0);
    }`
});
const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(1500, 900), backdropMat);
backdrop.position.set(0, 0, -1200);
backdrop.renderOrder = -1;
camera.add(backdrop);

/* ---- starfield ---- */
(function () {
  const n = 1200, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 1500, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
    pos[i * 3 + 2] = r * Math.cos(ph);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x8a7433, size: 2.0, sizeAttenuation: false })));
})();

/* ---- particle system : 20 000 particles delivered in 40 worker chunks ---- */
const TOTAL = 20000;
const CHUNKS = 40;
const PER = TOTAL / CHUNKS; // 500
const WAVE = [GOLD, CYAN, 0x8b5cf6, 0xff5a5a, 0x4dff9e, 0xffb347, 0xff66cc, 0x66ddff];

/* per-particle static params (deterministic; positions are a pure function of t) */
const pRad = new Float32Array(TOTAL);
const pAng = new Float32Array(TOTAL);
const pY = new Float32Array(TOTAL);
const pSpd = new Float32Array(TOTAL);
const pPh = new Float32Array(TOTAL);

for (let i = 0; i < TOTAL; i++) {
  const chunk = Math.floor(i / PER);
  const arm = chunk % 3;
  const frac = (i % PER) / PER;
  pRad[i] = 14 + (chunk / CHUNKS) * 78 + frac * 8 + Math.random() * 3;
  pAng[i] = frac * 1.1 + arm * (Math.PI * 2 / 3) + chunk * 0.05;
  pY[i] = (Math.random() - 0.5) * 14 + Math.sin(pAng[i] * 2) * 3;
  pSpd[i] = 0.18 + Math.random() * 0.30;
  pPh[i] = Math.random() * Math.PI * 2;
}

const posArr = new Float32Array(TOTAL * 3);
const colArr = new Float32Array(TOTAL * 3);
const cTmp = new THREE.Color();

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
geo.setDrawRange(0, 0);

function dotTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0.0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.4, 'rgba(255,255,255,0.65)');
  grd.addColorStop(1.0, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const pMat = new THREE.PointsMaterial({
  size: 0.85, map: dotTexture(), vertexColors: true, transparent: true,
  opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
});
scene.add(new THREE.Points(geo, pMat));

/* ---- HUD handles ---- */
const elChunks = document.getElementById('chunks');
const elChunksTot = document.getElementById('chunkstot');
const elPcount = document.getElementById('pcount');
const elStatus = document.getElementById('status');
const elPfill = document.getElementById('pfill');
const elFc = document.getElementById('fc');
const elTc = document.getElementById('tc');
const elTt = document.getElementById('tt');
elChunksTot.textContent = CHUNKS;

/* ---- deterministic frame renderer ---- */
function renderAt(t) {
  backdropMat.uniforms.uTime.value = t;

  /* simulated async loading: chunks arrive over the first 55% of the timeline */
  const loadT = Math.min(t / (DURATION * 0.55), 1);
  const chunksN = Math.max(1, Math.round(loadT * CHUNKS));
  const visible = Math.min(TOTAL, chunksN * PER);

  /* fill colours for the chunks that have landed */
  for (let k = 0; k < chunksN; k++) {
    cTmp.setHex(WAVE[k % WAVE.length]);
    const a = k * PER, b = Math.min(TOTAL, (k + 1) * PER);
    for (let p = a; p < b; p++) {
      colArr[p * 3] = cTmp.r; colArr[p * 3 + 1] = cTmp.g; colArr[p * 3 + 2] = cTmp.b;
    }
  }
  geo.attributes.color.needsUpdate = true;

  /* analytic, deterministic particle positions */
  for (let i = 0; i < visible; i++) {
    const a = pAng[i] + t * pSpd[i];
    const r = pRad[i] + Math.sin(t * 0.9 + pPh[i]) * 3.0;
    posArr[i * 3] = Math.cos(a) * r;
    posArr[i * 3 + 1] = pY[i] + Math.sin(t * 1.2 + pPh[i]) * 4.0;
    posArr[i * 3 + 2] = Math.sin(a) * r;
  }
  geo.attributes.position.needsUpdate = true;
  geo.setDrawRange(0, visible);

  /* deterministic camera orbit */
  const ang = t * Math.PI * 1.1 + 0.6;
  const rad = 175 + Math.sin(t * 1.0) * 40;
  const camY = 55 + Math.sin(t * 0.8) * 35;
  camera.position.set(Math.cos(ang) * rad, camY, Math.sin(ang) * rad);
  camera.lookAt(0, 0, 0);

  /* HUD */
  elChunks.textContent = chunksN;
  elPcount.textContent = visible;
  elStatus.textContent = chunksN < CHUNKS ? 'LOADING' : 'COMPLETE';
  elStatus.style.color = chunksN < CHUNKS ? '#00eaff' : '#D4AF37';
  elPfill.style.width = (loadT * 100).toFixed(1) + '%';

  renderer.render(scene, camera);
}

/* ---- external frame hook (drives æRTXrender / vidæo producer) ---- */
let driven = false;
window.__renderFrame = function (i, total) {
  driven = true;
  const n = Math.max(1, (total || 1) - 1);
  const t = (i / n) * DURATION;
  renderAt(t);
  elFc.textContent = i;
  elTc.textContent = total;
  elTt.textContent = t.toFixed(2);
  return true;
};

/* ---- live loop for standalone viewing ---- */
function loop() {
  requestAnimationFrame(loop);
  if (driven) return;
  renderAt((performance.now() / 1000) % DURATION);
}
loop();

window.__renderFrame(0, 1);
</script>
