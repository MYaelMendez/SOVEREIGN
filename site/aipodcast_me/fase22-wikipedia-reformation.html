<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>æ:// fase22-wikipedia — 1517 Reformation / Vernacular Bibles</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--void:#050505;--gold:#D4AF37;--cyan:#00eaff;--green:#4dff9e}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--void);font-family:'JetBrains Mono',ui-monospace,monospace}
#c{position:fixed;top:0;left:0;width:1920px;height:1080px;display:block;z-index:1}
#scanlines{position:fixed;top:0;left:0;width:1920px;height:1080px;z-index:40;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.28) 0px,rgba(0,0,0,0.28) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply}
#vignette{position:fixed;top:0;left:0;width:1920px;height:1080px;z-index:41;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,0.62) 100%)}
#hud{position:fixed;top:44px;left:52px;z-index:50;color:var(--gold);pointer-events:none}
#hud h1{font-size:31px;font-weight:700;letter-spacing:3px;text-shadow:0 0 20px rgba(212,175,55,0.65)}
#hud .sub{margin-top:10px;font-size:15px;letter-spacing:5px;color:var(--cyan);text-transform:uppercase;opacity:0.9}
#hud .rule{width:420px;height:1px;margin:22px 0;background:linear-gradient(90deg,var(--gold),transparent)}
#hud .loop{font-size:16px;letter-spacing:2px}
#hud .st{opacity:0.45;transition:opacity .2s,color .2s,text-shadow .2s}
#hud .st.on{opacity:1;color:#eafcff;text-shadow:0 0 16px rgba(0,234,255,0.9)}
#hud .ar{color:var(--gold);opacity:0.6;margin:0 8px}
#hud ul{list-style:none;margin-top:22px;font-size:14px;line-height:1.95}
#hud li{opacity:0.72}
#hud li::before{content:'\25B8 ';color:var(--cyan)}
#readout{position:fixed;bottom:44px;left:52px;z-index:50;color:var(--cyan);font-size:15px;letter-spacing:3px}
#readout .g{color:var(--gold)}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="hud">
  <h1>æ:// fase22-wikipedia</h1>
  <div class="sub">Semana 22 · Wikipédia · História · Literatura · 1517 Soberano</div>
  <div class="rule"></div>
  <div class="loop">
    <span class="st" data-st="0">theology</span><span class="ar">&rarr;</span>
    <span class="st" data-st="1">press</span><span class="ar">&rarr;</span>
    <span class="st" data-st="2">vernacular</span><span class="ar">&rarr;</span>
    <span class="st" data-st="3">sovereign</span>
  </div>
  <ul>
    <li>1517 · 95 theses</li>
    <li>Gutenberg c. 1450s</li>
    <li>Biblia del Oso 1569</li>
    <li>Vulgata → vernácula</li>
  </ul>
</div>
<div id="readout"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
var W=1920,H=1080,DURATION=15.0;
var GOLD=0xD4AF37,CYAN=0x00eaff,GREEN=0x4dff9e;
var scene,camera,renderer,backdropMat;
var nodes=[],signals=[];

function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x050505);
  camera=new THREE.PerspectiveCamera(50,W/H,0.1,6000);
  camera.position.set(0,100,420);
  camera.lookAt(0,0,0);
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
  renderer.setPixelRatio(1);
  renderer.setSize(W,H);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=3.0;

  backdropMat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0}},
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:'varying vec2 vUv;uniform float uTime;void main(){vec2 p=vUv-0.5;float d=length(p*vec2(1.0,0.82));float core=smoothstep(0.82,0.0,d);float ring=smoothstep(0.05,0.0,abs(d-0.44));vec3 col=vec3(0.84,0.69,0.22)*core*1.8+vec3(0.0,0.92,1.0)*ring*1.2+vec3(0.84,0.69,0.22)*0.35;col*=1.2+0.3*sin(uTime*1.3);gl_FragColor=vec4(col,1.0);}'
  });
  var backdrop=new THREE.Mesh(new THREE.PlaneGeometry(2000,1200),backdropMat);
  backdrop.position.set(0,0,-800);
  backdrop.renderOrder=-1;
  scene.add(backdrop);

  scene.add(new THREE.AmbientLight(0xffffff,1.4));
  var key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(120,260,180);scene.add(key);
  var rim=new THREE.PointLight(CYAN,2.6,3000);rim.position.set(-180,120,-120);scene.add(rim);

  // central node — 1517 (Luther)
  var nodeGeo=new THREE.SphereGeometry(34,20,20);
  var nodeMat=new THREE.MeshStandardMaterial({color:GOLD,emissive:GOLD,emissiveIntensity:0.7,roughness:0.2,metalness:0.7});
  var node=new THREE.Mesh(nodeGeo,nodeMat);
  node.position.set(0,0,0);
  scene.add(node);
  nodes.push({mesh:node,mat:nodeMat,color:GOLD});

  // surrounding nodes — 1517 network, all in z<0 half-space
  var phi=Math.PI*(3-Math.sqrt(5));
  var items=[['Gutenberg',1450],['Luther',1517],['Tyndale',1526],['Coverdale',1535],['Casiodoro',1569],['Vulgata',400]];
  for(var i=0;i<items.length;i++){
    var a=i/items.length*Math.PI*2;
    if(i>0)a=i/items.length*Math.PI*2+(i===1?0.2:0)+phi*(i-1);
    var r=maxR;
    var x=Math.cos(a)*r, z=-Math.abs(Math.sin(a))*r;
    var label=items[i][0];
    var y= (i%2===0?40:-40);
    var color=[CYAN,GOLD,GREEN][i%3];
    var meshGeo=new THREE.SphereGeometry(12,14,14);
    var meshMat=new THREE.MeshStandardMaterial({color:color,emissive:color,emissiveIntensity:0.4,roughness:0.3,metalness:0.6});
    var mesh=new THREE.Mesh(meshGeo,meshMat);
    mesh.position.set(x,y,z);
    scene.add(mesh);
    nodes.push({mesh:mesh,mat:meshMat,color:color,label:label,y:y,i:i});
  }

  // connection lines
  for(var i=0;i<items.length;i++){
    for(var j=i+1;j<items.length;j++){
      var a1=i/items.length*Math.PI*2, a2=j/items.length*Math.PI*2;
      if(i>0)a1-=0.15;
      if(j>0)a2-=0.15;
      var midAngle=(a1+a2)/2;
      var midR=440;
      var geo=new THREE.BufferGeometry();
      var positions=new Float32Array(9);
      positions[0]=Math.cos(a1)*440;
      positions[1]=40;
      positions[2]=Math.sin(a1)*440;
      positions[3]=Math.cos(midAngle)*midR;
      positions[4]=0;
      positions[5]=Math.sin(midAngle)*midR;
      positions[6]=Math.cos(a2)*440;
      positions[7]=-40;
      positions[8]=Math.sin(a2)*440;
      geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
      var col=[GOLD,CYAN,GREEN][i%3];
      var mat=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.28});
      var line=new THREE.Line(geo,mat);
      scene.add(line);
    }
  }
}

function renderAt(t){
  backdropMat.uniforms.uTime.value=t;

  var phase=Math.floor(t/DURATION*4)%4;
  var stepEls=document.querySelectorAll('#hud .st');
  for(var k=0;k<stepEls.length;k++)stepEls[k].classList.toggle('on',k===phase);

  for(var i=0;i<nodes.length;i++){
    var n=nodes[i];
    if(n.isAgent){
      n.mesh.position.y=18+Math.sin(t*1.5+n.phase)*4;
      n.mesh.rotation.y=t*0.5+n.phase;
      n.mat.emissiveIntensity=0.7+0.3*Math.sin(t*2+n.phase);
    } else if(n.label){
      n.mesh.position.y=50+Math.sin(t*0.8+i*0.3)*8;
      n.mat.emissiveIntensity=0.3+0.2*Math.sin(t*2+i*0.7);
    }
  }

  var ang=0.3+Math.sin(t*0.4)*0.6;
  camera.position.set(Math.cos(ang)*420,100+Math.sin(t*0.6)*20,Math.sin(ang)*420);
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}

window.__renderFrame=function(i,total){
  if(!renderer)return;
  var n=Math.max(1,(total||1)-1);
  var t=(i/n)*DURATION;
  renderAt(t);
  document.getElementById('readout').textContent='frame '+i+' / '+total+' &middot; t '+t.toFixed(2)+'s';
  return true;
};

init();
window.__renderFrame(0,1);
</script>
