<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>LONGCAT 2.5 — DOOLA PARTNER API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--void:#050505;--gold:#D4AF37;--goldhi:#FFD700;--cyan:#00eaff;--neon:#00ff9d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--void);
  font-family:'JetBrains Mono',ui-monospace,monospace}
#c{position:fixed;top:0;left:0;width:1080px;height:1920px;display:block;z-index:1}
#scanlines{position:fixed;top:0;left:0;width:1080px;height:1920px;z-index:40;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.20) 0px,rgba(0,0,0,0.20) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply}
#vignette{position:fixed;top:0;left:0;width:1080px;height:1920px;z-index:41;pointer-events:none;
  background:radial-gradient(ellipse at 50% 48%,transparent 66%,rgba(0,0,0,0.46) 100%)}
#hud{position:fixed;top:84px;left:72px;right:72px;z-index:50;pointer-events:none}
#hud .prompt{font-size:19px;letter-spacing:7px;color:var(--goldhi);opacity:.95}
#hud h1{font-family:'Orbitron',sans-serif;font-size:42px;font-weight:900;letter-spacing:1px;
  margin-top:18px;color:var(--goldhi);text-shadow:0 0 30px rgba(255,215,0,0.5);line-height:1.1}
#hud .rule{width:100%;height:1px;margin:24px 0;
  background:linear-gradient(90deg,var(--gold),rgba(212,175,55,0.05))}
#hud .sub{font-size:20px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;opacity:.94}
#pbar{position:fixed;bottom:168px;left:72px;right:72px;z-index:50;height:12px;
  border:1px solid rgba(212,175,55,.55);border-radius:6px;overflow:hidden;
  background:rgba(212,175,55,0.07)}
#pfill{height:100%;width:0%;background:linear-gradient(90deg,#D4AF37,#00ff9d)}
#tags{position:fixed;bottom:106px;left:72px;right:72px;z-index:50;
  font-size:19px;letter-spacing:2px;color:var(--gold);opacity:.92}
#readout{position:fixed;bottom:56px;left:72px;z-index:50;color:var(--cyan);
  font-size:16px;letter-spacing:3px}
#readout .g{color:var(--goldhi)}
#ph{position:fixed;bottom:56px;right:72px;z-index:50;color:var(--gold);
  font-size:16px;letter-spacing:5px;text-transform:uppercase;opacity:.9}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>

<div id="hud">
  <div class="prompt">&gt;_nous://</div>
  <h1 id="ttl">DOOLA PARTNER API</h1>
  <div class="rule"></div>
  <div class="sub" id="stl">formation as a service · 40+ endpoints</div>
</div>
<div id="pbar"><div id="pfill"></div></div>
<div id="tags">doola partner API · formation as a service</div>
<div id="readout">frame <span class="g" id="fc">0</span> / <span id="tc">0</span> &middot; t <span class="g" id="tt">0.00</span>s</div>
<div id="ph">api</div>

<script>
/* ============================================================
   LONGCAT 2.5 — DOOLA PARTNER API
   GENERATED by series_engine.py from lc.json — do not hand-edit.
   Episode id: 4-api
   1080x1920 · Canvas 2D only (the producer rejects importmap/module).

   The warm wash below is not decoration: gold on void #050505 is luminance 5
   and the gate refuses a frame with no mass.
   ============================================================ */
const W = 1080, H = 1920, DURATION = 18;
const cv = document.getElementById('c');
const cx = cv.getContext('2d', { alpha: false });

const GOLD = '#D4AF37', GOLDHI = '#FFD700', CYAN = '#00eaff', NEON = '#00ff9d';
const TXT = '#F2EFE6', RED = '#ff6b6b';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t^=t>>>7;t=Math.imul(t,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const ease  = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
const seg   = (t,a,b) => clamp((t-a)/(b-a), 0, 1);
const pulse = (t,s) => 0.5 + 0.5*Math.sin(t*s);

const ACTS = [{"kind": "intro", "big": "PARTNER API", "lines": [["DOOLA", "#FFD700", "900", 52, 92], ["formation as a service", "#00ff9d", "700", 36, 68], ["40+ endpoints · 3 paths", "#00eaff", "400", 24, 0]]}, {"kind": "list", "items": [["auth", "API key · no Bearer prefix"], ["idempotency", "required on all creates"], ["webhooks", "async progress · no polling"], ["sandbox", "test.doola.com · dk_test_ key"], ["errors", "machine-readable codes"], ["signing", "SS-4 · Form 8821 · expedited EIN"]], "footer": "build against sandbox first"}, {"kind": "blocks", "items": [["REST API", "#FFD700", "customers · companies · compliance"], ["EMBEDDED SDK", "#00e8ff", "@doola/js · your branding"], ["MCP SERVER", "#00ff9d", "7 tools · 16 actions"], ["OPENAPI", "#D4AF37", "machine-readable spec"]], "closer": "one platform, three integration paths", "closer_color": "#F2EFE6"}, {"kind": "outro", "lines": [["DOOLA PARTNER API", "#FFD700", "900", 40, 70], ["we intend to partner with them", "#00ff9d", "700", 30, 60], ["LONGCAT 2.5 PREVIEW FREE", "#F2EFE6", "400", 26, 0]]}];
const PHASES = ["api", "flow", "paths"];
const TITLES = ["PARTNER API", "THE FLOW", "THREE PATHS"];

function bg(t){
  cx.fillStyle = '#050505'; cx.fillRect(0,0,W,H);
  const wash = cx.createRadialGradient(W*0.5, H*0.46, 0, W*0.5, H*0.46, H*0.62);
  wash.addColorStop(0.00, 'rgba(60,52,35,0.95)');
  wash.addColorStop(0.55, 'rgba(43,37,25,0.86)');
  wash.addColorStop(1.00, 'rgba(12,11,8,0.52)');
  cx.fillStyle = wash; cx.fillRect(0,0,W,H);

  cx.strokeStyle = 'rgba(212,175,55,0.10)'; cx.lineWidth = 1;
  const off = (t*12) % 72;
  for (let x = -72 + off; x < W; x += 72){ cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,H); cx.stroke(); }
  for (let y = -72 + off; y < H; y += 72){ cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke(); }
}

/* the act renderers — one per kind the spec may use */
function drawIntro(t, on, a){
  if (on <= 0) return;
  const cxp = W/2, cyp = 931;
  cx.save(); cx.textAlign = 'center';
  cx.globalAlpha = ease(on) * ease(seg(t, 0.2, 0.9));
  const g = cx.createRadialGradient(cxp, cyp, 0, cxp, cyp, 340);
  g.addColorStop(0, 'rgba(255,215,0,' + (0.30*(0.7+0.3*pulse(t,2.4))) + ')');
  g.addColorStop(1, 'rgba(255,215,0,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(cxp, cyp, 340, 0, 7); cx.fill();
  cx.fillStyle = GOLDHI;
  cx.font = '900 76px "Orbitron", sans-serif';
  cx.fillText(a.big, cxp, cyp + 10);
  let y = cyp + 106;
  for (let i = 0; i < (a.lines||[]).length; i++){
    cx.globalAlpha = ease(on) * ease(seg(t, 0.9 + i*0.45, 1.5 + i*0.45));
    const L = a.lines[i];
    cx.fillStyle = L[1] || TXT;
    cx.font = (L[2]||'400') + ' ' + (L[3]||26) + 'px "JetBrains Mono", monospace';
    cx.fillText(L[0], cxp, y); y += (L[4]||56);
  }
  cx.restore();
}

function drawList(t, on, a){
  if (on <= 0) return;
  const per = (4.05) / Math.max(1,(a.items||[]).length);
  const first = Math.max(0, Math.floor((t - 4.7) / per) - 1);
  const items = a.items || [];
  cx.save();
  for (let i = first; i < Math.min(items.length, first + 9); i++){
    const it = items[i];
    const at = 4.7 + i * per;
    const ap = ease(seg(t, at, at + per*0.5));
    const y = 420 + (i - first) * 128;
    cx.globalAlpha = ease(on) * ap;
    cx.textAlign = 'right';
    cx.fillStyle = it[2] || GOLD;
    cx.font = '900 34px "Orbitron", sans-serif';
    cx.fillText(it[0], 250, y + 10);
    cx.strokeStyle = 'rgba(212,175,55,0.30)'; cx.lineWidth = 1.4;
    cx.beginPath(); cx.moveTo(250+26, y + 2); cx.lineTo(250+60, y + 2); cx.stroke();
    cx.textAlign = 'left';
    cx.fillStyle = TXT;
    cx.font = '700 29px "JetBrains Mono", monospace';
    cx.fillText(it[1], 250+86, y + 10);
  }
  if (a.footer){
    cx.textAlign = 'center';
    cx.globalAlpha = ease(on) * ease(seg(t, 13.1, 13.1+0.6));
    cx.fillStyle = GOLDHI;
    cx.font = '700 27px "JetBrains Mono", monospace';
    cx.fillText(a.footer, W/2, 1680);
  }
  cx.restore();
}

function drawBlocks(t, on, a){
  if (on <= 0) return;
  const items = a.items || [];
  cx.save(); cx.textAlign = 'center';
  const cxp = W/2;
  if (a.head){
    cx.globalAlpha = ease(on) * ease(seg(t, 9.3-0.2, 9.3+0.4));
    cx.fillStyle = GOLDHI;
    cx.font = '900 52px "Orbitron", sans-serif';
    cx.fillText(a.head, cxp, 820-120);
  }
  for (let i = 0; i < items.length; i++){
    const it = items[i];
    const at = 9.3 + i*0.55;
    const ap = ease(seg(t, at, at + 0.45));
    const y = 820 + i*160;
    cx.globalAlpha = ease(on) * ap;
    const bw = 720, bh = 112;
    cx.strokeStyle = 'rgba(212,175,55,' + (0.40*ap).toFixed(3) + ')';
    cx.lineWidth = 1.6;
    cx.strokeRect(cxp - bw/2, y - 36, bw, bh);
    cx.fillStyle = 'rgba(212,175,55,0.08)';
    cx.fillRect(cxp - bw/2, y - 36, bw, bh);
    cx.fillStyle = it[1] || (i===0?GOLDHI:(i===1?CYAN:NEON));
    cx.font = '900 44px "Orbitron", sans-serif';
    cx.fillText(it[0], cxp, y + 30);
    if (it[2]){
      cx.fillStyle = CYAN;
      cx.font = '400 21px "JetBrains Mono", monospace';
      cx.fillText(it[2], cxp, y + 68);
    }
  }
  if (a.closer){
    cx.globalAlpha = ease(on) * ease(seg(t, 10.7, 10.7+0.6));
    cx.fillStyle = a.closer_color || TXT;
    cx.font = '700 24px "JetBrains Mono", monospace';
    cx.fillText(a.closer, cxp, 1400);
  }
  cx.restore();
}

function drawOutro(t, on, a){
  if (on <= 0) return;
  const cxp = W/2, cyp = 940;
  cx.save(); cx.textAlign = 'center';
  cx.globalAlpha = ease(on);
  const g = cx.createRadialGradient(cxp, cyp, 0, cxp, cyp, 400);
  g.addColorStop(0, 'rgba(255,215,0,0.22)');
  g.addColorStop(1, 'rgba(255,215,0,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(cxp, cyp, 400, 0, 7); cx.fill();
  let y = cyp - 150;
  for (let i = 0; i < (a.lines||[]).length; i++){
    const L = a.lines[i];
    cx.globalAlpha = ease(on) * ease(seg(t, 14.1 + i*0.4, 14.1+0.4 + i*0.4));
    cx.fillStyle = L[1] || TXT;
    cx.font = (L[2]||'700') + ' ' + (L[3]||30) + 'px ' + (L[5]||'"JetBrains Mono", monospace');
    cx.fillText(L[0], cxp, y); y += (L[4]||60);
  }
  cx.restore();
}

const RENDERERS = { intro: drawIntro, list: drawList, blocks: drawBlocks, outro: drawOutro };

function phaseAt(t){
  const n = ACTS.length;
  const i = clamp(Math.floor(t / (DURATION/n)), 0, n-1);
  return PHASES[i] || PHASES[0];
}
function titleAt(t){
  const n = ACTS.length;
  const i = clamp(Math.floor(t / (DURATION/n)), 0, n-1);
  return TITLES[i] || TITLES[0];
}

const ttlEl = document.getElementById('ttl');
const stlEl = document.getElementById('stl');
const phEl  = document.getElementById('ph');
const pfEl  = document.getElementById('pfill');
function hud(t){
  const [ph, sub] = phaseAt(t);
  const ti = titleAt(t);
  if (ttlEl.textContent !== ti) ttlEl.textContent = ti;
  if (stlEl.textContent !== sub) stlEl.textContent = sub;
  if (phEl.textContent !== ph) phEl.textContent = ph;
  pfEl.style.width = ((t/DURATION)*100).toFixed(2) + '%';
}

function renderAt(t){
  t = clamp(t, 0, DURATION);
  bg(t);
  hud(t);
  const n = ACTS.length, span = DURATION/n;
  for (let i = 0; i < n; i++){
    const a0 = i*span, a1 = a0 + span;
    const on = ease(seg(t, a0, a0 + span*0.15)) * (1 - ease(seg(t, a1 - span*0.15, a1)));
    const fn = RENDERERS[ACTS[i].kind];
    if (fn) fn(t, on, ACTS[i]);
  }
}

let driven = false;
window.__renderFrame = function (i, total){
  driven = true;
  const n = Math.max(1, (total || 1) - 1);
  const t = (i / n) * DURATION;
  renderAt(t);
  document.getElementById('fc').textContent = i;
  document.getElementById('tc').textContent = total;
  document.getElementById('tt').textContent = t.toFixed(2);
  return true;
};
function loop(){
  if (!driven) renderAt((performance.now()/1000) % DURATION);
  requestAnimationFrame(loop);
}
loop();
window.__renderFrame(0, 1);
</script>
</body>
</html>
