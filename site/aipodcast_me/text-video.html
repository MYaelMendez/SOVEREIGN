<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080">
<title>text video</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#0c1826; }
  #root { position:relative; width:100%; height:100%; }
  #stage { position:absolute; inset:0; }
  #stage canvas { width:100%; height:100%; display:block; }
  .scanlines { position:absolute; inset:0; pointer-events:none; z-index:50;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px); }
</style>
</head>
<body>
<!-- text-video.html — spec-driven text in video.
     Text arrives via ?text=Line1|Line2|Line3&title=... (the producer injects it).
     Deterministic: __renderFrame(progress) drives every frame; no CDN, no GSAP,
     no wall-clock. Drifting particles + reveal + scanline sweep keep the frame
     moving so the SupervisorVideo motion gate passes. -->
<div id="root" data-width="1920" data-height="1080" data-composition-id="text-video">
  <div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div class="scanlines"></div>
</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var TITLE = params.get('title') || '\u00e6://';
  var TEXT  = params.get('text') || 'text in video';
  var LINES = TEXT.split('|').map(function(s){return s.trim();}).filter(function(s){return s.length;});
  if (!LINES.length) LINES = ['text in video'];

  var canv = document.getElementById('c');
  var ctx  = canv.getContext('2d');
  var W = 1920, H = 1080;
  var GOLD = '#D4AF37';

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  var r = mulberry32(20261005);

  var N = 220, parts = [];
  for (var i=0;i<N;i++){
    parts.push({ x:r()*W, y:r()*H, vx:(r()-0.5)*0.9, vy:(r()-0.5)*0.9, s:0.6+r()*1.8, a:0.25+r()*0.5 });
  }

  function hexA(hex,a){var h=hex.replace('#','');return 'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+','+a+')';}

  function render(p){
    p = Math.max(0, Math.min(1, p));

    /* background gradient — bright enough for the luminance gate (>20) */
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0e1c2c'); g.addColorStop(0.5,'#0c1826'); g.addColorStop(1,'#060d16');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    /* center gold aura */
    var aura = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,760);
    aura.addColorStop(0,'rgba(212,175,55,0.10)');
    aura.addColorStop(1,'rgba(212,175,55,0)');
    ctx.fillStyle = aura; ctx.fillRect(0,0,W,H);

    /* drifting particles — motion */
    for (var i=0;i<N;i++){
      var q = parts[i];
      q.x += q.vx; q.y += q.vy;
      if (q.x<0) q.x+=W; if (q.x>W) q.x-=W;
      if (q.y<0) q.y+=H; if (q.y>H) q.y-=H;
      var tw = 0.6 + 0.4*Math.sin((p*Math.PI*2) + i);
      ctx.fillStyle = hexA(GOLD, q.a*tw);
      ctx.beginPath(); ctx.arc(q.x,q.y,q.s,0,Math.PI*2); ctx.fill();
    }

    ctx.textAlign='center'; ctx.textBaseline='middle';

    /* title */
    ctx.font = "600 30px 'JetBrains Mono','Consolas',monospace";
    ctx.fillStyle = hexA(GOLD, 0.5);
    ctx.fillText(TITLE, W/2, 250);

    /* progressive reveal window */
    var rev0 = 0.06, rev1 = 0.86;
    var L = LINES.length, per = (rev1-rev0)/L;
    var baseY = H/2 - ((L-1)/2)*120;
    var totalChars = LINES.reduce(function(a,s){return a+s.length;},0);
    var done = 0;

    ctx.font = "700 76px 'JetBrains Mono','Consolas',monospace";
    for (var li=0; li<L; li++){
      var line = LINES[li];
      var lp = (p - (rev0 + li*per))/per; lp = Math.max(0, Math.min(1, lp));
      var nChars = Math.round(line.length * lp);
      var shown = line.slice(0, nChars);
      var y = baseY + li*120;

      ctx.shadowColor = 'rgba(212,175,55,0.85)';
      ctx.shadowBlur = 28 + 10*Math.sin(p*Math.PI*2 + li);
      ctx.fillStyle = hexA('#ffd98a', 0.95);
      ctx.fillText(shown, W/2, y);
      ctx.shadowBlur = 0;

      if (lp>0 && lp<1){
        var w = ctx.measureText(shown).width;
        var blink = 0.5 + 0.5*Math.sin(p*Math.PI*20);
        ctx.fillStyle = hexA(GOLD, blink);
        ctx.fillRect(W/2 + w/2 + 8, y-34, 6, 68);
      }
      done += nChars;
    }

    /* bottom progress bar */
    ctx.fillStyle = hexA('#00eaff', 0.5);
    ctx.fillRect(0, H-6, W*p, 4);

    /* telemetry */
    ctx.font = "400 20px 'JetBrains Mono','Consolas',monospace";
    ctx.fillStyle = hexA(GOLD, 0.45);
    ctx.textAlign='left';
    ctx.fillText('chars ' + done + '/' + totalChars, 60, H-56);
    ctx.textAlign='right';
    ctx.fillText('supervisionvidaeo:// \u00b7 text-in-video', W-60, H-56);

    /* scanline sweep — extra motion */
    var sy = ((p*1.3) % 1) * H;
    var sg = ctx.createLinearGradient(0,sy-80,0,sy+80);
    sg.addColorStop(0,'rgba(0,234,255,0)');
    sg.addColorStop(0.5,'rgba(0,234,255,0.05)');
    sg.addColorStop(1,'rgba(0,234,255,0)');
    ctx.fillStyle = sg; ctx.fillRect(0,sy-80,W,160);
  }

  window.__renderFrame = function(i,total){ render(i/Math.max(1,total-1)); };
  window.__textVideo = { lines: LINES, title: TITLE };
  render(0);
})();
</script>
</body>
</html>
