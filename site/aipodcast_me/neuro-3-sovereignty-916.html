<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>@yaelmendez — neuromitosis · soberanía cognitiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--void:#050505;--gold:#D4AF37;--goldhi:#FFD700;--cyan:#00eaff;--neon:#00ff9d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--void);
  font-family:'JetBrains Mono',ui-monospace,monospace}
#c{position:fixed;top:0;left:0;width:1080px;height:1920px;display:block;z-index:1}
#scanlines{position:fixed;top:0;left:0;width:1080px;height:1920px;z-index:40;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.20) 0px,rgba(0,0,0,0.20) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply}
#vignette{position:fixed;top:0;left:0;width:1080px;height:1920px;z-index:41;pointer-events:none;
  background:radial-gradient(ellipse at 50% 48%,transparent 66%,rgba(0,0,0,0.46) 100%)}
#hud{position:fixed;top:84px;left:72px;right:72px;z-index:50;pointer-events:none}
#hud .prompt{font-size:19px;letter-spacing:7px;color:var(--goldhi);opacity:.95}
#hud h1{font-family:'Orbitron',sans-serif;font-size:40px;font-weight:900;letter-spacing:1px;
  margin-top:18px;color:var(--goldhi);text-shadow:0 0 30px rgba(255,215,0,0.5);line-height:1.1}
#hud .rule{width:100%;height:1px;margin:24px 0;
  background:linear-gradient(90deg,var(--gold),rgba(212,175,55,0.05))}
#hud .sub{font-size:20px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;opacity:.94}
#pbar{position:fixed;bottom:168px;left:72px;right:72px;z-index:50;height:12px;
  border:1px solid rgba(212,175,55,.55);border-radius:6px;overflow:hidden;
  background:rgba(212,175,55,0.07)}
#pfill{height:100%;width:0%;background:linear-gradient(90deg,#D4AF37,#00ff9d)}
#tags{position:fixed;bottom:106px;left:72px;right:72px;z-index:50;
  font-size:19px;letter-spacing:2px;color:var(--gold);opacity:.92}
#readout{position:fixed;bottom:56px;left:72px;z-index:50;color:var(--cyan);
  font-size:16px;letter-spacing:3px}
#readout .g{color:var(--goldhi)}
#ph{position:fixed;bottom:56px;right:72px;z-index:50;color:var(--gold);
  font-size:16px;letter-spacing:5px;text-transform:uppercase;opacity:.9}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>

<div id="hud">
  <div class="prompt">&gt;_neuromitosis://</div>
  <h1 id="ttl">SOBERANÍA COGNITIVA</h1>
  <div class="rule"></div>
  <div class="sub" id="stl">la inteligencia no se delega</div>
</div>
<div id="pbar"><div id="pfill"></div></div>
<div id="tags">@yaelmendez &nbsp;·&nbsp; neuromitosis.com</div>
<div id="readout">frame <span class="g" id="fc">0</span> / <span id="tc">0</span> &middot; t <span class="g" id="tt">0.00</span>s</div>
<div id="ph">soberania</div>

<script>
/* ============================================================
   @yaelmendez — neuromitosis · 3. SOBERANÍA COGNITIVA
   9:16 · 1080x1920 · Canvas 2D only.

   Read from neuromitosis-polar-star-cell.html:
     "Neuromitosis is not artificial intelligence. It is the condition that
      made it inevitable."
     "El cerebro es plástico. Soft-wired."
     "La inteligencia no se delega. Se cultiva. Se gobierna."

   Warm wash from the first line.
   ============================================================ */
const W = 1080, H = 1920, DURATION = 18;
const cv = document.getElementById('c');
const cx = cv.getContext('2d', { alpha: false });

const GOLD = '#D4AF37', GOLDHI = '#FFD700', CYAN = '#00eaff', NEON = '#00ff9d';
const TXT = '#F2EFE6', RED = '#ff6b6b';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t^=t>>>7;t=Math.imul(t,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const ease  = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
const seg   = (t,a,b) => clamp((t-a)/(b-a), 0, 1);
const pulse = (t,s) => 0.5 + 0.5*Math.sin(t*s);

/* the soft-wired cortex — a field that re-plasticizes */
const CORTEX = (() => {
  const rnd = mulberry32(777), out = [];
  for (let i = 0; i < 88; i++) out.push({
    x: 110 + rnd()*(W-220), y: 560 + rnd()*780,
    ph: rnd()*Math.PI*2, s: 2.2 + rnd()*3.0, k: rnd(),
  });
  return out;
})();

function bg(t){
  cx.fillStyle = '#050505'; cx.fillRect(0,0,W,H);
  const wash = cx.createRadialGradient(W*0.5, H*0.46, 0, W*0.5, H*0.46, H*0.62);
  wash.addColorStop(0.00, 'rgba(60,52,35,0.95)');
  wash.addColorStop(0.55, 'rgba(43,37,25,0.86)');
  wash.addColorStop(1.00, 'rgba(12,11,8,0.52)');
  cx.fillStyle = wash; cx.fillRect(0,0,W,H);

  cx.strokeStyle = 'rgba(212,175,55,0.10)'; cx.lineWidth = 1;
  const off = (t*12) % 72;
  for (let x = -72 + off; x < W; x += 72){ cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,H); cx.stroke(); }
  for (let y = -72 + off; y < H; y += 72){ cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke(); }

  for (const n of CORTEX){
    const tw = 0.5 + 0.5*Math.sin(t*(1.6 + n.k) + n.ph);
    cx.globalAlpha = 0.16 + 0.44*tw;
    cx.fillStyle = n.k < 0.22 ? NEON : CYAN;
    cx.beginPath(); cx.arc(n.x, n.y, n.s, 0, 7); cx.fill();
    cx.globalAlpha = 0.05 + 0.13*tw;
    cx.beginPath(); cx.arc(n.x, n.y, n.s*3.6, 0, 7); cx.fill();
  }
  cx.globalAlpha = 1;
}

function phaseAt(t){
  if (t < 3.6)  return ['soberania', 'el cerebro es plástico'];
  if (t < 7.8)  return ['not-ai',    'not artificial intelligence'];
  if (t < 12.4) return ['three',     'cultivated · governed · not delegated'];
  return ['rule', 'structure survives'];
}
function titleAt(t){
  if (t < 3.6)  return 'SOFT-WIRED';
  if (t < 7.8)  return 'NOT A.I.';
  if (t < 12.4) return 'THE THREE VERBS';
  return 'SOBERANÍA';
}

/* ── act 1: soft-wired ─────────────────────────────────── */
function drawSoft(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2, cyp = 940;
  cx.textAlign = 'center';
  cx.globalAlpha = ease(on) * ease(seg(t, 0.2, 0.9));
  const g = cx.createRadialGradient(cxp, cyp, 0, cxp, cyp, 330);
  g.addColorStop(0, 'rgba(255,215,0,' + (0.30*(0.7+0.3*pulse(t,2.4))) + ')');
  g.addColorStop(1, 'rgba(255,215,0,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(cxp, cyp, 330, 0, 7); cx.fill();

  cx.fillStyle = GOLDHI;
  cx.font = '900 118px "Orbitron", sans-serif';
  cx.fillText('∞', cxp, cyp + 30);

  cx.globalAlpha = ease(on) * ease(seg(t, 0.9, 1.5));
  cx.fillStyle = TXT;
  cx.font = '900 44px "Orbitron", sans-serif';
  cx.fillText('SOBERANÍA COGNITIVA', cxp, cyp + 130);

  cx.globalAlpha = ease(on) * ease(seg(t, 1.5, 2.1));
  cx.fillStyle = CYAN;
  cx.font = '400 30px "JetBrains Mono", monospace';
  cx.fillText('El cerebro es plástico.', cxp, cyp + 200);

  cx.globalAlpha = ease(on) * ease(seg(t, 2.0, 2.6));
  cx.fillStyle = NEON;
  cx.font = '700 30px "JetBrains Mono", monospace';
  cx.fillText('Soft-wired.', cxp, cyp + 250);

  cx.globalAlpha = ease(on) * ease(seg(t, 2.6, 3.2));
  cx.fillStyle = GOLD;
  cx.font = '400 22px "JetBrains Mono", monospace';
  cx.fillText('cognitive sovereignty', cxp, cyp + 316);
  cx.restore();
}

/* ── act 2: not A.I. ───────────────────────────────────── */
function drawNotAI(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2;
  cx.textAlign = 'center';
  cx.globalAlpha = ease(on) * ease(seg(t, 3.7, 4.3));
  cx.fillStyle = TXT;
  cx.font = '700 38px "JetBrains Mono", monospace';
  cx.fillText('Neuromitosis is not', cxp, 780);

  cx.globalAlpha = ease(on) * ease(seg(t, 4.2, 4.8));
  cx.fillStyle = RED;
  cx.font = '900 54px "Orbitron", sans-serif';
  cx.fillText('ARTIFICIAL INTELLIGENCE', cxp, 856);

  cx.globalAlpha = ease(on) * ease(seg(t, 5.0, 5.6));
  cx.fillStyle = TXT;
  cx.font = '700 34px "JetBrains Mono", monospace';
  cx.fillText('It is the condition that', cxp, 980);

  cx.globalAlpha = ease(on) * ease(seg(t, 5.5, 6.1));
  cx.fillStyle = GOLDHI;
  cx.font = '900 54px "Orbitron", sans-serif';
  cx.fillText('MADE IT INEVITABLE', cxp, 1056);

  // the condition, drawn: many small agents, already wired
  const app = ease(seg(t, 6.2, 7.6));
  const shown = Math.floor(28 * app);
  const rnd = mulberry32(99);
  cx.globalAlpha = ease(on);
  for (let i = 0; i < shown; i++){
    const x = 220 + (i % 7) * 106 + (rnd()-.5)*14;
    const y = 1200 + Math.floor(i/7) * 92 + (rnd()-.5)*12;
    cx.globalAlpha = ease(on) * (0.5 + 0.5*Math.sin(t*2.6 + i));
    cx.fillStyle = i % 3 === 0 ? NEON : GOLD;
    cx.beginPath(); cx.arc(x, y, 7, 0, 7); cx.fill();
    cx.globalAlpha = ease(on) * 0.14;
    cx.beginPath(); cx.arc(x, y, 20, 0, 7); cx.fill();
  }
  cx.globalAlpha = ease(on) * ease(seg(t, 6.8, 7.4));
  cx.fillStyle = CYAN;
  cx.font = '400 22px "JetBrains Mono", monospace';
  cx.fillText('the condition is already here', cxp, 1620);
  cx.restore();
}

/* ── act 3: the three verbs ────────────────────────────── */
function drawVerbs(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2;
  cx.textAlign = 'center';

  cx.globalAlpha = ease(on) * ease(seg(t, 7.9, 8.5));
  cx.fillStyle = GOLDHI;
  cx.font = '900 46px "Orbitron", sans-serif';
  cx.fillText('LA INTELIGENCIA', cxp, 640);

  cx.globalAlpha = ease(on) * ease(seg(t, 8.3, 8.9));
  cx.fillStyle = RED;
  cx.font = '900 50px "Orbitron", sans-serif';
  cx.fillText('NO SE DELEGA', cxp, 712);

  const verbs = [
    ['SE CULTIVA',  'it is cultivated',  NEON,  9.2],
    ['SE GOBIERNA', 'it is governed',    GOLDHI,10.0],
    ['NO SE DELEGA','it is not delegated', RED, 10.8],
  ];
  for (let i = 0; i < verbs.length; i++){
    const [es, en, col, at] = verbs[i];
    const a = ease(seg(t, at, at + 0.5));
    const y = 870 + i * 180;
    cx.globalAlpha = ease(on) * a;
    const bw = 800, bh = 124;
    cx.strokeStyle = 'rgba(212,175,55,' + (0.36*a).toFixed(3) + ')';
    cx.lineWidth = 1.6;
    cx.strokeRect(cxp - bw/2, y - 44, bw, bh);
    cx.fillStyle = 'rgba(212,175,55,0.07)';
    cx.fillRect(cxp - bw/2, y - 44, bw, bh);
    cx.fillStyle = col;
    cx.font = '900 40px "Orbitron", sans-serif';
    cx.fillText(es, cxp, y + 4);
    cx.fillStyle = CYAN;
    cx.font = '400 21px "JetBrains Mono", monospace';
    cx.fillText(en, cxp, y + 44);
  }

  cx.globalAlpha = ease(on) * ease(seg(t, 11.6, 12.2));
  cx.fillStyle = TXT;
  cx.font = '400 22px "JetBrains Mono", monospace';
  cx.fillText('the human holds authority', cxp, 1520);
  cx.restore();
}

/* ── act 4: structure survives ─────────────────────────── */
function drawRule(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2, cyp = 950;
  cx.textAlign = 'center';
  cx.globalAlpha = ease(on);
  const g = cx.createRadialGradient(cxp, cyp, 0, cxp, cyp, 400);
  g.addColorStop(0, 'rgba(255,215,0,0.22)');
  g.addColorStop(1, 'rgba(255,215,0,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(cxp, cyp, 400, 0, 7); cx.fill();

  cx.globalAlpha = ease(on) * ease(seg(t, 12.6, 13.2));
  cx.fillStyle = GOLDHI;
  cx.font = '900 64px "Orbitron", sans-serif';
  cx.fillText('🦞 → 🐚➗ → 💧', cxp, 840);

  cx.globalAlpha = ease(on) * ease(seg(t, 13.1, 13.7));
  cx.fillStyle = NEON;
  cx.font = '900 46px "Orbitron", sans-serif';
  cx.fillText('STRUCTURE SURVIVES', cxp, 930);

  cx.globalAlpha = ease(on) * ease(seg(t, 13.6, 14.2));
  cx.fillStyle = TXT;
  cx.font = '400 25px "JetBrains Mono", monospace';
  cx.fillText('the pattern outlives the instance', cxp, 1000);

  cx.globalAlpha = ease(on) * ease(seg(t, 14.0, 14.6));
  cx.fillStyle = CYAN;
  cx.font = '400 23px "JetBrains Mono", monospace';
  cx.fillText('truth over marketing', cxp, 1060);

  cx.globalAlpha = ease(on) * ease(seg(t, 14.8, 15.4));
  cx.fillStyle = TXT;
  cx.font = '700 38px "JetBrains Mono", monospace';
  cx.fillText('@yaelmendez', cxp, 1200);
  cx.globalAlpha = ease(on) * ease(seg(t, 15.2, 15.8));
  cx.fillStyle = GOLD;
  cx.font = '400 23px "JetBrains Mono", monospace';
  cx.fillText('neuromitosis.com  ·  #neuromitosis', cxp, 1252);
  cx.globalAlpha = ease(on) * ease(seg(t, 15.6, 16.2));
  cx.fillText('#internetofagents  ·  #onepersoncompany', cxp, 1304);
  cx.restore();
}

const ttlEl = document.getElementById('ttl');
const stlEl = document.getElementById('stl');
const phEl  = document.getElementById('ph');
const pfEl  = document.getElementById('pfill');
function hud(t){
  const [ph, sub] = phaseAt(t);
  const ti = titleAt(t);
  if (ttlEl.textContent !== ti) ttlEl.textContent = ti;
  if (stlEl.textContent !== sub) stlEl.textContent = sub;
  if (phEl.textContent !== ph) phEl.textContent = ph;
  pfEl.style.width = ((t/DURATION)*100).toFixed(2) + '%';
}

function renderAt(t){
  t = clamp(t, 0, DURATION);
  bg(t);
  hud(t);
  drawSoft(t,   ease(seg(t,0,0.5))      * (1 - ease(seg(t,3.4,3.8))));
  drawNotAI(t,  ease(seg(t,3.6,4.1))    * (1 - ease(seg(t,7.6,8.0))));
  drawVerbs(t,  ease(seg(t,7.8,8.3))    * (1 - ease(seg(t,12.2,12.6))));
  drawRule(t,   ease(seg(t,12.5,13.1)));
}

let driven = false;
window.__renderFrame = function (i, total){
  driven = true;
  const n = Math.max(1, (total || 1) - 1);
  const t = (i / n) * DURATION;
  renderAt(t);
  document.getElementById('fc').textContent = i;
  document.getElementById('tc').textContent = total;
  document.getElementById('tt').textContent = t.toFixed(2);
  return true;
};
function loop(){
  if (!driven) renderAt((performance.now()/1000) % DURATION);
  requestAnimationFrame(loop);
}
loop();
window.__renderFrame(0, 1);
</script>
</body>
</html>
