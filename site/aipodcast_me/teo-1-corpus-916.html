<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>teologia.ai — el corpus · 1517 → 1580</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--void:#050505;--gold:#D4AF37;--goldhi:#FFD700;--cyan:#00eaff;--neon:#00ff9d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--void);
  font-family:'JetBrains Mono',ui-monospace,monospace}
#c{position:fixed;top:0;left:0;width:1080px;height:1920px;display:block;z-index:1}
#scanlines{position:fixed;top:0;left:0;width:1080px;height:1920px;z-index:40;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0.20) 0px,rgba(0,0,0,0.20) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply}
#vignette{position:fixed;top:0;left:0;width:1080px;height:1920px;z-index:41;pointer-events:none;
  background:radial-gradient(ellipse at 50% 48%,transparent 66%,rgba(0,0,0,0.46) 100%)}
#hud{position:fixed;top:84px;left:72px;right:72px;z-index:50;pointer-events:none}
#hud .prompt{font-size:19px;letter-spacing:7px;color:var(--goldhi);opacity:.95}
#hud h1{font-family:'Orbitron',sans-serif;font-size:42px;font-weight:900;letter-spacing:1px;
  margin-top:18px;color:var(--goldhi);text-shadow:0 0 30px rgba(255,215,0,0.5);line-height:1.1}
#hud .rule{width:100%;height:1px;margin:24px 0;
  background:linear-gradient(90deg,var(--gold),rgba(212,175,55,0.05))}
#hud .sub{font-size:20px;letter-spacing:3px;color:var(--cyan);text-transform:uppercase;opacity:.94}
#pbar{position:fixed;bottom:168px;left:72px;right:72px;z-index:50;height:12px;
  border:1px solid rgba(212,175,55,.55);border-radius:6px;overflow:hidden;
  background:rgba(212,175,55,0.07)}
#pfill{height:100%;width:0%;background:linear-gradient(90deg,#D4AF37,#00ff9d)}
#tags{position:fixed;bottom:106px;left:72px;right:72px;z-index:50;
  font-size:19px;letter-spacing:2px;color:var(--gold);opacity:.92}
#readout{position:fixed;bottom:56px;left:72px;z-index:50;color:var(--cyan);
  font-size:16px;letter-spacing:3px}
#readout .g{color:var(--goldhi)}
#ph{position:fixed;bottom:56px;right:72px;z-index:50;color:var(--gold);
  font-size:16px;letter-spacing:5px;text-transform:uppercase;opacity:.9}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>

<div id="hud">
  <div class="prompt">&gt;_teologia://</div>
  <h1 id="ttl">EL CORPUS</h1>
  <div class="rule"></div>
  <div class="sub" id="stl">devoción diaria · 17 artefactos</div>
</div>
<div id="pbar"><div id="pfill"></div></div>
<div id="tags">teologia.ai &nbsp;·&nbsp; es-LATAM</div>
<div id="readout">frame <span class="g" id="fc">0</span> / <span id="tc">0</span> &middot; t <span class="g" id="tt">0.00</span>s</div>
<div id="ph">corpus</div>

<script>
/* ============================================================
   teologia.ai — 1. EL CORPUS
   9:16 · 1080x1920 · Canvas 2D only.

   The 17 artifacts and their dates are read from
   teologia/platform-manifest.json (17 entries, all sha256-verified) and from
   the descriptions on teologia/index.html. Nothing invented.

   Warm wash from the first line: gold on void #050505 is luminance 5.
   ============================================================ */
const W = 1080, H = 1920, DURATION = 18;
const cv = document.getElementById('c');
const cx = cv.getContext('2d', { alpha: false });

const GOLD = '#D4AF37', GOLDHI = '#FFD700', CYAN = '#00eaff', NEON = '#00ff9d';
const TXT = '#F2EFE6';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t^=t>>>7;t=Math.imul(t,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const ease  = x => x < 0.5 ? 2*x*x : 1 - Math.pow(-2*x+2, 2)/2;
const seg   = (t,a,b) => clamp((t-a)/(b-a), 0, 1);
const pulse = (t,s) => 0.5 + 0.5*Math.sin(t*s);

/* the 17 artifacts, in manifest order, with the dates the index states */
const DOCS = [
  ['1517', 'Las 95 Tesis'],
  ['1520', 'A la Nobleza Cristiana'],
  ['1520', 'La Cautividad Babilónica'],
  ['1520', 'La Libertad Cristiana'],
  ['1529', 'Catecismo Menor'],
  ['1529', 'Catecismo Mayor'],
  ['1529', 'Enchiridion'],
  ['1530', 'Confesión de Augsburgo'],
  ['1531', 'Apología de la Confesión'],
  ['1535', 'Una manera sencilla de orar'],
  ['1537', 'Artículos de Smalcalda'],
  ['1537', 'Tratado del Primado'],
  ['1577', 'Fórmula de Concordia'],
  ['1580', 'Libro de Concordia'],
  ['✝',    'Credo Apostólico'],
  ['325',  'Credo Niceno'],
  ['✝',    'Credo Atanasiano'],
];

function bg(t){
  cx.fillStyle = '#050505'; cx.fillRect(0,0,W,H);
  const wash = cx.createRadialGradient(W*0.5, H*0.46, 0, W*0.5, H*0.46, H*0.62);
  wash.addColorStop(0.00, 'rgba(60,52,35,0.95)');
  wash.addColorStop(0.55, 'rgba(43,37,25,0.86)');
  wash.addColorStop(1.00, 'rgba(12,11,8,0.52)');
  cx.fillStyle = wash; cx.fillRect(0,0,W,H);

  cx.strokeStyle = 'rgba(212,175,55,0.10)'; cx.lineWidth = 1;
  const off = (t*12) % 72;
  for (let x = -72 + off; x < W; x += 72){ cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x,H); cx.stroke(); }
  for (let y = -72 + off; y < H; y += 72){ cx.beginPath(); cx.moveTo(0,y); cx.lineTo(W,y); cx.stroke(); }
}

function phaseAt(t){
  if (t < 3.2)  return ['corpus',  'devoción diaria · 17 artefactos'];
  if (t < 12.6) return ['docs',    '1517 → 1580'];
  return ['one', 'solo scriptura · solo fide · solo gratia'];
}
function titleAt(t){
  if (t < 3.2)  return 'EL CORPUS';
  if (t < 12.6) return '1517 → 1580';
  return 'UNA SOLA PLATAFORMA';
}

/* ── act 1: the corpus ─────────────────────────────────── */
function drawIntro(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2, cyp = 930;
  cx.textAlign = 'center';
  cx.globalAlpha = ease(on) * ease(seg(t, 0.2, 0.9));
  const g = cx.createRadialGradient(cxp, cyp, 0, cxp, cyp, 340);
  g.addColorStop(0, 'rgba(255,215,0,' + (0.30*(0.7+0.3*pulse(t,2.4))) + ')');
  g.addColorStop(1, 'rgba(255,215,0,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(cxp, cyp, 340, 0, 7); cx.fill();

  cx.fillStyle = GOLDHI;
  cx.font = '900 76px "Orbitron", sans-serif';
  cx.fillText('teologia.ai', cxp, cyp + 10);

  cx.globalAlpha = ease(on) * ease(seg(t, 0.9, 1.5));
  cx.fillStyle = TXT;
  cx.font = '900 46px "Orbitron", sans-serif';
  cx.fillText('DEVOCIÓN DIARIA', cxp, cyp + 106);

  cx.globalAlpha = ease(on) * ease(seg(t, 1.5, 2.1));
  cx.fillStyle = CYAN;
  cx.font = '400 27px "JetBrains Mono", monospace';
  cx.fillText('17 artefactos canónicos', cxp, cyp + 176);

  cx.globalAlpha = ease(on) * ease(seg(t, 2.1, 2.7));
  cx.fillStyle = GOLD;
  cx.font = '400 24px "JetBrains Mono", monospace';
  cx.fillText('17 chips verificados · sha256', cxp, cyp + 228);

  cx.globalAlpha = ease(on) * ease(seg(t, 2.6, 3.1));
  cx.fillStyle = NEON;
  cx.font = '700 25px "JetBrains Mono", monospace';
  cx.fillText('plataforma soberana · es-LATAM', cxp, cyp + 296);
  cx.restore();
}

/* ── act 2: the documents scroll ───────────────────────── */
function drawDocs(t, on){
  if (on <= 0) return;
  cx.save();
  const per = (12.6 - 3.2) / DOCS.length;
  const first = Math.max(0, Math.floor((t - 3.2) / per) - 1);

  for (let i = first; i < Math.min(DOCS.length, first + 9); i++){
    const [year, name] = DOCS[i];
    const at = 3.2 + i * per;
    const a = ease(seg(t, at, at + per*0.5));
    const y = 420 + (i - first) * 128;

    cx.globalAlpha = ease(on) * a;

    // the year
    cx.textAlign = 'right';
    cx.fillStyle = year === '✝' ? CYAN : GOLD;
    cx.font = '900 34px "Orbitron", sans-serif';
    cx.fillText(year, 250, y + 10);

    // the rule between year and title
    cx.strokeStyle = 'rgba(212,175,55,0.30)'; cx.lineWidth = 1.4;
    cx.beginPath(); cx.moveTo(276, y + 2); cx.lineTo(310, y + 2); cx.stroke();

    // the title
    cx.textAlign = 'left';
    cx.fillStyle = TXT;
    cx.font = '700 29px "JetBrains Mono", monospace';
    cx.fillText(name, 336, y + 10);

    // a rail on the left so the column reads as one timeline
    cx.globalAlpha = ease(on) * a * 0.55;
    cx.strokeStyle = GOLD; cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(96, y - 30); cx.lineTo(96, y + 46); cx.stroke();
    cx.fillStyle = GOLD;
    cx.beginPath(); cx.arc(96, y + 6, 5.5, 0, 7); cx.fill();
  }

  cx.textAlign = 'center';
  cx.globalAlpha = ease(on) * ease(seg(t, 11.8, 12.4));
  cx.fillStyle = GOLDHI;
  cx.font = '700 27px "JetBrains Mono", monospace';
  cx.fillText('63 años · 17 documentos', W/2, 1680);
  cx.restore();
}

/* ── act 3: the three solas ────────────────────────────── */
function drawSolas(t, on){
  if (on <= 0) return;
  cx.save();
  const cxp = W/2, cyp = 950;
  cx.textAlign = 'center';
  cx.globalAlpha = ease(on);
  const g = cx.createRadialGradient(cxp, cyp, 0, cxp, cyp, 400);
  g.addColorStop(0, 'rgba(255,215,0,0.22)');
  g.addColorStop(1, 'rgba(255,215,0,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(cxp, cyp, 400, 0, 7); cx.fill();

  const solas = ['SOLO SCRIPTURA', 'SOLO FIDE', 'SOLO GRATIA'];
  for (let i = 0; i < solas.length; i++){
    const at = 12.9 + i*0.55;
    const a = ease(seg(t, at, at + 0.45));
    const y = 820 + i*160;
    cx.globalAlpha = ease(on) * a;
    const bw = 720, bh = 112;
    cx.strokeStyle = 'rgba(212,175,55,' + (0.40*a).toFixed(3) + ')';
    cx.lineWidth = 1.6;
    cx.strokeRect(cxp - bw/2, y - 36, bw, bh);
    cx.fillStyle = 'rgba(212,175,55,0.08)';
    cx.fillRect(cxp - bw/2, y - 36, bw, bh);
    cx.fillStyle = i === 0 ? GOLDHI : (i === 1 ? CYAN : NEON);
    cx.font = '900 44px "Orbitron", sans-serif';
    cx.fillText(solas[i], cxp, y + 30);
  }

  cx.globalAlpha = ease(on) * ease(seg(t, 14.6, 15.2));
  cx.fillStyle = TXT;
  cx.font = '400 24px "JetBrains Mono", monospace';
  cx.fillText('la fe que obra por el amor', cxp, 1400);

  cx.globalAlpha = ease(on) * ease(seg(t, 15.4, 16.0));
  cx.fillStyle = TXT;
  cx.font = '700 38px "JetBrains Mono", monospace';
  cx.fillText('teologia.ai', cxp, 1520);
  cx.globalAlpha = ease(on) * ease(seg(t, 15.8, 16.4));
  cx.fillStyle = GOLD;
  cx.font = '400 23px "JetBrains Mono", monospace';
  cx.fillText('solo scriptura · solo fide · solo gratia', cxp, 1572);
  cx.restore();
}

const ttlEl = document.getElementById('ttl');
const stlEl = document.getElementById('stl');
const phEl  = document.getElementById('ph');
const pfEl  = document.getElementById('pfill');
function hud(t){
  const [ph, sub] = phaseAt(t);
  const ti = titleAt(t);
  if (ttlEl.textContent !== ti) ttlEl.textContent = ti;
  if (stlEl.textContent !== sub) stlEl.textContent = sub;
  if (phEl.textContent !== ph) phEl.textContent = ph;
  pfEl.style.width = ((t/DURATION)*100).toFixed(2) + '%';
}

function renderAt(t){
  t = clamp(t, 0, DURATION);
  bg(t);
  hud(t);
  drawIntro(t, ease(seg(t,0,0.5))     * (1 - ease(seg(t,3.0,3.4))));
  drawDocs(t,  ease(seg(t,3.2,3.7))   * (1 - ease(seg(t,12.4,12.8))));
  drawSolas(t, ease(seg(t,12.7,13.2)));
}

let driven = false;
window.__renderFrame = function (i, total){
  driven = true;
  const n = Math.max(1, (total || 1) - 1);
  const t = (i / n) * DURATION;
  renderAt(t);
  document.getElementById('fc').textContent = i;
  document.getElementById('tc').textContent = total;
  document.getElementById('tt').textContent = t.toFixed(2);
  return true;
};
function loop(){
  if (!driven) renderAt((performance.now()/1000) % DURATION);
  requestAnimationFrame(loop);
}
loop();
window.__renderFrame(0, 1);
</script>
</body>
</html>
