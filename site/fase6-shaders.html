<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>æ:// fase6-shaders — Advanced Shaders</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#050505;color:#D4AF37;font-family:'JetBrains Mono','Consolas',monospace}
#root{position:relative;width:100%;height:100%}
.scanlines{position:absolute;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.20) 3px,rgba(0,0,0,.20) 4px)}
#hud{position:absolute;top:0;left:0;right:0;padding:15px 40px;z-index:10}
#hud h1{font-size:20px;font-weight:700;letter-spacing:.15em}
#stats{position:absolute;top:15px;right:40px;font-size:10px;text-align:right}
#stats div{margin:2px 0}
</style>
</head>
<body>
<div id="root" data-width="1920" data-height="1080">
<div id="hud"><h1>æ:// fase6-shaders</h1>
<div id="stats"><div id="panel">Technique: ray-marching</div><div id="fps">FPS: --</div></div>
</div>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="scanlines"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
var W=1920,H=1080,scene,camera,renderer,clock,frame=0,currentTechnique=0,lastTime=0;
var materials=[],currentMesh;
var rayVert='varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}';
var rayFrag='varying vec2 vUv;uniform float uTime;uniform vec2 uResolution;uniform vec3 uColor1;uniform vec3 uColor2;float sdSphere(vec3 p,float r){return length(p)-r;}float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0);}float opSU(float a,float b,float k){float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);return mix(b,a,h)-k*h*(1.0-h);}float map(vec3 p){float d=sdSphere(p,1.0);d=opSU(d,sdBox(p-vec3(sin(uTime)*0.5,cos(uTime*0.7)*0.5,0),vec3(0.4)),0.3);return d;}vec3 calcNormal(vec3 p){vec2 e=vec2(0.001,0.0);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}void main(){vec2 uv=(gl_FragCoord.xy-0.5*uResolution)/uResolution.y;vec3 ro=vec3(0.0,0.0,3.0);vec3 rd=normalize(vec3(uv,-1.5));float t=0.0;vec3 col=vec3(0.0);for(int i=0;i<80;i++){vec3 p=ro+rd*t;float d=map(p);if(d<0.001){vec3 n=calcNormal(p);vec3 lightDir=normalize(vec3(1.0,1.0,1.0));float diff=max(dot(n,lightDir),0.0);float fresnel=pow(1.0-max(dot(n,-rd),0.0),3.0);col=mix(uColor1,uColor2,diff)+vec3(0.0,0.1,0.2)*fresnel;break;}t+=d;if(t>10.0)break;}if(t>=10.0){col=uColor1*0.1+uColor2*0.05;}gl_FragColor=vec4(col,1.0);}';
var volFrag='varying vec2 vUv;uniform float uTime;uniform vec2 uResolution;uniform vec3 uColor1;uniform vec3 uColor2;float hash(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,45.164)))*43758.5453);}float noise(vec3 p){vec3 i=floor(p);vec3 f=fract(p);f=f*f*(3.0-2.0*f);float n=i.x+i.y*57.0+i.z*113.0;float a=hash(i);float b=hash(i+vec3(1,0,0));float c=hash(i+vec3(0,1,0));float d=hash(i+vec3(0,0,1));float e=hash(i+vec3(1,1,0));float f2=hash(i+vec3(1,0,1));float g=hash(i+vec3(0,1,1));float h=hash(i+vec3(1,1,1));return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),mix(mix(e,f2,f.x),mix(g,h,f.x),f.y),f.z);}float fbm(vec3 p){float total=0.0;float amp=0.5;for(int i=0;i<5;i++){total+=noise(p)*amp;p*=2.0;amp*=0.5;}return total;}void main(){vec2 uv=(gl_FragCoord.xy-0.5*uResolution)/uResolution.y;vec3 ro=vec3(0.0,0.0,3.0);vec3 rd=normalize(vec3(uv,-1.5));float t=0.0;vec3 col=vec3(0.0);for(int i=0;i<60;i++){vec3 p=ro+rd*t;float n=fbm(p*2.0+uTime*0.3);float d=smoothstep(0.3,0.7,n);col+=mix(uColor1,uColor2,n)*d*0.1;t+=0.1;if(t>6.0)break;}col+=uColor1*0.05;gl_FragColor=vec4(col,1.0);}';
var tessVert='varying vec2 vUv;varying vec3 vNormal;uniform float uTime;void main(){vUv=uv;vNormal=normalize(normalMatrix*normal);vec3 pos=position;pos.y+=sin(pos.x*3.0+uTime)*0.5;pos.z+=cos(pos.y*3.0+uTime*0.7)*0.3;gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.0);}';
var tessFrag='varying vec2 vUv;varying vec3 vNormal;uniform float uTime;uniform vec3 uColor1;uniform vec3 uColor2;void main(){vec3 lightDir=normalize(vec3(0.5,0.8,0.5));float diff=max(dot(vNormal,lightDir),0.0);float fresnel=pow(1.0-max(dot(vNormal,vec3(0.0,0.0,1.0)),0.0),2.0);vec3 col=mix(uColor1,uColor2,diff);col+=vec3(0.0,0.1,0.2)*fresnel;gl_FragColor=vec4(col,1.0);}';
function init(){
scene=new THREE.Scene();scene.background=new THREE.Color(0x0a0f1a);
camera=new THREE.PerspectiveCamera(50,W/H,0.1,200);camera.position.set(0,0,3);camera.lookAt(0,0,0);
renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,alpha:true});renderer.setSize(W,H);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=2.2;
scene.add(new THREE.AmbientLight(0xffffff,1.8));
var dirLight=new THREE.DirectionalLight(0xD4AF37,2.5);dirLight.position.set(10,20,15);scene.add(dirLight);
var pointLight=new THREE.PointLight(0x00eaff,1.5,100);pointLight.position.set(-10,-5,10);scene.add(pointLight);
var gold=new THREE.Color(0xD4AF37),cyan=new THREE.Color(0x00eaff);
materials[0]=new THREE.ShaderMaterial({vertexShader:rayVert,fragmentShader:rayFrag,uniforms:{uTime:{value:0},uResolution:{value:new THREE.Vector2(W,H)},uColor1:{value:gold},uColor2:{value:cyan}}});
materials[1]=new THREE.ShaderMaterial({vertexShader:rayVert,fragmentShader:volFrag,uniforms:{uTime:{value:0},uResolution:{value:new THREE.Vector2(W,H)},uColor1:{value:gold},uColor2:{value:cyan}}});
materials[2]=new THREE.ShaderMaterial({vertexShader:tessVert,fragmentShader:tessFrag,uniforms:{uTime:{value:0},uColor1:{value:gold},uColor2:{value:cyan}},side:THREE.DoubleSide});
var geo=new THREE.PlaneGeometry(8,8,64,64);currentMesh=new THREE.Mesh(geo,materials[2]);scene.add(currentMesh);
clock=new THREE.Clock();//animate();
}
function updateHUD(){document.getElementById('panel').textContent='Technique: '+['Ray Marching','Volumetric','Tessellation'][currentTechnique];}
function switchTechnique(idx){currentTechnique=idx;currentMesh.material=materials[idx];updateHUD();}
//function animate(){requestAnimationFrame(animate);frame++;var t=clock.getElapsedTime();
//if(currentMesh.material.uniforms.uTime){currentMesh.material.uniforms.uTime.value=t;}
//if(frame===200)switchTechnique(0);if(frame===400)switchTechnique(1);if(frame===600)switchTechnique(2);
//if(frame%120===0){var delta=t-lastTime;if(delta>0){document.getElementById('fps').textContent='FPS: '+Math.round(1/delta);}lastTime=t;}
//renderer.render(scene,camera);}
window.__renderFrame=function(i,total){if(!renderer)return;var p=i/Math.max(1,total-1);var t=p*10;var techIdx=Math.floor(p*3);if(techIdx>2)techIdx=2;currentTechnique=techIdx;currentMesh.material=materials[techIdx];if(currentMesh.material.uniforms.uTime){currentMesh.material.uniforms.uTime.value=t;}renderer.render(scene,camera);};
init();
</script>

       alt="QR Verify" style="width:100%;height:100%;display:block;">
