[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinygpu"
version = "0.1.0"
description = "A complete deterministic GPU robot renderer in 527 lines. Real CAD, one million triangles a frame, two pip installs, zero build dependency."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Yæl Méndez", email = "yael@llm.store" }]
keywords = ["cuda", "cupy", "renderer", "robotics", "humanoid", "deterministic", "opensourceware"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
cuda = ["cupy-cuda13x>=13"]
cuda12 = ["cupy-cuda12x>=13"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://myaelmendez.github.io/refusal.html"
Repository = "https://github.com/MYaelMendez/tinyGPU"
Results = "https://github.com/MYaelMendez/tinyGPU/blob/main/RESULTS.md"

[project.scripts]
tinygpu = "tinygpu:main"

[tool.setuptools]
py-modules = ["tinygpu", "rtx_raster"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
