[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinypython-robot"
version = "0.1.0"
description = "A humanoid that walks, in one file. Policy-driven locomotion on a laptop CPU — motion that emerges from control, not keyframes."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Yæl Méndez", email = "yael@llm.store" }]
keywords = ["robotics", "humanoid", "locomotion", "mujoco", "onnx", "asimov", "opensourceware"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "mujoco>=3.3", "onnxruntime>=1.17"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://myaelmendez.github.io/refusal.html"
Repository = "https://github.com/MYaelMendez/tinyPython"

[project.scripts]
tinypython = "tinypython:main"

[tool.setuptools]
py-modules = ["tinypython"]

[tool.pytest.ini_options]
testpaths = ["tests"]
