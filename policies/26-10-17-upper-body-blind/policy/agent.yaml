seed: 44
device: cuda:2
num_steps_per_env: 24
max_iterations: 10000
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - critic
clip_actions: null
check_for_nan: true
save_interval: 500
experiment_name: asimov_velocity_upper_body_blind_amp
run_name: coordinated_upper_body_blind_actor_16k
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
critic:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg: null
algorithm:
  class_name: isaac_asimov.algorithms.amp_ppo:AMPPPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.005
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
  amp_data:
    class_type: isaac_asimov.tasks.locomotion.motion_dataset:MotionDataset
    asset_name: robot
    motion_files:
    - policy_delay_walk_slow_repaired.npz
    - policy_delay_walk_slow_repaired_mirrored.npz
    joint_names:
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
    body_names:
    - left_ankle_roll_link
    - right_ankle_roll_link
    amp_obs_terms:
    - joint_pos
    - joint_vel
    anchor_name: pelvis_link
  amp_obs_key: amp
  amp_reward_coef: 0.3
  amp_task_reward_lerp: 0.7
  amp_discr_hidden_dims:
  - 256
  - 256
  amp_discr_activation: relu
  amp_feature_normalization: true
  amp_grad_pen_lambda: 10.0
  amp_replay_buffer_size: 100000
  amp_discr_trunk_weight_decay: 0.001
  amp_discr_head_weight_decay: 0.1
  amp_update_interval: 1
  amp_reward_command_gate: true
  amp_reward_command_name: twist
  amp_reward_command_threshold: 0.1
  amp_rollout_obs_clip: 500.0
  amp_min_normalized_std: 0.0
policy: {}
